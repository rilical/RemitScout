version: 1
skills:
  - skill_id: "probe.provider.aws_scheduled"
    purpose: "Provider probe runs on AWS via scheduled Lambda/EventBridge (read-only evidence + metrics)."
    executor: "aws_scheduled"
    job: "infrastructure/cdk/lib/scheduled-jobs.ts#provider-probe-lambda"
    required_inputs:
      provider_id: "string"
    outputs:
      metrics_namespace: "RemitScout/Probes"
    risk_tier: 1

  - skill_id: "forensics.corridor_provider.local"
    purpose: "Explain why a provider is missing for a corridor (rights/capability/quotes/refresh)."
    executor: "local_codex"
    command: "pnpm -C backend corridor:forensics"
    required_inputs:
      corridor_id: "string"
      amount: "number"
      method: "string"
    outputs:
      stdout: "json"
    risk_tier: 0

  - skill_id: "observe.dev.local"
    purpose: "Run dev observation checks (stack/alarms/queues/logs) for a time window."
    executor: "local_codex"
    command: "bash ops/observe-dev.sh"
    required_inputs:
      session_file: "string"
    outputs:
      stdout: "text"
    risk_tier: 0

  - skill_id: "manual.human_triage"
    purpose: "Human review/triage required (confirm severity, scope, and next action)."
    executor: "manual"
    outputs:
      decision: "comment/approval"
    risk_tier: 0

  - skill_id: "provider.scaffold.local"
    purpose: "Scaffold a new provider (folder + registry + catalog + config defaults)."
    executor: "local_codex"
    command: "pnpm -C backend provider:scaffold"
    required_inputs:
      provider_id: "string"
      display_name: "string"
      supports_b2b: "0|1"
      supports_b2c: "0|1"
    outputs:
      stdout: "text"
    risk_tier: 1

  - skill_id: "provider.onboarding.local"
    purpose: "Run deterministic provider onboarding orchestration (scaffold, probes, evidence, smoke, remit-score, review card) from a single v1 contract."
    executor: "local_codex"
    command: "pnpm -C backend provider:onboarding-orchestrator"
    required_inputs:
      providers: "json"
      execution_env: "dev|staging|prod"
      ci_ref: "string"
    outputs:
      artifact: "artifacts/provider-onboarding/<run_id>/provider-onboarding-run.json"
      files: "per-provider artifacts + evidence payloads"
    risk_tier: 1
