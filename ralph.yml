# Ralph Orchestrator Configuration
# Generated by: ralph init --backend codex
# Docs: https://github.com/mikeyobrien/ralph-orchestrator

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 100
  # max_runtime_seconds: 14400    # 4 hours max

# ─────────────────────────────────────────────────────────────────────────────
# Additional Configuration (uncomment to customize)
# ─────────────────────────────────────────────────────────────────────────────

# core:
#   scratchpad: ".ralph/agent/scratchpad.md"
#   specs_dir: ".ralph/specs/"

# Custom hats for multi-agent workflows:
hats:
  refactorer:
    name: "Refactorer"
    description: "Executes a single atomic refactor step safely."
    triggers: ["refactor.task"]
    publishes: ["refactor.done", "refactor.blocked"]
    default_publishes: refactor.done
    instructions: |
      ## REFACTORER MODE

      Execute ONE refactoring step safely.

      Publish `refactor.done` when complete, otherwise `refactor.blocked`.

  verifier:
    name: "Verifier"
    description: "Verifies refactoring preserved behavior via tests and checks."
    triggers: ["refactor.done"]
    publishes: ["verify.passed", "verify.failed", "verifier.noop"]
    # Important: Ralph merges hat configs with built-in defaults.
    # The default verifier hat sets `default_publishes: verify.passed`, which can
    # auto-emit an empty payload (missing `quality.*`).
    #
    # NOTE: YAML `null` and the empty string "" can be treated as "unset" during
    # Ralph's internal merge/normalization, allowing the built-in
    # `default_publishes: verify.passed` to sneak back in.
    #
    # Pragmatic hardening: override the built-in default to a NON-verify topic.
    # This ensures no auto-emitted `verify.*` event can ever lack `quality.*`.
    default_publishes: verifier.noop
    instructions: |
      ## VERIFIER MODE (Node/TypeScript)

      Goal: Always emit a structured JSON payload that includes quality fields.

      Hard requirement: the payload MUST always include all `quality` keys
      (`tests`, `coverage`, `lint`, `audit`, `mutation`, `complexity`) even when
      failing early. If a signal is unavailable, set that field to `"n/a"`.

      ### Emitting `verify.*` events (REQUIRED)
      Do NOT call `ralph emit verify.passed` / `ralph emit verify.failed` directly.
      That is the #1 source of drift (missing `quality.*` keys).

      Blessed path: run the repo helper, which *collects* signals and *emits*
      a normalized payload with all required `quality.*` keys:

      ```bash
      node scripts/verifier/run-frontend-quality.mjs --emit verify.passed
      # or, if checks did not pass
      node scripts/verifier/run-frontend-quality.mjs --emit verify.failed
      ```

      Notes:
      - Default mode is diff-scoped (only checks changed `frontend/` files).
      - Use `--full` to force full frontend lint/typecheck.
      - Use `--run-unit-tests` to attempt Vitest.
      - Use `--dry-run` to print the normalized JSON payload without emitting.
      - Do NOT run `cargo`/Rust checks in this repo (not applicable).

      Failure rule:
      - On any failure, emit `verify.failed` (never emit `verify.passed`).
      - If `run-frontend-quality` throws while `--emit` is set, it will
        best-effort emit a contract-valid `verify.failed` payload with
        `quality.* = n/a` plus an `error.message`.

      ### Suggested commands (repo default)

      This repo is a Node/TS monorepo, and backend lint currently has known debt.
      To avoid blocking *frontend* audit/proof iterations on unrelated backend
      ESLint errors, default to a **frontend-scoped** verification gate.

      Preferred (single command + stable payload):

      ```bash
      node scripts/verifier/run-frontend-quality.mjs --emit verify.passed
      # or, if checks did not pass
      node scripts/verifier/run-frontend-quality.mjs --emit verify.failed
      ```


# Create PROMPT.md with your task, then run: ralph run
