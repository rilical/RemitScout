# Ralph Orchestrator Configuration (project config)
#
# This file is tracked to keep the orchestration loop stable across machines
# and CI. In particular, the Verifier must emit `verify.*` via
# `scripts/verifier/emit-verify.mjs` so payloads always include `quality.*` keys.
#
# Docs: https://github.com/mikeyobrien/ralph-orchestrator

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 100

hats:
  refactorer:
    name: "Refactorer"
    description: "Executes a single atomic refactor step safely."
    triggers: ["refactor.task"]
    publishes: ["refactor.done", "refactor.blocked"]
    default_publishes: refactor.done
    instructions: |
      ## REFACTORER MODE

      Execute ONE refactoring step safely.

      Publish `refactor.done` when complete, otherwise `refactor.blocked`.

  verifier:
    name: "Verifier"
    description: "Verifies refactoring preserved behavior via tests and checks."
    triggers: ["refactor.done"]
    publishes: ["verify.passed", "verify.failed"]
    instructions: |
      ## VERIFIER MODE (Node/TypeScript)

      Goal: Always emit a structured JSON payload that includes quality fields.

      Hard requirement: the payload MUST always include all `quality` keys
      (`tests`, `coverage`, `lint`, `audit`, `mutation`, `complexity`) even when
      failing early. If a signal is unavailable, set that field to `"n/a"`.

      ### Emitting `verify.*` events (REQUIRED)
      Do NOT call `ralph emit verify.passed` / `ralph emit verify.failed` directly.
      That is the #1 source of drift (missing `quality.*` keys).

      Do NOT use dotted JSON keys like `"quality.tests"` (that is a *literal* JSON
      key, not an object). The payload must be nested as `quality: { tests: ... }`.

      Also do NOT rely on Ralph's default publish behavior (plain-text payloads).
      This hat must explicitly emit via `scripts/verifier/emit-verify.mjs` so the
      payload is always a JSON object with stable `quality.*` shape.

      Always emit via the repo helper, which normalizes the payload and fills
      missing signals with `"n/a"`:

      ```bash
      node scripts/verifier/emit-verify.mjs verify.passed --json '{"quality":{"tests":{"status":"pass","command":"pnpm -C backend test"}}}'
      ```

      Notes:
      - You may pass a *partial* `quality` object; the helper will add missing keys.
      - Use `--dry-run | jq .quality` to sanity-check the normalized output.

      ### Suggested commands (repo default)
      Start by asserting the schema helper is working (fast drift guard):

      - Required: `pnpm verifier:smoke`

      Then run the actual checks:

      - Tests: `pnpm -C backend test` (include coverage if enabled in Vitest)
      - Build: `pnpm -C backend build`
      - Lint: `pnpm -C backend lint`
