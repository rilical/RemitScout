name: Provider Health Probes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      provider_id:
        description: 'Optional: run a single provider probe (provider_id from .remit-scout/providers/catalog.json)'
        required: false
        type: string
      corridors_csv:
        description: 'Optional: comma-separated corridors for cache TTL probe (e.g., US-MX-USD-MXN,US-PH-USD-PHP)'
        required: false
        type: string
      case_id:
        description: 'Optional: IssueOps case_id for traceability'
        required: false
        type: string
      orchestrator_run_id:
        description: 'Optional: provider onboarding orchestrator run id'
        required: false
        type: string
      ci_ref:
        description: 'Optional: commit/context reference'
        required: false
        type: string
      run_contract_json:
        description: 'Optional: serialized run contract payload'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'backend/scripts/*-probe.ts'
      - 'backend/scripts/provider-probe.ts'
      - 'backend/plane-b/src/providers/**'
      - '.remit-scout/providers/catalog.json'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        env:
          PROVIDER_ONLY: ${{ github.event.inputs.provider_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const p = path.join(process.cwd(), '.remit-scout', 'providers', 'catalog.json');
          const raw = JSON.parse(fs.readFileSync(p, 'utf8'));
          const noProbeProviders = (raw.providers || [])
            .map((x) => ({
              provider_id: String(x?.provider_id || '').trim(),
              aws_scheduled: x?.probe?.aws_scheduled === true,
              github_actions: x?.probe?.github_actions === true,
            }))
            .filter((x) => x.provider_id && !x.aws_scheduled && !x.github_actions)
            .map((x) => x.provider_id);
          if (noProbeProviders.length > 0) {
            console.error(`providers missing both probe paths: ${noProbeProviders.join(', ')}`);
            process.exit(3);
          }
          const providers = (raw.providers || [])
            .filter((x) => x && x.probe && x.probe.github_actions === true)
            .map((x) => String(x.provider_id || '').trim())
            .filter(Boolean);
          if (providers.length === 0) {
            console.error('No github_actions probe providers found in catalog.');
            process.exit(4);
          }
          const only = String(process.env.PROVIDER_ONLY || '').trim();
          if (only) {
            if (!providers.includes(only)) {
              console.error(`provider_id not eligible for GitHub Actions probe: '${only}'`);
              console.error(`eligible providers: ${providers.join(', ')}`);
              process.exit(2);
            }
            providers.length = 0;
            providers.push(only);
          }
          providers.sort();
          const matrix = { provider: providers };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          console.log('probe providers:', providers.join(', '));
          NODE

  probe-all:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: Run ${{ matrix.provider }} probe
        env:
          PROBE_TIMEOUT_MS: 300000
          PROBE_RETRIES: 1
          PROBE_OUTPUT_FORMAT: json
          PROBE_OUTPUT_FILE: probe-results.json
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          PROVIDER_ID: ${{ matrix.provider }}
          ORCHESTRATOR_RUN_ID: ${{ github.event.inputs.orchestrator_run_id }}
          CI_REF: ${{ github.event.inputs.ci_ref }}
          RUN_CONTRACT_JSON: ${{ github.event.inputs.run_contract_json }}
        run: pnpm -C backend probe:provider
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.provider }}-results
          path: probe-results.json
          if-no-files-found: ignore

  cache-ttl-probe:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: Run cache TTL probe
        env:
          PROBE_TIMEOUT_MS: 60000
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          CACHE_TTL_TEST_CORRIDORS: ${{ github.event.inputs.corridors_csv }}
        run: pnpm -C backend probe:cache-ttl
