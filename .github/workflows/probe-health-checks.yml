name: Provider Health Probes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      provider_id:
        description: 'Optional: run a single provider probe (provider_id from .remit-scout/providers/catalog.json)'
        required: false
        type: string
      case_id:
        description: 'Optional: IssueOps case_id for traceability'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'backend/scripts/*-probe.ts'
      - 'backend/scripts/provider-probe.ts'
      - 'backend/plane-b/src/providers/**'
      - '.remit-scout/providers/catalog.json'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        env:
          PROVIDER_ONLY: ${{ github.event.inputs.provider_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const p = path.join(process.cwd(), '.remit-scout', 'providers', 'catalog.json');
          const raw = JSON.parse(fs.readFileSync(p, 'utf8'));
          const providers = (raw.providers || [])
            .filter((x) => x && x.probe && x.probe.github_actions === true)
            .map((x) => String(x.provider_id || '').trim())
            .filter(Boolean);
          const only = String(process.env.PROVIDER_ONLY || '').trim();
          if (only) {
            if (!providers.includes(only)) {
              console.error(`provider_id not eligible for GitHub Actions probe: '${only}'`);
              console.error(`eligible providers: ${providers.join(', ')}`);
              process.exit(2);
            }
            providers.length = 0;
            providers.push(only);
          }
          providers.sort();
          const matrix = { provider: providers };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          console.log('probe providers:', providers.join(', '));
          NODE

  probe-all:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.provider }} probe
        env:
          PROBE_TIMEOUT_MS: 300000
          PROBE_RETRIES: 1
          PROBE_OUTPUT_FORMAT: json
          PROBE_OUTPUT_FILE: probe-results.json
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          PROVIDER_ID: ${{ matrix.provider }}
        run: pnpm -C backend probe:provider
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.provider }}-results
          path: probe-results.json
          if-no-files-found: ignore

  cache-ttl-probe:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.provider_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run cache TTL probe
        env:
          PROBE_TIMEOUT_MS: 60000
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
        run: pnpm -C backend probe:cache-ttl
