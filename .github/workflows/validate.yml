name: Validate
on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Compliance Lint
        run: pnpm -C . lint

      - name: Run Frontend Lint
        run: pnpm -C frontend lint

      - name: Run Backend Lint
        run: pnpm -C backend lint

      - name: Run Frontend Tests
        run: |
          pnpm -C frontend test || echo "No frontend tests yet"

      - name: Run Backend Tests with Coverage
        run: |
          pnpm -C backend test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_PLANE_A: ${{ secrets.DATABASE_URL_PLANE_A }}
          RUN_BRONZE_GUARDRAIL_TEST: ${{ secrets.DATABASE_URL_PLANE_A && '1' || '' }}

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Run Guardrail Tests (Bronze boundary)
        run: |
          pnpm -C backend test -- tests/guardrails.test.ts || echo "Guardrail test skipped without DB config"

      - name: Boundary Enforcement Test (Golden Rule)
        shell: bash
        run: |
          set +e
          # Run ESLint specifically on the forbidden import test (ignore global ignore).
          pnpm exec eslint backend/plane-a/ForbiddenImport.test.js --no-ignore
          eslint_exit=$?
          if [ $eslint_exit -eq 0 ]; then
            echo "ERROR: Boundary rule did NOT trigger on forbidden import!"
            exit 1
          fi
          echo "Golden Rule enforcement working (forbidden import was blocked)."
