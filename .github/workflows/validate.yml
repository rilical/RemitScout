name: Validate
on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install Dependencies
        run: pnpm install

      - name: Run Compliance Lint
        run: pnpm -C . lint

      - name: Run Frontend Lint
        run: pnpm -C frontend lint

      - name: Run Backend Lint
        run: pnpm -C backend lint

      - name: Run Tests (if any)
        run: |
          pnpm -C frontend test || echo "No frontend tests yet"
          pnpm -C backend test || echo "No backend tests yet"

      - name: Run Guardrail Tests (Bronze boundary)
        run: |
          pnpm -C backend test -- tests/guardrails.test.ts || echo "Guardrail test skipped without DB config"

      - name: Boundary Enforcement Test (Golden Rule)
        shell: bash
        run: |
          set +e
          # Run ESLint specifically on the forbidden import test (ignore global ignore).
          pnpm exec eslint backend/plane-a/ForbiddenImport.test.js --no-ignore
          eslint_exit=$?
          if [ $eslint_exit -eq 0 ]; then
            echo "ERROR: Boundary rule did NOT trigger on forbidden import!"
            exit 1
          fi
          echo "Golden Rule enforcement working (forbidden import was blocked)."
