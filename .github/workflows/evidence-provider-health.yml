name: Evidence - Provider Health

run-name: Evidence - Provider Health (case=${{ inputs.case_id }} dispatch=${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: IssueOps case_id (for traceability + artifact naming)
        required: true
        type: string
      dispatch_id:
        description: Brain dispatch correlation id (uuid)
        required: true
        type: string
      env:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      provider_id:
        description: Provider ID (from .remit-scout/providers/catalog.json)
        required: true
        type: string
      window_hours:
        description: Lookback window hours (default 6)
        required: false
        type: string
      orchestrator_run_id:
        description: Optional provider onboarding orchestrator run id
        required: false
        type: string
      ci_ref:
        description: Optional commit/context reference from orchestrator contract
        required: false
        type: string
      run_contract_json:
        description: Optional serialized run contract payload for traceability
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: Generate evidence.json
        env:
          ENVIRONMENT: ${{ inputs.env }}
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          PROVIDER_ID: ${{ inputs.provider_id }}
          WINDOW_HOURS: ${{ inputs.window_hours }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          CI_REF: ${{ inputs.ci_ref }}
          RUN_CONTRACT_JSON: ${{ inputs.run_contract_json }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          EVIDENCE_OUTPUT_FILE: evidence.json
        run: pnpm -C backend exec tsx scripts/evidence/provider-health-evidence.ts
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.case_id }}-${{ inputs.dispatch_id }}-provider-health
          path: evidence.json
          if-no-files-found: ignore
          retention-days: 30
