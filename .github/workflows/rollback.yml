name: cd/rollback

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to roll back
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: ECR image tag to deploy (e.g. 1.2.3 or abc1234)
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
      SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Resolve Image Tag (SSM fallback)
        shell: bash
        env:
          ENV_NAME: ${{ inputs.env }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_TAG_INPUT:-}" ]; then
            echo "IMAGE_TAG=${IMAGE_TAG_INPUT}" >> "$GITHUB_ENV"
            exit 0
          fi
          tag="$(aws ssm get-parameter --name \"/remit-scout/${ENV_NAME}/last-good-image\" --query 'Parameter.Value' --output text)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No last-known-good image found in SSM for env=${ENV_NAME}."
            exit 1
          fi
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
      - name: Recover CloudFormation rollback state
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "STACK_NAME is not set; skipping recovery check."
            exit 0
          fi

          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            echo "Stack ${STACK_NAME} not found yet; continuing."
            exit 0
          fi

          status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
          echo "Current stack status: ${status}"
          if [ "${status}" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Detected UPDATE_ROLLBACK_FAILED. Attempting continue-update-rollback."
            aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}" >/dev/null
          fi

          # Wait for stack to reach a deployable state (5 min max)
          for i in $(seq 1 30); do
            status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                echo "Stack is stable: ${status}"
                break
                ;;
              *_IN_PROGRESS|*_CLEANUP_IN_PROGRESS)
                echo "Waiting: ${status} (${i}/30)"
                sleep 10
                ;;
              *)
                echo "::error::Stack not deployable: ${status}"
                exit 1
                ;;
            esac
          done

      - name: Pre-deploy infrastructure health check
        shell: bash
        env:
          ENV_NAME: ${{ inputs.env }}
        run: |
          set -euo pipefail
          cluster_id=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier, '${ENV_NAME}')].DBClusterIdentifier" \
            --output text | head -1)
          if [ -z "$cluster_id" ]; then
            echo "No Aurora cluster found for ${ENV_NAME}; skipping health check."
            exit 0
          fi
          status=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$cluster_id" \
            --query 'DBClusters[0].Status' --output text)
          if [ "$status" = "stopped" ]; then
            echo "::warning::Aurora cluster $cluster_id is stopped. Starting..."
            aws rds start-db-cluster --db-cluster-identifier "$cluster_id"
            aws rds wait db-cluster-available --db-cluster-identifier "$cluster_id"
            echo "Aurora is now available."
          elif [ "$status" != "available" ]; then
            echo "::error::Aurora cluster is in state: $status"
            exit 1
          fi
          echo "Aurora health check passed: $status"

      - name: Roll back stack to image tag
        shell: bash
        env:
          ENV_NAME: ${{ inputs.env }}
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          approval_mode="never"
          if [ "${ENV_NAME}" = "prod" ]; then
            approval_mode="broadening"
          fi
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            --require-approval "${approval_mode}"

          # Run migrations again (forward-only posture). This is idempotent and ensures schema is up to date.
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          assign_ip="DISABLED"
          if [ "$ENV_NAME" = "dev" ]; then assign_ip="ENABLED"; fi

          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          cluster="remit-scout-${ENV_NAME}"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=$assign_ip}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi
