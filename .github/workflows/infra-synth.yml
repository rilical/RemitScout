name: ci/infra-synth

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infrastructure/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      - name: Dependabot non-infra fast-skip
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$ACTOR" = "dependabot[bot]" ] && [ "$INFRA_CHANGED" != "true" ]; then
            skip=true
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
      - name: Dependabot PR skip (no infra changes)
        if: steps.gate.outputs.skip == 'true'
        run: echo "Dependabot PR without infra changes; skipping infra synth."
      - uses: ./.github/actions/setup-node-pnpm
        if: steps.gate.outputs.skip != 'true'
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: CDK synth (dev context)
        if: steps.gate.outputs.skip != 'true' && steps.filter.outputs.infra == 'true'
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          CDK_DEFAULT_REGION: us-east-1
        run: |
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk synth -c env=dev -c backendImageTag=ci --quiet
      - name: IaC scan (Checkov)
        if: steps.gate.outputs.skip != 'true' && steps.filter.outputs.infra == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/cdk
          framework: cdk
      - name: No infra changes
        if: steps.gate.outputs.skip != 'true' && steps.filter.outputs.infra != 'true'
        run: echo "No infrastructure changes; skipping synth."
