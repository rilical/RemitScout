name: compliance-guard

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - staging
      - master

jobs:
  compliance-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run compliance guard
        run: bash backend/scripts/compliance-guard.sh
