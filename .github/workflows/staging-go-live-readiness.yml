name: staging/go-live-readiness
run-name: staging/go-live-readiness (${{ inputs.deploy_sha }})

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact deployed commit SHA to validate during readiness
        required: true
        type: string
      run_runtime_config_validation:
        description: Also run backend runtime config schema validation
        required: true
        type: boolean
        default: true
      skip_duplicate_admin_smoke:
        description: Deprecated compatibility flag; staging readiness always runs privileged admin smoke
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.deploy_sha }}

      - name: Validate requested deploy SHA
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.deploy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${EXPECTED_DEPLOY_SHA}"
          actual_sha="$(git rev-parse HEAD)"

          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "::error::Readiness workflow checked out ${actual_sha}, expected ${expected_sha}."
            exit 1
          fi

      - name: Warn when deprecated admin smoke skip flag is set
        if: ${{ inputs.skip_duplicate_admin_smoke }}
        run: |
          echo "::warning::skip_duplicate_admin_smoke is deprecated and ignored. Staging readiness always runs privileged admin smoke."

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Configure AWS credentials (staging readiness, optional)
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          retry-max-attempts: 2

      - name: Require AWS credentials for staging readiness evidence
        if: ${{ steps.aws_creds.outcome != 'success' }}
        run: |
          echo "Unable to assume the staging AWS role. Readiness evidence requires AWS credentials."
          exit 1

      - name: Warn on non-prod security drift (staging readiness)
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV_NAME: staging
        run: |
          set -uo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)"
          if [ -z "${account_id}" ] || [ "${account_id}" = "None" ]; then
            echo "::warning::Unable to resolve AWS account ID for ${ENV_NAME}; skipping GuardDuty/Inspector drift check."
            exit 0
          fi

          detector_ids="$(aws guardduty list-detectors --region "${AWS_REGION}" --query 'DetectorIds' --output text 2>/dev/null || true)"
          if [ -n "${detector_ids}" ] && [ "${detector_ids}" != "None" ]; then
            echo "::warning::GuardDuty remains enabled in ${ENV_NAME} account ${account_id}. Disable it unless non-prod coverage is intentional."
          fi

          inspector_json="$(aws inspector2 batch-get-account-status --account-ids "${account_id}" --region "${AWS_REGION}" --output json 2>/dev/null || true)"
          if [ -z "${inspector_json}" ]; then
            exit 0
          fi

          inspector_state="$(printf '%s' "${inspector_json}" | jq -r '.accounts[0].state.status // empty')"
          enabled_resources="$(printf '%s' "${inspector_json}" | jq -r '[.accounts[0].resourceState | to_entries[]? | select(.value.status == "ENABLED") | .key] | join(",")')"
          if [ "${inspector_state}" = "ENABLED" ]; then
            if [ -n "${enabled_resources}" ] && [ "${enabled_resources}" != "null" ]; then
              echo "::warning::Inspector2 remains enabled in ${ENV_NAME} account ${account_id} for: ${enabled_resources}. Disable it unless non-prod coverage is intentional."
            else
              echo "::warning::Inspector2 remains enabled in ${ENV_NAME} account ${account_id}. Disable it unless non-prod coverage is intentional."
            fi
          fi

      - name: Resolve staging Plane A public API base
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            exit 0
          fi

          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_root=""

          if [ -n "${plane_a_cf:-}" ] && [ "${plane_a_cf}" != "null" ]; then
            api_root="https://${plane_a_cf}"
          elif [ -n "${plane_a_api:-}" ] && [ "${plane_a_api}" != "null" ]; then
            api_root="$(echo "${plane_a_api}" | sed 's:/*$::')"
          fi

          if [ -z "${api_root:-}" ]; then
            echo "::warning::Unable to resolve Plane A public API base from stack outputs; falling back to PUBLIC_API_BASE workflow vars."
            exit 0
          fi

          echo "PUBLIC_API_BASE=${api_root}/api/v1" >> "${GITHUB_ENV}"
          echo "Resolved staging PUBLIC_API_BASE=${api_root}/api/v1"

      - name: Resolve staging DbMigrate ECS runtime
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          ENV_NAME: staging
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "::error::STACK_NAME is required to resolve the staging DbMigrate runtime."
            exit 1
          fi

          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "${subnet_csv:-}" ] || [ "${subnet_csv}" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi

          if [ -z "${task_def:-}" ] || [ "${task_def}" = "null" ]; then
            echo "::error::Unable to resolve DbMigrateTaskDefinitionArn from stack outputs."
            exit 1
          fi
          if [ -z "${sg_id:-}" ] || [ "${sg_id}" = "null" ] || [ -z "${subnet_csv:-}" ] || [ "${subnet_csv}" = "null" ]; then
            echo "::error::Unable to resolve DbMigrate network wiring from stack outputs."
            exit 1
          fi

          container_json="$(
            aws ecs describe-task-definition \
              --task-definition "${task_def}" \
              --query 'taskDefinition.containerDefinitions[?name==`DbMigrateContainer`] | [0]' \
              --output json 2>/dev/null || true
          )"

          if [ -z "${container_json:-}" ] || [ "${container_json}" = "null" ]; then
            echo "::error::Unable to resolve DbMigrateContainer definition."
            exit 1
          fi

          docker_platform="linux/amd64"
          cpu_arch="$(aws ecs describe-task-definition --task-definition "${task_def}" --query 'taskDefinition.runtimePlatform.cpuArchitecture' --output text 2>/dev/null || true)"
          if [ "${cpu_arch:-}" = "ARM64" ]; then
            docker_platform="linux/arm64"
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"

          echo "DB_MIGRATE_TASK_DEF_ARN=${task_def}" >> "${GITHUB_ENV}"
          echo "DB_MIGRATE_CLUSTER=remit-scout-${ENV_NAME}" >> "${GITHUB_ENV}"
          echo "DB_MIGRATE_SECURITY_GROUP_ID=${sg_id}" >> "${GITHUB_ENV}"
          echo "DB_MIGRATE_SUBNET_CSV=${subnet_csv}" >> "${GITHUB_ENV}"
          echo "DB_MIGRATE_DOCKER_PLATFORM=${docker_platform}" >> "${GITHUB_ENV}"
          echo "DB_MIGRATE_ECR_REPO=remit-scout-backend-${ENV_NAME}" >> "${GITHUB_ENV}"
          echo "AWS_ACCOUNT_ID=${account_id}" >> "${GITHUB_ENV}"

      - name: Resolve current staging migration version via ECS
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          task_def_json="$(aws ecs describe-task-definition --task-definition "${DB_MIGRATE_TASK_DEF_ARN}" --query 'taskDefinition' --output json)"
          log_group="$(printf '%s' "${task_def_json}" | jq -r '.containerDefinitions[] | select(.name=="DbMigrateContainer") | .logConfiguration.options."awslogs-group" // empty')"
          read_version_cmd="$(cat <<'EOF'
          node - <<'NODE'
          const { resolveDatabaseUrl } = require('./backend/dist/shared/aws-params.js')
          const { createPool } = require('./backend/dist/shared/db.js')

          const resolveUrls = async () => {
            await resolveDatabaseUrl({
              envVar: 'DATABASE_URL_PLANE_B',
              secretArnEnv: 'PLANE_B_DB_SECRET_ARN',
              ssmNameEnv: 'PLANE_B_DB_SSM_NAME',
              hostEnv: 'PLANE_B_DB_HOST',
              portEnv: 'PLANE_B_DB_PORT',
              nameEnv: 'PLANE_B_DB_NAME',
              usernameEnv: 'PLANE_B_DB_USERNAME',
              passwordEnv: 'PLANE_B_DB_PASSWORD',
              requireJson: true,
              required: true,
              sslModeEnv: 'PGSSLMODE',
              jsonKeys: ['url', 'DATABASE_URL_PLANE_B', 'database_url'],
            })
            await resolveDatabaseUrl({
              envVar: 'DATABASE_URL_PLANE_B_MIGRATOR',
              secretArnEnv: 'PLANE_B_DB_MIGRATOR_SECRET_ARN',
              ssmNameEnv: 'PLANE_B_DB_MIGRATOR_SSM_NAME',
              hostEnv: 'PLANE_B_DB_MIGRATOR_HOST',
              portEnv: 'PLANE_B_DB_MIGRATOR_PORT',
              nameEnv: 'PLANE_B_DB_MIGRATOR_NAME',
              usernameEnv: 'PLANE_B_DB_MIGRATOR_USERNAME',
              passwordEnv: 'PLANE_B_DB_MIGRATOR_PASSWORD',
              requireJson: true,
              required: false,
              sslModeEnv: 'PGSSLMODE',
              jsonKeys: ['url', 'DATABASE_URL_PLANE_B_MIGRATOR', 'database_url'],
            })
          }

          ;(async () => {
            await resolveUrls()
            const url = process.env.DATABASE_URL_PLANE_B_MIGRATOR || process.env.DATABASE_URL_PLANE_B
            const pool = createPool(url)
            await pool.query(`
              CREATE TABLE IF NOT EXISTS public.schema_migrations (
                id TEXT PRIMARY KEY,
                applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              )
            `)
            const result = await pool.query(`
              SELECT COALESCE(MAX(id), '000_noop.sql') AS id
              FROM public.schema_migrations
            `)
            process.stdout.write(String(result.rows[0]?.id || '000_noop.sql'))
            await pool.end()
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack || error.message : String(error))
            process.exit(1)
          })
          NODE
          EOF
          )"

          IFS=',' read -r -a subnets <<< "${DB_MIGRATE_SUBNET_CSV}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          overrides="$(jq -cn --arg cmd "${read_version_cmd}" '{containerOverrides:[{name:"DbMigrateContainer",command:["sh","-lc",$cmd]}]}')"
          task_arn="$(aws ecs run-task \
            --cluster "${DB_MIGRATE_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${DB_MIGRATE_TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"${DB_MIGRATE_SECURITY_GROUP_ID}\"],assignPublicIp=DISABLED}" \
            --overrides "${overrides}" \
            --query 'tasks[0].taskArn' \
            --output text)"
          aws ecs wait tasks-stopped --cluster "${DB_MIGRATE_CLUSTER}" --tasks "${task_arn}"
          task_json="$(aws ecs describe-tasks --cluster "${DB_MIGRATE_CLUSTER}" --tasks "${task_arn}" --output json)"
          printf '%s\n' "${task_json}" > .smoke-artifacts/staging-migration-version-task.json
          exit_code="$(printf '%s' "${task_json}" | jq -r '.tasks[0].containers[] | select(.name=="DbMigrateContainer") | .exitCode // "null"')"
          log_stream="$(printf '%s' "${task_json}" | jq -r '.tasks[0].containers[] | select(.name=="DbMigrateContainer") | .logStreamName // empty')"
          if [ -z "${log_stream:-}" ] || [ "${log_stream}" = "null" ]; then
            task_id="${task_arn##*/}"
            log_stream="db-migrate/DbMigrateContainer/${task_id}"
          fi
          if [ -n "${log_group:-}" ] && [ "${log_group}" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "${log_group}" \
              --log-stream-name "${log_stream}" \
              --limit 200 \
              --query 'events[].message' \
              --output text | tee .smoke-artifacts/staging-migration-current-version.log || true
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "::error::Unable to query current staging migration version via ECS."
            exit 1
          fi
          current_id="$(tr '\t' '\n' < .smoke-artifacts/staging-migration-current-version.log | tail -n 1 | tr -d '\r' | xargs)"
          if ! printf '%s' "${current_id}" | grep -Eq '^[0-9]+_'; then
            echo "::error::Unexpected current migration id: ${current_id:-<empty>}"
            exit 1
          fi
          current_version="${current_id%%_*}"
          echo "READINESS_CURRENT_MIGRATION_ID=${current_id}" >> "${GITHUB_ENV}"
          echo "READINESS_CURRENT_MIGRATION_VERSION=$((10#${current_version}))" >> "${GITHUB_ENV}"

      - name: Build pending exact-SHA migration payload (staging readiness)
        shell: bash
        env:
          CURRENT_VERSION: ${{ env.READINESS_CURRENT_MIGRATION_VERSION }}
        run: |
          set -euo pipefail
          node <<'NODE' > .smoke-artifacts/staging-pending-migrations.json
          const fs = require('fs')
          const path = require('path')

          const currentVersion = Number(process.env.CURRENT_VERSION || '0')
          const migrationsDir = path.resolve('backend/db/migrations')
          const files = fs
            .readdirSync(migrationsDir)
            .filter((file) => file.endsWith('.sql') && file !== 'TEMPLATE.sql')
            .sort()
            .filter((file) => {
              const match = file.match(/^(\d+)_/)
              return match ? Number(match[1]) > currentVersion : false
            })

          const parseForwardSql = (content) => {
            const impossibleMarker = '-- @rollback impossible'
            const marker = '-- @rollback'
            if (content.includes(impossibleMarker)) {
              return content.substring(0, content.indexOf(impossibleMarker)).trim()
            }
            if (content.includes(marker)) {
              return content.substring(0, content.indexOf(marker)).trim()
            }
            return content.trim()
          }

          const pending = files.map((file) => ({
            file,
            forwardSql: parseForwardSql(fs.readFileSync(path.join(migrationsDir, file), 'utf8')),
          }))

          process.stdout.write(JSON.stringify(pending))
          NODE

          pending_count="$(jq 'length' .smoke-artifacts/staging-pending-migrations.json)"
          payload_b64="$(base64 < .smoke-artifacts/staging-pending-migrations.json | tr -d '\n')"
          echo "READINESS_PENDING_MIGRATION_COUNT=${pending_count}" >> "${GITHUB_ENV}"
          echo "READINESS_PENDING_MIGRATIONS_B64=${payload_b64}" >> "${GITHUB_ENV}"

      - name: Apply repo migrations from exact SHA via ECS (staging readiness)
        if: env.READINESS_PENDING_MIGRATION_COUNT != '0'
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          READINESS_PENDING_MIGRATIONS_B64: ${{ env.READINESS_PENDING_MIGRATIONS_B64 }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          task_def_json="$(aws ecs describe-task-definition --task-definition "${DB_MIGRATE_TASK_DEF_ARN}" --query 'taskDefinition' --output json)"
          log_group="$(printf '%s' "${task_def_json}" | jq -r '.containerDefinitions[] | select(.name=="DbMigrateContainer") | .logConfiguration.options."awslogs-group" // empty')"
          apply_cmd="$(cat <<'EOF'
          node - <<'NODE'
          const { resolveDatabaseUrl } = require('./backend/dist/shared/aws-params.js')
          const { createPool } = require('./backend/dist/shared/db.js')

          const resolveUrls = async () => {
            await resolveDatabaseUrl({
              envVar: 'DATABASE_URL_PLANE_B',
              secretArnEnv: 'PLANE_B_DB_SECRET_ARN',
              ssmNameEnv: 'PLANE_B_DB_SSM_NAME',
              hostEnv: 'PLANE_B_DB_HOST',
              portEnv: 'PLANE_B_DB_PORT',
              nameEnv: 'PLANE_B_DB_NAME',
              usernameEnv: 'PLANE_B_DB_USERNAME',
              passwordEnv: 'PLANE_B_DB_PASSWORD',
              requireJson: true,
              required: true,
              sslModeEnv: 'PGSSLMODE',
              jsonKeys: ['url', 'DATABASE_URL_PLANE_B', 'database_url'],
            })
            await resolveDatabaseUrl({
              envVar: 'DATABASE_URL_PLANE_B_MIGRATOR',
              secretArnEnv: 'PLANE_B_DB_MIGRATOR_SECRET_ARN',
              ssmNameEnv: 'PLANE_B_DB_MIGRATOR_SSM_NAME',
              hostEnv: 'PLANE_B_DB_MIGRATOR_HOST',
              portEnv: 'PLANE_B_DB_MIGRATOR_PORT',
              nameEnv: 'PLANE_B_DB_MIGRATOR_NAME',
              usernameEnv: 'PLANE_B_DB_MIGRATOR_USERNAME',
              passwordEnv: 'PLANE_B_DB_MIGRATOR_PASSWORD',
              requireJson: true,
              required: false,
              sslModeEnv: 'PGSSLMODE',
              jsonKeys: ['url', 'DATABASE_URL_PLANE_B_MIGRATOR', 'database_url'],
            })
          }

          ;(async () => {
            const payload = JSON.parse(Buffer.from(process.env.READINESS_PENDING_MIGRATIONS_B64, 'base64').toString('utf8'))
            await resolveUrls()
            const url = process.env.DATABASE_URL_PLANE_B_MIGRATOR || process.env.DATABASE_URL_PLANE_B
            const pool = createPool(url)
            await pool.query(`
              CREATE TABLE IF NOT EXISTS public.schema_migrations (
                id TEXT PRIMARY KEY,
                applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              )
            `)
            const applied = new Set((await pool.query('SELECT id FROM public.schema_migrations')).rows.map((row) => row.id))
            for (const migration of payload) {
              if (applied.has(migration.file)) {
                console.log(`skip ${migration.file}`)
                continue
              }
              await pool.query('BEGIN')
              try {
                await pool.query(migration.forwardSql)
                await pool.query(
                  'INSERT INTO public.schema_migrations (id) VALUES ($1) ON CONFLICT (id) DO NOTHING',
                  [migration.file],
                )
                await pool.query('COMMIT')
                console.log(`applied ${migration.file}`)
              } catch (error) {
                await pool.query('ROLLBACK')
                throw error
              }
            }
            await pool.end()
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack || error.message : String(error))
            process.exit(1)
          })
          NODE
          EOF
          )"
          env_overrides="$(jq -cn --arg payload "${READINESS_PENDING_MIGRATIONS_B64}" '[{name:"READINESS_PENDING_MIGRATIONS_B64",value:$payload}]')"
          overrides="$(jq -cn --arg cmd "${apply_cmd}" --argjson env "${env_overrides}" '{containerOverrides:[{name:"DbMigrateContainer",command:["sh","-lc",$cmd],environment:$env}]}')"

          IFS=',' read -r -a subnets <<< "${DB_MIGRATE_SUBNET_CSV}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "${DB_MIGRATE_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${DB_MIGRATE_TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"${DB_MIGRATE_SECURITY_GROUP_ID}\"],assignPublicIp=DISABLED}" \
            --overrides "${overrides}" \
            --query 'tasks[0].taskArn' \
            --output text)"
          printf '%s\n' "${task_arn}" > .smoke-artifacts/staging-migration-task-arn.txt

          aws ecs wait tasks-stopped --cluster "${DB_MIGRATE_CLUSTER}" --tasks "${task_arn}"
          task_json="$(aws ecs describe-tasks --cluster "${DB_MIGRATE_CLUSTER}" --tasks "${task_arn}" --output json)"
          printf '%s\n' "${task_json}" > .smoke-artifacts/staging-migration-task.json
          exit_code="$(printf '%s' "${task_json}" | jq -r '.tasks[0].containers[] | select(.name=="DbMigrateContainer") | .exitCode // "null"')"
          log_stream="$(printf '%s' "${task_json}" | jq -r '.tasks[0].containers[] | select(.name=="DbMigrateContainer") | .logStreamName // empty')"
          if [ -z "${log_stream:-}" ] || [ "${log_stream}" = "null" ]; then
            task_id="${task_arn##*/}"
            log_stream="db-migrate/DbMigrateContainer/${task_id}"
          fi
          if [ -n "${log_group:-}" ] && [ "${log_group}" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "${log_group}" \
              --log-stream-name "${log_stream}" \
              --limit 200 \
              --query 'events[].message' \
              --output text | tee .smoke-artifacts/staging-migration-apply.log || true
          fi
          if [ "${exit_code}" != "0" ]; then
            echo "::error::Candidate migration task failed (exitCode=${exit_code}) via ${task_arn}"
            exit 1
          fi

      - name: Persist ECS migration sync evidence (staging readiness)
        shell: bash
        env:
          READINESS_PENDING_MIGRATION_COUNT: ${{ env.READINESS_PENDING_MIGRATION_COUNT }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const pendingCount = Number(process.env.READINESS_PENDING_MIGRATION_COUNT || '0')
          const pending = JSON.parse(
            fs.readFileSync('.smoke-artifacts/staging-pending-migrations.json', 'utf8'),
          )
          const evaluation = {
            missingSchemaMigrationsTable: false,
            pendingRepoMigrations: pendingCount === 0 ? pending.map((item) => item.file) : [],
            unexpectedAppliedMigrations: [],
          }
          const payload = {
            schemaVersion: 'staging-migration-sync-evidence@v1',
            status: evaluation.pendingRepoMigrations.length === 0 ? 'pass' : 'fail',
            evaluation,
          }
          const outputPath = path.join(
            process.env.GITHUB_WORKSPACE,
            '.smoke-artifacts',
            'staging-migration-sync-evidence.json',
          )
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(payload, null, 2)}\n`,
            'utf8',
          )
          NODE
          echo "STAGING_MIGRATION_SYNC_RESULT_PATH=${GITHUB_WORKSPACE}/.smoke-artifacts/staging-migration-sync-evidence.json" >> "${GITHUB_ENV}"

      - name: Staging go-live readiness (integrations + policy)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          STACK_NAME: ${{ vars.STACK_NAME }}
          SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
          SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
          SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BRONZE_S3_BUCKET: ${{ vars.BRONZE_S3_BUCKET }}
          EXPORTS_S3_BUCKET: ${{ vars.EXPORTS_S3_BUCKET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_BASE: ${{ env.PUBLIC_API_BASE || vars.PUBLIC_API_BASE }}
          PLANE_A_DOMAIN_NAME: ${{ vars.PLANE_A_DOMAIN_NAME }}
          PLANE_A_CERT_ARN: ${{ vars.PLANE_A_CERT_ARN }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
