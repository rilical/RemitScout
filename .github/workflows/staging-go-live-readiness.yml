      - name: Build release evidence manifest (staging hard gate)
        env:
          READINESS_DEPLOY_SHA: ${{ inputs.deploy_sha }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          STAGING_MIGRATION_SYNC_RESULT_PATH: ${{ env.STAGING_MIGRATION_SYNC_RESULT_PATH }}
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/.smoke-artifacts
          RELEASE_EVIDENCE_PATH: ${{ github.workspace }}/.smoke-artifacts/staging-go-live-release-evidence.json
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          pnpm -C backend exec tsx scripts/ci/staging-go-live-readiness.ts \
            --write-release-evidence \
            --artifact-dir "${RELEASE_ARTIFACT_DIR}" \
            --output "${RELEASE_EVIDENCE_PATH}"
          jq -e '
            .schemaVersion == "staging-go-live-release-evidence@v1" and
            .status == "pass" and
            (.violations | length) == 0 and
            (.artifacts.missingFiles | length) == 0 and
            (.artifacts.misleadingFiles | length) == 0
          ' "${RELEASE_EVIDENCE_PATH}" >/dev/null

      - name: Upload staging admin smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-readiness-admin-smoke-evidence
          path: |
            .smoke-artifacts
            frontend/playwright-report
            frontend/test-results
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload staging go-live release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-go-live-release-evidence
          path: .smoke-artifacts/staging-go-live-release-evidence.json
          retention-days: 90
          if-no-files-found: error
