      - name: Verify runner IP is allowlisted for staging admin smoke
        env:
          DEFAULT_ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST || vars.WAF_ADMIN_ALLOWLIST_IPS }}
        run: |
          set -euo pipefail
          admin_allowlist="${ADMIN_IP_ALLOWLIST:-${WAF_ADMIN_ALLOWLIST_IPS:-${DEFAULT_ADMIN_IP_ALLOWLIST:-}}}"
          if [ -z "${admin_allowlist:-}" ]; then
            echo "Missing ADMIN_IP_ALLOWLIST/WAF_ADMIN_ALLOWLIST_IPS for staging admin smoke."
            exit 1
          fi
          runner_ip="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"
          python3 - "$runner_ip" "$admin_allowlist" <<'PY'
          import ipaddress
          import sys

          runner_ip = ipaddress.ip_address(sys.argv[1].strip())
          allowlist_raw = sys.argv[2]

          for token in [item.strip() for item in allowlist_raw.split(',') if item.strip()]:
              network = ipaddress.ip_network(token if '/' in token else f"{token}/32", strict=False)
              if runner_ip in network:
                  print(f"Runner IP {runner_ip} is allowlisted by {network}")
                  raise SystemExit(0)

          print(f"Runner IP {runner_ip} is not present in ADMIN_IP_ALLOWLIST.", file=sys.stderr)
          raise SystemExit(1)
          PY

