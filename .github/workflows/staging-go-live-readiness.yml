            outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
            plane_c_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneCApiUrl") | .OutputValue')"
            if [ -n "${plane_c_api:-}" ] && [ "${plane_c_api}" != "null" ]; then
              export PLANE_C_BASE_URL="${plane_c_api}"
            fi
          fi
          pnpm -C backend ci:config-validate

      - name: Resume staging operational services for parity evidence
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          cluster="remit-scout-staging"
          pause_param="/remit-scout/staging/ops/paused"
          ecs_services_param="/remit-scout/staging/ops/pause/ecs-services"
          ecs_baseline_param="/remit-scout/staging/ops/pause/ecs-baseline"
          rule_prefix="remit-scout-staging-"
          staging_profile="infrastructure/cdk/profiles/staging.json"

          services_json="$(aws ssm get-parameter \
            --region "${AWS_REGION}" \
            --name "${ecs_services_param}" \
            --query 'Parameter.Value' \
            --output text)"
          baseline_json="$(aws ssm get-parameter \
            --region "${AWS_REGION}" \
            --name "${ecs_baseline_param}" \
            --query 'Parameter.Value' \
            --output text)"

          if [ -z "${services_json:-}" ] || [ "${services_json}" = "None" ]; then
            echo "::error::Missing staging ops ECS services parameter: ${ecs_services_param}"
            exit 1
          fi
          if [ -z "${baseline_json:-}" ] || [ "${baseline_json}" = "None" ]; then
            echo "::error::Missing staging ops ECS baseline parameter: ${ecs_baseline_param}"
            exit 1
          fi

          aws ssm put-parameter \
            --region "${AWS_REGION}" \
            --name "${pause_param}" \
            --type String \
            --value "false" \
            --overwrite >/dev/null

          rules_to_enable=()
          if [ -f "${staging_profile}" ]; then
            mapfile -t rules_to_enable < <(
              jq -r --arg prefix "${rule_prefix}" '
                (.opsResumeRuleAllowlist // [])[]? |
                strings |
                select(length > 0) |
                if startswith($prefix) then . else ($prefix + .) end
              ' "${staging_profile}"
            )
          fi

          if [ "${#rules_to_enable[@]}" -eq 0 ]; then
            mapfile -t rules_to_enable < <(
              aws events list-rules \
                --region "${AWS_REGION}" \
                --name-prefix "${rule_prefix}" \
                --output json | jq -r '.Rules[]? | .Name // empty'
            )
          else
            mapfile -t all_rules < <(
              aws events list-rules \
                --region "${AWS_REGION}" \
                --name-prefix "${rule_prefix}" \
                --output json | jq -r '.Rules[]? | .Name // empty'
            )
            if [ "${#all_rules[@]}" -gt 0 ]; then
              for rule_name in "${all_rules[@]}"; do
                [ -n "${rule_name}" ] || continue
                aws events disable-rule --region "${AWS_REGION}" --name "${rule_name}" >/dev/null
              done
            fi
          fi

          if [ "${#rules_to_enable[@]}" -gt 0 ]; then
            for rule_name in "${rules_to_enable[@]}"; do
              [ -n "${rule_name}" ] || continue
              aws events enable-rule --region "${AWS_REGION}" --name "${rule_name}" >/dev/null
            done
          fi

          mapfile -t service_names < <(jq -r '.[]? | strings | select(length > 0)' <<<"${services_json}")
          if [ "${#service_names[@]}" -eq 0 ]; then
            echo "::error::No staging ECS services were resolved from ${ecs_services_param}"
            exit 1
          fi

          for service_name in "${service_names[@]}"; do
            desired_count="$(jq -r --arg service_name "${service_name}" '.[$service_name] // 0' <<<"${baseline_json}")"
            if ! [[ "${desired_count}" =~ ^[0-9]+$ ]]; then
              desired_count="0"
            fi
            aws ecs update-service \
              --region "${AWS_REGION}" \
              --cluster "${cluster}" \
              --service "${service_name}" \
              --desired-count "${desired_count}" >/dev/null
          done

          restored_services_json="$(jq -c --argjson services "${services_json}" --argjson baseline "${baseline_json}" '
            [
              $services[]? |
              {
                serviceName: .,
                desiredCount: ($baseline[.] // 0),
              }
            ]
          ')"
          enabled_rules_json="$(printf '%s\n' "${rules_to_enable[@]}" | jq -R . | jq -cs '.')"
          out=".smoke-artifacts/staging-ops-resume.json"
          jq -n \
            --arg cluster "${cluster}" \
            --arg pauseParam "${pause_param}" \
            --argjson restoredServices "${restored_services_json}" \
            --argjson enabledRules "${enabled_rules_json}" \
            '{
              paused: false,
              cluster: $cluster,
              pauseParam: $pauseParam,
              restoredServices: $restoredServices,
              enabledRules: $enabledRules,
              resumeController: "workflow-direct-ssm-eventbridge-ecs"
            }' > "${out}"

          cat "${out}"
          jq -e '.paused == false and (.restoredServices | length) > 0' "${out}" >/dev/null

      - name: Wait for staging critical services after ops resume
        shell: bash
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          WAIT_TIMEOUT_SECONDS: '900'
          WAIT_INTERVAL_SECONDS: '15'
        run: |
          set -euo pipefail
          pnpm -C backend exec tsx scripts/ci/wait-aws-ops-health.ts

      - name: Public integration smoke (staging)
        env:
          SMOKE_BASE_URL: ${{ env.PUBLIC_API_BASE || vars.PUBLIC_API_BASE }}
          SMOKE_PROVIDER_STABILIZATION_ATTEMPTS: '18'
          SMOKE_PROVIDER_STABILIZATION_DELAY_MS: '10000'
        run: |
          set -euo pipefail
          api_root="$(echo "${SMOKE_BASE_URL:-}" | sed -E 's:/api/v1/?$::; s:/api/?$::')"
          if [ -z "${api_root:-}" ]; then
            echo "Missing PUBLIC_API_BASE for staging public integration smoke."
            exit 1
          fi

          fetch_status() {
            local url="$1"
            local output_path="$2"
            local status
            status="$(curl -sS -o "${output_path}" -w '%{http_code}' "${url}" || true)"
            if [ -z "${status}" ]; then
              status="000"
            fi
            printf '%s' "${status}"
          }

          consecutive=0
          for attempt in $(seq 1 24); do
            health_status="$(fetch_status "${api_root}/healthz" /tmp/staging-public-healthz.out)"
            ready_status="$(fetch_status "${api_root}/readyz" /tmp/staging-public-readyz.out)"
            corridor_status="$(fetch_status "${api_root}/api/v1/corridor-currencies?from=US&to=MX" /tmp/staging-public-corridors.out)"
            providers_status="$(fetch_status "${api_root}/api/v1/providers?from=US&to=MX&amount=500&fromCurrency=USD&toCurrency=MXN&method=bank" /tmp/staging-public-providers.out)"

            if [ "${health_status}" = "200" ] \
              && [ "${ready_status}" = "200" ] \
              && [ "${corridor_status}" = "200" ] \
              && [ "${providers_status}" = "200" ]; then
              consecutive=$((consecutive + 1))
              echo "Public site/API stabilization sample ${attempt}/24 passed (${consecutive}/3 consecutive)."
              if [ "${consecutive}" -ge 3 ]; then
                break
              fi
            else
              consecutive=0
              echo "Waiting for public site/API stabilization (attempt ${attempt}/24, health=${health_status}, ready=${ready_status}, corridors=${corridor_status}, providers=${providers_status})."
            fi

            if [ "${attempt}" -eq 24 ]; then
              echo "::error::Public site/API did not stabilize before staging integration smoke."
              exit 1
            fi

            sleep 5
          done

          mkdir -p .smoke-artifacts
          SMOKE_BASE_URL="${api_root}" SMOKE_FETCH_RETRIES=10 pnpm -C backend ci:integration-smoke | tee .smoke-artifacts/staging-public-integration-smoke.log

      - name: Agent pipeline E2E health (staging)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.STACK_NAME }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          DB_FORCE_IPV4: '1'
          AGENT_HEALTH_LOOKBACK_HOURS: ${{ vars.AGENT_HEALTH_LOOKBACK_HOURS || '6' }}
          SMOKE_BASE_URL: ${{ env.PUBLIC_API_BASE || vars.PUBLIC_API_BASE }}
          SMOKE_ENV_NAME: staging
          SMOKE_EXPECT_OPS_ACTIVE: '1'
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SMOKE_USER_EMAIL: omar@remit-scout.com
          SMOKE_USER_PASSWORD: ${{ secrets.LAUNCH_PASSWORD_OMAR || secrets.DEFAULT_LAUNCH_PASSWORD }}
          SMOKE_USER_MFA_CODE: ${{ secrets.LAUNCH_MFA_OMAR || '' }}
          SMOKE_EXPECT_ADMIN_MFA: ${{ vars.ADMIN_MFA_REQUIRED }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_PLANE_B:-}" ]; then
            echo "Missing DATABASE_URL_PLANE_B for staging agent health check."
            exit 1
          fi

          if [ -n "${STACK_NAME:-}" ]; then
            outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
            plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
            plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
            api_root="https://${plane_a_cf}"
            if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
              api_root="$(echo "$plane_a_api" | sed 's:/*$::')"
            fi
            if [ -n "${api_root:-}" ] && [ "${api_root}" != "null" ]; then
              export SMOKE_BASE_URL="${api_root}"
            fi

            export QUOTE_REFRESH_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="QuoteRefreshQueueUrl") | .OutputValue')"
            export FX_RATE_REFRESH_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FxRateRefreshQueueUrl") | .OutputValue')"
            export EXPORT_JOB_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="ExportJobQueueUrl") | .OutputValue')"
            export PLANE_B_INGEST_FANOUT_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="IngestFanoutQueueUrl") | .OutputValue')"
            export PLANE_B_INGEST_FANOUT_TIER1_QUEUE_URL="${PLANE_B_INGEST_FANOUT_QUEUE_URL}"
