name: staging/go-live-readiness
run-name: staging/go-live-readiness (${{ inputs.deploy_sha }})

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Exact deployed commit SHA to validate during readiness
        required: true
        type: string
      run_runtime_config_validation:
        description: Also run backend runtime config schema validation
        required: true
        type: boolean
        default: true
      skip_duplicate_admin_smoke:
        description: Deprecated compatibility flag; staging readiness always runs privileged admin smoke
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.deploy_sha }}

      - name: Validate requested deploy SHA
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.deploy_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${EXPECTED_DEPLOY_SHA}"
          actual_sha="$(git rev-parse HEAD)"

          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "::error::Readiness workflow checked out ${actual_sha}, expected ${expected_sha}."
            exit 1
          fi

      - name: Warn when deprecated admin smoke skip flag is set
        if: ${{ inputs.skip_duplicate_admin_smoke }}
        run: |
          echo "::warning::skip_duplicate_admin_smoke is deprecated and ignored. Staging readiness always runs privileged admin smoke."

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Configure AWS credentials (staging readiness, optional)
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          retry-max-attempts: 2

      - name: Require AWS credentials for staging readiness evidence
        if: ${{ steps.aws_creds.outcome != 'success' }}
        run: |
          echo "Unable to assume the staging AWS role. Readiness evidence requires AWS credentials."
          exit 1

      - name: Warn on non-prod security drift (staging readiness)
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV_NAME: staging
        run: |
          set -uo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)"
          if [ -z "${account_id}" ] || [ "${account_id}" = "None" ]; then
            echo "::warning::Unable to resolve AWS account ID for ${ENV_NAME}; skipping GuardDuty/Inspector drift check."
            exit 0
          fi

          detector_ids="$(aws guardduty list-detectors --region "${AWS_REGION}" --query 'DetectorIds' --output text 2>/dev/null || true)"
          if [ -n "${detector_ids}" ] && [ "${detector_ids}" != "None" ]; then
            echo "::warning::GuardDuty remains enabled in ${ENV_NAME} account ${account_id}. Disable it unless non-prod coverage is intentional."
          fi

          inspector_json="$(aws inspector2 batch-get-account-status --account-ids "${account_id}" --region "${AWS_REGION}" --output json 2>/dev/null || true)"
          if [ -z "${inspector_json}" ]; then
            exit 0
          fi

          inspector_state="$(printf '%s' "${inspector_json}" | jq -r '.accounts[0].state.status // empty')"
          enabled_resources="$(printf '%s' "${inspector_json}" | jq -r '[.accounts[0].resourceState | to_entries[]? | select(.value.status == "ENABLED") | .key] | join(",")')"
          if [ "${inspector_state}" = "ENABLED" ]; then
            if [ -n "${enabled_resources}" ] && [ "${enabled_resources}" != "null" ]; then
              echo "::warning::Inspector2 remains enabled in ${ENV_NAME} account ${account_id} for: ${enabled_resources}. Disable it unless non-prod coverage is intentional."
            else
              echo "::warning::Inspector2 remains enabled in ${ENV_NAME} account ${account_id}. Disable it unless non-prod coverage is intentional."
            fi
          fi

      - name: Resolve staging Plane A public API base
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            exit 0
          fi

          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_root=""

          if [ -n "${plane_a_cf:-}" ] && [ "${plane_a_cf}" != "null" ]; then
            api_root="https://${plane_a_cf}"
          elif [ -n "${plane_a_api:-}" ] && [ "${plane_a_api}" != "null" ]; then
            api_root="$(echo "${plane_a_api}" | sed 's:/*$::')"
          fi

          if [ -z "${api_root:-}" ]; then
            echo "::warning::Unable to resolve Plane A public API base from stack outputs; falling back to PUBLIC_API_BASE workflow vars."
            exit 0
          fi

          echo "PUBLIC_API_BASE=${api_root}/api/v1" >> "${GITHUB_ENV}"
          echo "Resolved staging PUBLIC_API_BASE=${api_root}/api/v1"

      - name: Staging go-live readiness (integrations + policy)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          STACK_NAME: ${{ vars.STACK_NAME }}
          SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
          SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
          SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BRONZE_S3_BUCKET: ${{ vars.BRONZE_S3_BUCKET }}
          EXPORTS_S3_BUCKET: ${{ vars.EXPORTS_S3_BUCKET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_BASE: ${{ env.PUBLIC_API_BASE || vars.PUBLIC_API_BASE }}
          PLANE_A_DOMAIN_NAME: ${{ vars.PLANE_A_DOMAIN_NAME }}
          PLANE_A_CERT_ARN: ${{ vars.PLANE_A_CERT_ARN }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PLUS: ${{ secrets.STRIPE_PRICE_ID_PLUS }}
          STRIPE_PRICE_ID_PLUS_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PLUS_ANNUAL }}
          COMPLIANCE_SOC2_TYPE_II_STATUS: ${{ vars.COMPLIANCE_SOC2_TYPE_II_STATUS }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_STATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_STATE }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_DATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_DATE }}
          COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON: ${{ vars.COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_URL: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_URL }}
          PLANE_A_REQUIRE_API_KEY: ${{ vars.PLANE_A_REQUIRE_API_KEY }}
          PLANE_A_CORS_ORIGINS: ${{ vars.PLANE_A_CORS_ORIGINS }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
          PUBLIC_ENABLE_ADS: ${{ vars.PUBLIC_ENABLE_ADS }}
          PUBLIC_AD_COMPARE_INLINE_IDS: ${{ vars.PUBLIC_AD_COMPARE_INLINE_IDS }}
          PUBLIC_AD_COMPARE_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_COMPARE_SIDEBAR_IDS }}
          PUBLIC_AD_HOME_INLINE_IDS: ${{ vars.PUBLIC_AD_HOME_INLINE_IDS }}
          PUBLIC_AD_DASHBOARD_INLINE_IDS: ${{ vars.PUBLIC_AD_DASHBOARD_INLINE_IDS }}
          PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS }}
          PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS }}
          PUBLIC_AD_CORRIDOR_FOOTER_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_FOOTER_IDS }}
          PUBLIC_AD_BLOG_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_BLOG_SIDEBAR_IDS }}
          PUBLIC_AD_BLOG_INLINE_IDS: ${{ vars.PUBLIC_AD_BLOG_INLINE_IDS }}
          PUBLIC_AD_BLOG_BANNER_IDS: ${{ vars.PUBLIC_AD_BLOG_BANNER_IDS }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CASES_CHANNEL_ID: ${{ vars.SLACK_CASES_CHANNEL_ID }}
          WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
          ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
          ADMIN_MFA_REQUIRED: ${{ vars.ADMIN_MFA_REQUIRED }}
          ALERT_SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_INGEST_KEY_SECRET_ARN: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_ARN }}
          NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
          NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
          NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
          NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
          NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
          REQUIRE_NEW_RELIC_GATES: ${{ vars.REQUIRE_NEW_RELIC_GATES || '1' }}
          BRAIN_DISPATCH_GITHUB_ACTIONS: ${{ vars.BRAIN_DISPATCH_GITHUB_ACTIONS }}
          BRAIN_INGEST_GITHUB_ACTIONS: ${{ vars.BRAIN_INGEST_GITHUB_ACTIONS }}
          BRAIN_SLACK_POST_CASE_CARDS: ${{ vars.BRAIN_SLACK_POST_CASE_CARDS }}
        run: pnpm -C backend ci:staging-go-live-readiness

      - name: Sentry release scope check
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          release="readiness-scope-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pnpm -C frontend exec sentry-cli releases new "$release" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          pnpm -C frontend exec sentry-cli releases delete "$release" --org "$SENTRY_ORG" --project "$SENTRY_PROJECT"
          jq -n \
            --arg release "$release" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{
              schemaVersion: "staging-sentry-release-scope@v1",
              status: "pass",
              release: $release,
              checkedAt: $checked_at,
              workflow: {
                runId: $run_id,
                runAttempt: $run_attempt
              }
            }' > .smoke-artifacts/staging-sentry-release-scope.json

      - name: Observability prereq gate (staging hard gate)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          STRICT_CONFIG: '1'
          SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_INGEST_KEY_SECRET_ARN: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_ARN }}
          NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
          NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
          NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
          NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
          NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
        run: pnpm -C backend ci:observability

      - name: New Relic sync + verify (staging hard gate)
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_ALERT_EMAIL: ${{ vars.NEW_RELIC_ALERT_EMAIL || 'alerts@remit-scout.com' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_INGEST_KEY_SECRET_ARN: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_ARN }}
          NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY }}
          NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
          NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
          NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
          NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
        run: |
          set -euo pipefail
          mkdir -p .smoke-artifacts
          node ops/newrelic/bootstrap-dashboards.mjs | tee .smoke-artifacts/staging-newrelic-dashboards.log
          node ops/newrelic/sync-alerts.mjs | tee .smoke-artifacts/staging-newrelic-alerts.log
          NEW_RELIC_REQUIRE_MIRROR_POLICIES=1 \
          NEW_RELIC_EVIDENCE_OUTPUT=.smoke-artifacts/staging-newrelic-notifications-evidence.json \
          node ops/newrelic/sync-notifications-workflows.mjs | tee .smoke-artifacts/staging-newrelic-notifications-sync.log
          jq -e '
            .verification.passed == true and
            .verification.mirrorPoliciesRequired == true and
            (.workflows.staging.matchedPolicyNames == ["Remit-Scout STAGING CloudWatch Mirror"]) and
            (.workflows.prod.matchedPolicyNames == ["Remit-Scout PROD CloudWatch Mirror"])
          ' .smoke-artifacts/staging-newrelic-notifications-evidence.json >/dev/null
          node ops/newrelic/sync-cloud-links.mjs | tee .smoke-artifacts/staging-newrelic-cloud-links.log
          NEW_RELIC_TARGET_ENV=staging \
          REQUIRE_ACCOUNT_PINNING=1 \
          REQUIRE_LOGS=1 \
          REQUIRE_SPANS=1 \
          REQUIRE_API_GW_METRICS=0 \
          REQUIRE_SQS_METRICS=1 \
          node ops/newrelic/verify-signals.mjs | tee .smoke-artifacts/staging-newrelic-verify-signals.json
          jq -e '
            (.results | length) == 1 and
            .results[0].envName == "staging" and
            .results[0].awsMode == "push_only" and
            (.results[0].failures | length) == 0 and
            (.results[0].checks.metricCount > 0) and
            (.results[0].checks.logCount > 0) and
            (.results[0].checks.spanCount > 0) and
            (.results[0].checks.sqsMetricCount > 0) and
            (.results[0].checks.customMetricCount > 0) and
            (.results[0].checks.customMetricFamilies.core_slo_indices > 0)
          ' .smoke-artifacts/staging-newrelic-verify-signals.json >/dev/null

      - name: Runtime config validation (staging profile)
        if: inputs.run_runtime_config_validation
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.STACK_NAME }}
          DATABASE_URL_PLANE_A: ${{ secrets.DATABASE_URL_PLANE_A }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          DATABASE_URL_PLANE_C: ${{ secrets.DATABASE_URL_PLANE_C }}
          PLANE_C_BASE_URL: ${{ vars.PLANE_C_BASE_URL }}
          PLANE_C_ENABLE_IAM_AUTH: ${{ vars.PLANE_C_ENABLE_IAM_AUTH || '1' }}
          PLANE_C_PUBLISHER_VALIDATE_IAM_PROTECTED: ${{ vars.PLANE_C_PUBLISHER_VALIDATE_IAM_PROTECTED || '' }}
          PLANE_C_INTERNAL_API_TOKEN: ${{ secrets.PLANE_C_INTERNAL_API_TOKEN || '' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BRONZE_S3_BUCKET: ${{ vars.BRONZE_S3_BUCKET }}
          EXPORTS_S3_BUCKET: ${{ vars.EXPORTS_S3_BUCKET }}
          ALERT_EVALUATION_QUEUE_URL: ${{ vars.ALERT_EVALUATION_QUEUE_URL }}
          ALERT_SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PLUS: ${{ secrets.STRIPE_PRICE_ID_PLUS }}
          STRIPE_PRICE_ID_PLUS_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PLUS_ANNUAL }}
          PLANE_A_JWT_SECRET: ${{ secrets.PLANE_A_JWT_SECRET }}
          PRIVACY_HASH_SALT: ${{ secrets.PRIVACY_HASH_SALT }}
          PRIVACY_SESSION_SALT: ${{ secrets.PRIVACY_SESSION_SALT }}
          ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST || vars.WAF_ADMIN_ALLOWLIST_IPS }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_INGEST_KEY_SECRET_ARN: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_ARN }}
          NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${STACK_NAME:-}" ]; then
            outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
            plane_c_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneCApiUrl") | .OutputValue')"
            if [ -n "${plane_c_api:-}" ] && [ "${plane_c_api}" != "null" ]; then
              export PLANE_C_BASE_URL="${plane_c_api}"
            fi
          fi
          pnpm -C backend ci:config-validate

      - name: Public integration smoke (staging)
        env:
          SMOKE_BASE_URL: ${{ env.PUBLIC_API_BASE || vars.PUBLIC_API_BASE }}
          SMOKE_PROVIDER_STABILIZATION_ATTEMPTS: '18'
          SMOKE_PROVIDER_STABILIZATION_DELAY_MS: '10000'
        run: |
          set -euo pipefail
          api_root="$(echo "${SMOKE_BASE_URL:-}" | sed -E 's:/api/v1/?$::; s:/api/?$::')"
          if [ -z "${api_root:-}" ]; then
            echo "Missing PUBLIC_API_BASE for staging public integration smoke."
            exit 1
          fi

          fetch_status() {
            local url="$1"
            local output_path="$2"
            local status
            status="$(curl -sS -o "${output_path}" -w '%{http_code}' "${url}" || true)"
            if [ -z "${status}" ]; then
              status="000"
            fi
            printf '%s' "${status}"
          }

          consecutive=0
          for attempt in $(seq 1 24); do
            health_status="$(fetch_status "${api_root}/healthz" /tmp/staging-public-healthz.out)"
            ready_status="$(fetch_status "${api_root}/readyz" /tmp/staging-public-readyz.out)"
            corridor_status="$(fetch_status "${api_root}/api/v1/corridor-currencies?from=US&to=MX" /tmp/staging-public-corridors.out)"
            providers_status="$(fetch_status "${api_root}/api/v1/providers?from=US&to=MX&amount=500&fromCurrency=USD&toCurrency=MXN&method=bank" /tmp/staging-public-providers.out)"

            if [ "${health_status}" = "200" ] \
              && [ "${ready_status}" = "200" ] \
              && [ "${corridor_status}" = "200" ] \
              && [ "${providers_status}" = "200" ]; then
              consecutive=$((consecutive + 1))
              echo "Public site/API stabilization sample ${attempt}/24 passed (${consecutive}/3 consecutive)."
              if [ "${consecutive}" -ge 3 ]; then
                break
              fi
            else
              consecutive=0
              echo "Waiting for public site/API stabilization (attempt ${attempt}/24, health=${health_status}, ready=${ready_status}, corridors=${corridor_status}, providers=${providers_status})."
            fi

            if [ "${attempt}" -eq 24 ]; then
              echo "::error::Public site/API did not stabilize before staging integration smoke."
              exit 1
            fi

            sleep 5
          done

          mkdir -p .smoke-artifacts
          SMOKE_BASE_URL="${api_root}" SMOKE_FETCH_RETRIES=10 pnpm -C backend ci:integration-smoke | tee .smoke-artifacts/staging-public-integration-smoke.log

      - name: Agent pipeline E2E health (staging)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          STACK_NAME: ${{ vars.STACK_NAME }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          DB_FORCE_IPV4: '1'
          AGENT_HEALTH_LOOKBACK_HOURS: ${{ vars.AGENT_HEALTH_LOOKBACK_HOURS || '6' }}
          SMOKE_BASE_URL: ${{ env.PUBLIC_API_BASE || vars.PUBLIC_API_BASE }}
          SMOKE_ENV_NAME: staging
          SMOKE_EXPECT_OPS_ACTIVE: '1'
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SMOKE_USER_EMAIL: omar@remit-scout.com
          SMOKE_USER_PASSWORD: ${{ secrets.LAUNCH_PASSWORD_OMAR || secrets.DEFAULT_LAUNCH_PASSWORD }}
          SMOKE_USER_MFA_CODE: ${{ secrets.LAUNCH_MFA_OMAR || '' }}
          SMOKE_EXPECT_ADMIN_MFA: ${{ vars.ADMIN_MFA_REQUIRED }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_PLANE_B:-}" ]; then
            echo "Missing DATABASE_URL_PLANE_B for staging agent health check."
            exit 1
          fi

          if [ -n "${STACK_NAME:-}" ]; then
            outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
            plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
            plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
            api_root="https://${plane_a_cf}"
            if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
              api_root="$(echo "$plane_a_api" | sed 's:/*$::')"
            fi
            if [ -n "${api_root:-}" ] && [ "${api_root}" != "null" ]; then
              export SMOKE_BASE_URL="${api_root}"
            fi

            export QUOTE_REFRESH_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="QuoteRefreshQueueUrl") | .OutputValue')"
            export FX_RATE_REFRESH_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FxRateRefreshQueueUrl") | .OutputValue')"
            export EXPORT_JOB_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="ExportJobQueueUrl") | .OutputValue')"
            export PLANE_B_INGEST_FANOUT_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="IngestFanoutQueueUrl") | .OutputValue')"
            export PLANE_B_INGEST_FANOUT_TIER1_QUEUE_URL="${PLANE_B_INGEST_FANOUT_QUEUE_URL}"
            export PLANE_B_INGEST_FANOUT_TIER2_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="IngestFanoutTier2QueueUrl") | .OutputValue')"
            export PLANE_B_NOTIFICATIONS_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="NotificationsQueueUrl") | .OutputValue')"
            export PLANE_B_OPS_ALERT_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="OpsAlertsQueueUrl") | .OutputValue')"
            export GOLD_LIVE_QUEUE_URL="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="GoldLiveQueueUrl") | .OutputValue')"
            export SMOKE_QUEUE_KINDS="quote_refresh,fx_rate_refresh,ingest_fanout,ingest_fanout_tier2,exports,notifications,ops_alerts,gold_live"
          fi

          mkdir -p .smoke-artifacts
          if pnpm -C backend exec tsx scripts/e2e-agent-health-check.ts 2>&1 | tee .smoke-artifacts/staging-agent-pipeline-health.log; then
            exit 0
          fi

          runner_db_isolation_fallback=0
          if grep -q 'agent_health_db_ipv4_resolution_failed' .smoke-artifacts/staging-agent-pipeline-health.log \
            && grep -q 'ENETUNREACH' .smoke-artifacts/staging-agent-pipeline-health.log; then
            runner_db_isolation_fallback=1
          fi
          if grep -q 'agent_health_db_ipv4_resolved' .smoke-artifacts/staging-agent-pipeline-health.log \
            && grep -q 'pooler.supabase.com' .smoke-artifacts/staging-agent-pipeline-health.log \
            && grep -q 'Tenant or user not found' .smoke-artifacts/staging-agent-pipeline-health.log; then
            runner_db_isolation_fallback=1
          fi

          if [ "${runner_db_isolation_fallback}" != "1" ]; then
            echo "::error::Agent pipeline E2E health failed for a reason other than GitHub runner DB network isolation."
            exit 1
          fi

          echo "::warning::GitHub runner cannot complete the direct staging DB check from hosted CI. Falling back to authenticated worker resilience evidence."
          if [ -z "${SMOKE_BASE_URL:-}" ]; then
            echo "::error::Missing PUBLIC_API_BASE for staging agent-health fallback."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::error::Missing PUBLIC_SUPABASE_URL or PUBLIC_SUPABASE_ANON_KEY for staging agent-health fallback."
            exit 1
          fi
          if [ -z "${SMOKE_USER_PASSWORD:-}" ]; then
            echo "::error::Missing LAUNCH_PASSWORD_OMAR or DEFAULT_LAUNCH_PASSWORD for staging agent-health fallback."
            exit 1
          fi
          SMOKE_EXPECT_OPS_ACTIVE=0 pnpm -C backend ci:worker-resilience-smoke | tee .smoke-artifacts/staging-agent-pipeline-health-fallback.log

