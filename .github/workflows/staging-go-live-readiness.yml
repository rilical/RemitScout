name: staging/go-live-readiness

on:
  workflow_dispatch:
    inputs:
      run_runtime_config_validation:
        description: Also run backend runtime config schema validation
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Staging go-live readiness (integrations + policy)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
          STACK_NAME: ${{ vars.STACK_NAME }}
          SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
          SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
          SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BRONZE_S3_BUCKET: ${{ vars.BRONZE_S3_BUCKET }}
          EXPORTS_S3_BUCKET: ${{ vars.EXPORTS_S3_BUCKET }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PLUS: ${{ secrets.STRIPE_PRICE_ID_PLUS }}
          STRIPE_PRICE_ID_PLUS_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PLUS_ANNUAL }}
          COMPLIANCE_SOC2_TYPE_II_STATUS: ${{ vars.COMPLIANCE_SOC2_TYPE_II_STATUS }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_STATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_STATE }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_DATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_DATE }}
          COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON: ${{ vars.COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_URL: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_URL }}
          PLANE_A_REQUIRE_API_KEY: ${{ vars.PLANE_A_REQUIRE_API_KEY }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
          PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
          PUBLIC_ENABLE_EZOIC: ${{ vars.PUBLIC_ENABLE_EZOIC }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_CASES_CHANNEL_ID: ${{ vars.SLACK_CASES_CHANNEL_ID }}
          WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
          ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
          ALERT_SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
          REQUIRE_NEW_RELIC_GATES: ${{ vars.REQUIRE_NEW_RELIC_GATES || '0' }}
          BRAIN_DISPATCH_GITHUB_ACTIONS: ${{ vars.BRAIN_DISPATCH_GITHUB_ACTIONS }}
          BRAIN_INGEST_GITHUB_ACTIONS: ${{ vars.BRAIN_INGEST_GITHUB_ACTIONS }}
          BRAIN_SLACK_POST_CASE_CARDS: ${{ vars.BRAIN_SLACK_POST_CASE_CARDS }}
        run: pnpm -C backend ci:staging-go-live-readiness

      - name: Observability prereq gate (staging hard gate)
        if: ${{ vars.REQUIRE_NEW_RELIC_GATES == '1' && secrets.NEW_RELIC_USER_API_KEY != '' && vars.NEW_RELIC_STAGING_AWS_ROLE_ARN != '' && vars.NEW_RELIC_PROD_AWS_ROLE_ARN != '' }}
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          STRICT_CONFIG: '1'
          SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
        run: pnpm -C backend ci:observability

      - name: New Relic sync + verify (staging hard gate)
        if: ${{ vars.REQUIRE_NEW_RELIC_GATES == '1' && secrets.NEW_RELIC_USER_API_KEY != '' && vars.NEW_RELIC_STAGING_AWS_ROLE_ARN != '' && vars.NEW_RELIC_PROD_AWS_ROLE_ARN != '' }}
        env:
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
        run: |
          set -euo pipefail
          node ops/newrelic/bootstrap-dashboards.mjs
          node ops/newrelic/sync-alerts.mjs
          node ops/newrelic/sync-cloud-links.mjs
          NEW_RELIC_TARGET_ENV=staging \
          REQUIRE_ACCOUNT_PINNING=1 \
          REQUIRE_LOGS=1 \
          REQUIRE_SPANS=1 \
          node ops/newrelic/verify-signals.mjs

      - name: Runtime config validation (staging profile)
        if: inputs.run_runtime_config_validation
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
          DATABASE_URL_PLANE_A: ${{ secrets.DATABASE_URL_PLANE_A }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          DATABASE_URL_PLANE_C: ${{ secrets.DATABASE_URL_PLANE_C }}
          PLANE_C_BASE_URL: ${{ vars.PLANE_C_BASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BRONZE_S3_BUCKET: ${{ vars.BRONZE_S3_BUCKET }}
          EXPORTS_S3_BUCKET: ${{ vars.EXPORTS_S3_BUCKET }}
          ALERT_EVALUATION_QUEUE_URL: ${{ vars.ALERT_EVALUATION_QUEUE_URL }}
          ALERT_SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID_PLUS: ${{ secrets.STRIPE_PRICE_ID_PLUS }}
          STRIPE_PRICE_ID_PLUS_ANNUAL: ${{ secrets.STRIPE_PRICE_ID_PLUS_ANNUAL }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
        run: pnpm -C backend ci:config-validate
