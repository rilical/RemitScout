name: ci/agent-auto-merge

on:
  check_suite:
    types:
      - completed
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-agent-repairs:
    if: |
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'success' &&
      startsWith(github.event.check_suite.head_branch, 'agent/repair-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find PR for branch
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.check_suite.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          pr_number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "No open PR found for branch $BRANCH"
            exit 0
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check confidence level
        if: steps.find_pr.outputs.pr_number
        id: check_confidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          pr_body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body -q '.body')
          if echo "$pr_body" | grep -q '**Confidence:** high'; then
            echo "confidence=high" >> "$GITHUB_OUTPUT"
          else
            echo "confidence=other" >> "$GITHUB_OUTPUT"
            echo "PR confidence is not 'high' — requires human review"
          fi

      - name: Auto-approve high-confidence repairs
        if: steps.check_confidence.outputs.confidence == 'high'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$REPO" \
            --approve \
            --body "Auto-approved: high-confidence agent repair with all checks passing."

      - name: Enable auto-merge
        if: steps.check_confidence.outputs.confidence == 'high'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --auto \
            --squash \
            --subject "[Agent] Auto-merge repair PR #${PR_NUMBER}"
