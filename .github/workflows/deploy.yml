      - name: Verify Public API Routes (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          fetch_status() {
            local output_path="$1"
            shift
            local status
            status="$(curl -sS -o "${output_path}" -w '%{http_code}' "$@" || true)"
            if [ -z "${status}" ]; then
              status="000"
            fi
            printf '%s' "${status}"
          }

          consecutive=0
          max_attempts=36
          for attempt in $(seq 1 "${max_attempts}"); do
            refresh_status="$(fetch_status /tmp/refresh-status.out "${api_base}/api/v1/quotes/refresh-status?request_ids=00000000-0000-4000-8000-000000000001")"
            session_status="$(fetch_status /tmp/session-track.out -X POST "${api_base}/api/v1/sessions/track" -H 'content-type: application/json' --data '{"session_id":"stg-check-session","anon_id":"stg-check-anon","metadata":{"source":"deploy-check"}}')"
            pricing_status="$(fetch_status /tmp/pricing.out "${api_base}/api/v1/billing/pricing")"
            health_status="$(fetch_status /tmp/healthz.out "${api_base}/healthz")"
            ready_status="$(fetch_status /tmp/readyz.out "${api_base}/readyz")"
            corridor_status="$(fetch_status /tmp/corridor-currencies.out "${api_base}/api/v1/corridor-currencies?from=US&to=MX")"
            providers_status="$(fetch_status /tmp/providers.out "${api_base}/api/v1/providers?from=US&to=MX&amount=500&fromCurrency=USD&toCurrency=MXN&method=bank")"

            if [ "${refresh_status}" = "200" ] \
              && [ "${session_status}" = "200" ] \
              && [ "${pricing_status}" = "200" ] \
              && [ "${health_status}" = "200" ] \
              && [ "${ready_status}" = "200" ] \
              && [ "${corridor_status}" = "200" ] \
              && [ "${providers_status}" = "200" ]; then
              consecutive=$((consecutive + 1))
              echo "Public route stabilization sample ${attempt}/12 passed (${consecutive}/3 consecutive)."
              if [ "${consecutive}" -ge 3 ]; then
                break
              fi
            else
              consecutive=0
              echo "Waiting for public route stabilization (attempt ${attempt}/${max_attempts}, refresh=${refresh_status}, session=${session_status}, pricing=${pricing_status}, health=${health_status}, ready=${ready_status}, corridors=${corridor_status}, providers=${providers_status})."
            fi

            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Public API routes did not stabilize before staging verification."
              cat /tmp/refresh-status.out
              cat /tmp/session-track.out
              cat /tmp/pricing.out
              cat /tmp/healthz.out
              cat /tmp/readyz.out
              cat /tmp/corridor-currencies.out
              cat /tmp/providers.out
              exit 1
            fi

            sleep 5
          done

