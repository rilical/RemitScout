name: cd/deploy

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
      staging_mode:
        description: Staging posture to deploy. Required when env=staging.
        required: false
        type: choice
        options:
          - lean
          - parity
      ref:
        description: Git ref (sha/branch/tag). Leave empty to use default.
        required: false
        type: string
      skip_ci_gate:
        description: Emergency override for manual deploy when ci/main is red.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.env == 'dev'
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || '50' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || '20' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - name: Resolve deployment ref (dev)
        id: resolve_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          requested="$(echo "${REQUESTED_REF}" | xargs)"
          if [ -z "${requested}" ]; then
            echo "::error::Empty deploy ref; unable to continue."
            exit 1
          fi

          resolved=""
          candidate="${requested}"
          for _ in 1 2 3; do
            encoded="$(printf '%s' "${candidate}" | jq -sRr @uri)"
            resolved="$(gh api "repos/${REPO}/commits/${encoded}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "${resolved}" ]; then
              break
            fi
            if [[ "${candidate}" == refs/heads/* ]]; then
              candidate="${candidate#refs/heads/}"
              continue
            fi
            if [[ "${candidate}" == refs/tags/* ]]; then
              candidate="${candidate#refs/tags/}"
              continue
            fi
            break
          done

          if [ -z "${resolved}" ]; then
            echo "::error::Unable to resolve deploy ref '${requested}' to a commit SHA."
            echo "::error::Provide a valid branch name, tag, short SHA, or full SHA."
            exit 1
          fi

          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "requested_ref=${requested}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref '${requested}' -> ${resolved}"

      - name: Verify ci/main gate for dispatch SHA (dev)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          run_id="$(gh run list --repo "$REPO" --workflow ci-main.yml --json databaseId,headSha,conclusion --jq "map(select(.headSha==\"${deploy_sha}\" and .conclusion==\"success\"))[0].databaseId // \"\"")"
          if [ -z "$run_id" ]; then
            echo "No successful ci/main run found for commit ${deploy_sha}."
            echo "Manual deploys must reference a tested SHA."
            exit 1
          fi
          echo "Found successful ci/main run: ${run_id}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.sha }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: dev
          AUDIT_BLOCKING: '0'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_report=".security/${SECURITY_ENV}-pnpm-audit.json"
          audit_exit=0
          pnpm -w audit --prod --audit-level=high --json > "${audit_report}" || audit_exit=$?
          if [ ! -s "${audit_report}" ]; then
            echo "::error::pnpm audit did not produce JSON output."
            exit "${audit_exit:-1}"
          fi
          high_count="$(jq -r '.metadata.vulnerabilities.high // 0' "${audit_report}")"
          critical_count="$(jq -r '.metadata.vulnerabilities.critical // 0' "${audit_report}")"
          blocker_count=$((high_count + critical_count))
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit). high=${high_count} critical=${critical_count}"
            if [ "${AUDIT_BLOCKING}" = "1" ] && [ "${blocker_count}" -gt 0 ]; then
              exit "$audit_exit"
            fi
            echo "No blocking high/critical production dependencies detected; continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev-security-evidence
          path: .security
          retention-days: 90
          if-no-files-found: ignore

      - name: Configure AWS credentials (primary role)
        id: aws_creds_primary
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
          retry-max-attempts: 3

      - name: Configure AWS credentials (fallback role)
        id: aws_creds_fallback
        if: steps.aws_creds_primary.outcome != 'success' && vars.AWS_ROLE_TO_ASSUME_FALLBACK != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
          retry-max-attempts: 2

      - name: Validate AWS credential bootstrap
        if: steps.aws_creds_primary.outcome != 'success' && steps.aws_creds_fallback.outcome != 'success'
        shell: bash
        env:
          AWS_ROLE_PRIMARY: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_ROLE_FALLBACK: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
        run: |
          set -euo pipefail
          echo "::error::Failed to assume AWS role via OIDC using both primary and fallback roles."
          echo "::error::Primary role: ${AWS_ROLE_PRIMARY}"
          echo "::error::Fallback role: ${AWS_ROLE_FALLBACK:-<not configured>}"
          echo "::error::Remediation: update IAM trust policy for GitHub OIDC (aud=sts.amazonaws.com) and this repo/environment."
          exit 1

      - name: Validate Required Secrets (dev)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: dev)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: dev
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:${{ steps.vars.outputs.SEMVER_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:latest

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          DOCKER_PLATFORM: linux/amd64
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-dev"
          docker run --rm \
            -v "${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            aquasec/trivy:0.50.1 \
            image --image-src remote --platform "${DOCKER_PLATFORM}" --no-progress --severity HIGH,CRITICAL --exit-code 1 --ignorefile /root/.trivyignore "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 15); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/15)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "ECR scan found $CRITICAL CRITICAL vulnerabilities. Blocking deploy."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/rilical/Remit-Scout-V2/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      - name: CDK Diff (dev)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-50}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-20}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            -c devPaused=true \
            -c planeBIngestDesiredCount=0 \
            -c planeBB2cRefreshDesiredCount=0 \
            -c planeBIngestFanoutTier1DesiredCount=0 \
            -c planeBIngestFanoutTier2DesiredCount=0 \
            -c goldLiveDesiredCount=0 \
            -c planeBNotificationsDesiredCount=0 \
            -c planeBOpsAlertsDesiredCount=0 \
            -c planeBQueueWorkerDesiredCount=0 \
            -c planeBQueueWorkerMaxCount=0 \
            -c planeBDisableTier1=true \
            -c enableFrontend=false

      - name: Recover CloudFormation rollback state (dev)
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "STACK_NAME is not set; cannot check rollback state."
            exit 1
          fi

          aws_cf() {
            timeout 45s aws --cli-connect-timeout 10 --cli-read-timeout 30 cloudformation "$@"
          }

          continue_update_rollback() {
            if aws_cf continue-update-rollback --stack-name "${STACK_NAME}" >/dev/null; then
              return 0
            fi

            echo "Direct continue-update-rollback was denied. Retrying with the CDK bootstrap deploy role."
            local account_id
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            local deploy_role_arn="arn:aws:iam::${account_id}:role/cdk-hnb659fds-deploy-role-${account_id}-${AWS_REGION}"
            local assumed
            assumed="$(aws sts assume-role \
              --role-arn "${deploy_role_arn}" \
              --role-session-name "cf-rollback-recovery-dev" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text)"
            if [ -z "${assumed}" ]; then
              echo "::error::Failed to assume bootstrap deploy role ${deploy_role_arn} for rollback recovery."
              return 1
            fi
            read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"${assumed}"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            aws_cf continue-update-rollback --stack-name "${STACK_NAME}" >/dev/null
          }

          aws_ecs() {
            timeout 45s aws --cli-connect-timeout 10 --cli-read-timeout 30 ecs "$@"
          }

          print_stack_diagnostics() {
            echo "::group::CloudFormation stack diagnostics"
            aws_cf describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].{Status:StackStatus,Reason:StackStatusReason,LastUpdated:LastUpdatedTime}' \
              --output json || true
            echo "::endgroup::"

            echo "::group::Recent CloudFormation events"
            aws_cf describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --max-items 40 \
              --query 'StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
              --output table || true
            echo "::endgroup::"
          }

          stack_status() {
            aws_cf describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text
          }

          if ! aws_cf describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            echo "Stack ${STACK_NAME} not found yet; continuing."
            exit 0
          fi

          status="$(stack_status)"
          echo "Current stack status: ${status}"
          if [ "${status}" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Detected UPDATE_ROLLBACK_FAILED. Attempting continue-update-rollback."
            continue_update_rollback
          fi

          start_epoch="$(date +%s)"
          timeout_seconds=1800
          deadline_epoch=$((start_epoch + timeout_seconds))
          poll_seconds=10
          max_attempts=$((timeout_seconds / poll_seconds))
          for i in $(seq 1 "${max_attempts}"); do
            if [ "$(date +%s)" -ge "${deadline_epoch}" ]; then
              break
            fi
            status="$(stack_status)"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                echo "Stack is stable and deployable: ${status}"
                exit 0
                ;;
              *_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for stable stack state: ${status} (attempt ${i}/${max_attempts})"
                # Every 60s, surface ECS rollout progress and fail fast on explicit FAILED rollouts.
                if [ $((i % 6)) -eq 0 ] && [ "$i" -gt 6 ]; then
                  service_arns="$(aws_ecs list-services --cluster "remit-scout-${ENV_NAME}" --query 'serviceArns' --output text 2>/dev/null || true)"
                  if [ -n "${service_arns}" ] && [ "${service_arns}" != "None" ]; then
                    failed_rollouts="$(aws_ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services ${service_arns} --output json 2>/dev/null \
                      | jq -r '[.services[] | select(any(.deployments[]?; .status == "PRIMARY" and .rolloutState == "FAILED"))] | length' 2>/dev/null \
                      || echo "0")"
                    in_progress_rollouts="$(aws_ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services ${service_arns} --output json 2>/dev/null \
                      | jq -r '[.services[] | select(any(.deployments[]?; .status == "PRIMARY" and .rolloutState == "IN_PROGRESS"))] | length' 2>/dev/null \
                      || echo "0")"
                    if ! [[ "${failed_rollouts}" =~ ^[0-9]+$ ]]; then
                      echo "::warning::Unable to parse failed ECS rollout count: ${failed_rollouts}"
                      failed_rollouts=0
                    fi
                    if ! [[ "${in_progress_rollouts}" =~ ^[0-9]+$ ]]; then
                      echo "::warning::Unable to parse in-progress ECS rollout count: ${in_progress_rollouts}"
                      in_progress_rollouts=0
                    fi
                    echo "Primary ECS services still rolling out: ${in_progress_rollouts}"
                    if [ "${failed_rollouts}" -gt 0 ]; then
                      echo "::error::${failed_rollouts} ECS services have PRIMARY deployments in FAILED state."
                      echo "::error::Check Aurora status, secrets, and Redis before retrying."
                      print_stack_diagnostics
                      exit 1
                    fi
                  fi
                fi
                sleep "${poll_seconds}"
                ;;
              *)
                echo "::error::Stack is not deployable after recovery: ${status}"
                print_stack_diagnostics
                exit 1
                ;;
            esac
          done

          elapsed_seconds=$(( $(date +%s) - start_epoch ))
          echo "::error::Timed out waiting for stack to reach a deployable state after ${elapsed_seconds}s."
          print_stack_diagnostics
          exit 1

      - name: Pre-deploy infrastructure health check (dev)
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -uo pipefail
          cluster_id=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier, '${ENV_NAME}')].DBClusterIdentifier" \
            --output text 2>&1) || {
            echo "::error::Cannot check Aurora status for ${ENV_NAME} (missing rds:DescribeDBClusters permission). Blocking deploy."
            exit 1
          }
          cluster_id="$(echo "$cluster_id" | head -1)"
          if [ -z "$cluster_id" ]; then
            echo "No Aurora cluster found for ${ENV_NAME}; skipping health check."
            exit 0
          fi
          status=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$cluster_id" \
            --query 'DBClusters[0].Status' --output text)
          if [ "$status" = "stopped" ]; then
            echo "::warning::Aurora cluster $cluster_id is stopped. Starting..."
            aws rds start-db-cluster --db-cluster-identifier "$cluster_id" || {
              echo "::error::Cannot start Aurora cluster $cluster_id for ${ENV_NAME} (missing rds:StartDBCluster permission). Blocking deploy."
              exit 1
            }
            aws rds wait db-cluster-available --db-cluster-identifier "$cluster_id"
            echo "Aurora is now available."
          elif [ "$status" != "available" ]; then
            echo "::error::Aurora cluster is in state: $status"
            exit 1
          fi
          echo "Aurora health check passed: $status"

      - name: Refresh AWS credentials before CDK deploy (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: CDK Deploy (dev, paused)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-50}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-20}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            -c devPaused=true \
            -c planeBIngestDesiredCount=0 \
            -c planeBB2cRefreshDesiredCount=0 \
            -c planeBIngestFanoutTier1DesiredCount=0 \
            -c planeBIngestFanoutTier2DesiredCount=0 \
            -c goldLiveDesiredCount=0 \
            -c planeBNotificationsDesiredCount=0 \
            -c planeBOpsAlertsDesiredCount=0 \
            -c planeBQueueWorkerDesiredCount=0 \
            -c planeBQueueWorkerMaxCount=0 \
            -c planeBDisableTier1=true \
            -c enableFrontend=false \
            --require-approval never

      - name: Run Migrations (dev)
        shell: bash
        env:
          ENV_NAME: dev
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=ENABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Wait For ECS Stability (dev)
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ] && [ "$services" != "None" ]; then
            read -r -a service_arns <<< "$services"
            for ((i=0; i<${#service_arns[@]}; i+=10)); do
              batch=("${service_arns[@]:i:10}")
              aws ecs wait services-stable --cluster "$cluster" --services "${batch[@]}"
            done
          fi

      - name: Post-deploy Smoke (dev)
        shell: bash
        env:
          ENV_NAME: dev
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi
          API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke

      - name: Record Last-known-good Image (dev)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --type "String" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: dev
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: dev
          STATUS: ${{ job.status }}
          COMMIT_SHA_IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "Skipping Slack notification: SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi
          COMMIT_SHA="${COMMIT_SHA_IMAGE_TAG:-${RESOLVE_REF_SHA:-${DEFAULT_SHA:-unknown}}}"
          if [ -z "${COMMIT_SHA}" ] || [ "${COMMIT_SHA}" = "null" ]; then
            COMMIT_SHA="unknown"
          fi
          if [[ "${COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT_SHA="${COMMIT_SHA:0:7}"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null

  deploy-staging:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.env == 'staging'
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ${{ inputs.staging_mode == 'parity' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 240
    environment: staging
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SENTRY_SECRET_ARN: ${{ vars.SENTRY_SECRET_ARN }}
      SENTRY_SECRET_JSON_KEY: ${{ vars.SENTRY_SECRET_JSON_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
      TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
      NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
      NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
      NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
      NEW_RELIC_INGEST_KEY_SECRET_ARN: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_ARN }}
      NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY: ${{ vars.NEW_RELIC_INGEST_KEY_SECRET_JSON_KEY }}
      NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
      NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
      NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
      NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
      NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
      NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
      NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
      NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
      NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
      NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
      PROXY_RESIDENTIAL_SECRET_ARN: ${{ vars.PROXY_RESIDENTIAL_SECRET_ARN }}
      PROXY_RESIDENTIAL_SECRET_JSON_KEY: ${{ vars.PROXY_RESIDENTIAL_SECRET_JSON_KEY }}
      PROXY_RESIDENTIAL_SSM_NAME: ${{ vars.PROXY_RESIDENTIAL_SSM_NAME }}
      PROXY_RESIDENTIAL_URL: ${{ secrets.PROXY_RESIDENTIAL_URL || vars.PROXY_RESIDENTIAL_URL }}
      PROXY_DATACENTER_SECRET_ARN: ${{ vars.PROXY_DATACENTER_SECRET_ARN }}
      PROXY_DATACENTER_SECRET_JSON_KEY: ${{ vars.PROXY_DATACENTER_SECRET_JSON_KEY }}
      PROXY_DATACENTER_SSM_NAME: ${{ vars.PROXY_DATACENTER_SSM_NAME }}
      PROXY_DATACENTER_URL: ${{ secrets.PROXY_DATACENTER_URL || vars.PROXY_DATACENTER_URL }}
      CAPABILITY_PROBE_PROXY_TIER: ${{ vars.CAPABILITY_PROBE_PROXY_TIER || 'NONE' }}
      AGENT_LLM_CONNECTOR: ${{ vars.AGENT_LLM_CONNECTOR }}
      AGENT_LLM_MODEL: ${{ vars.AGENT_LLM_MODEL }}
      AGENT_LLM_PROMPT_VERSION: ${{ vars.AGENT_LLM_PROMPT_VERSION }}
      AGENT_ANTHROPIC_API_KEY_SECRET_ARN: ${{ vars.AGENT_ANTHROPIC_API_KEY_SECRET_ARN }}
      SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
      SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
      SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
      WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
      ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
      ADMIN_MFA_REQUIRED: ${{ vars.ADMIN_MFA_REQUIRED }}
      PLANE_A_ADMIN_EMAILS: ${{ vars.PLANE_A_ADMIN_EMAILS }}
      PLANE_A_ENABLE_JWT_AUTH: ${{ vars.PLANE_A_ENABLE_JWT_AUTH }}
      PLANE_A_REQUIRE_JWT: ${{ vars.PLANE_A_REQUIRE_JWT }}
      PLANE_A_REQUIRE_API_KEY: ${{ vars.PLANE_A_REQUIRE_API_KEY }}
      PLANE_A_JWT_ISSUER: ${{ vars.PLANE_A_JWT_ISSUER }}
      PLANE_A_JWT_AUDIENCES: ${{ vars.PLANE_A_JWT_AUDIENCES }}
      PRIVACY_HASH_SALT: ${{ secrets.PRIVACY_HASH_SALT }}
      PRIVACY_SESSION_SALT: ${{ secrets.PRIVACY_SESSION_SALT }}
      PLANE_A_CORS_ORIGINS: ${{ vars.PLANE_A_CORS_ORIGINS }}
      PLANE_A_CORS_ALLOWED_HEADERS: ${{ vars.PLANE_A_CORS_ALLOWED_HEADERS }}
      PLANE_A_CORS_ALLOWED_METHODS: ${{ vars.PLANE_A_CORS_ALLOWED_METHODS }}
      PLANE_A_CORS_ALLOW_CREDENTIALS: ${{ vars.PLANE_A_CORS_ALLOW_CREDENTIALS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      NEWSLETTER_EMAIL_ENABLED: ${{ vars.NEWSLETTER_EMAIL_ENABLED || '0' }}
      NEWSLETTER_WELCOME_ENABLED: ${{ vars.NEWSLETTER_WELCOME_ENABLED || '0' }}
      NEWSLETTER_BASE_URL: ${{ vars.NEWSLETTER_BASE_URL || vars.FRONTEND_BASE_URL || vars.PUBLIC_SITE_URL }}
      CONTACT_EMAIL_ENABLED: ${{ vars.CONTACT_EMAIL_ENABLED || '0' }}
      SES_REGION: ${{ vars.SES_REGION || vars.AWS_REGION || 'us-east-1' }}
      PUBLIC_REMIT_SCOUT_ENV: ${{ vars.PUBLIC_REMIT_SCOUT_ENV || 'staging' }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_ENTERPRISE_ENABLED: ${{ vars.PUBLIC_ENTERPRISE_ENABLED || '1' }}
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PUBLIC_GTM_CONTAINER_ID: ${{ vars.PUBLIC_GTM_CONTAINER_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.PUBLIC_LINKEDIN_PARTNER_ID }}
      PUBLIC_REDDIT_PIXEL_ID: ${{ vars.PUBLIC_REDDIT_PIXEL_ID }}
      PUBLIC_X_PIXEL_ID: ${{ vars.PUBLIC_X_PIXEL_ID }}
      PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.PUBLIC_TIKTOK_PIXEL_ID }}
      PUBLIC_CONTENTSQUARE_TAG_SRC: ${{ vars.PUBLIC_CONTENTSQUARE_TAG_SRC }}
      PUBLIC_NEW_RELIC_BROWSER_ENABLED: ${{ vars.PUBLIC_NEW_RELIC_BROWSER_ENABLED }}
      PUBLIC_NEW_RELIC_ACCOUNT_ID: ${{ vars.PUBLIC_NEW_RELIC_ACCOUNT_ID }}
      PUBLIC_NEW_RELIC_TRUST_KEY: ${{ vars.PUBLIC_NEW_RELIC_TRUST_KEY }}
      PUBLIC_NEW_RELIC_AGENT_ID: ${{ vars.PUBLIC_NEW_RELIC_AGENT_ID }}
      PUBLIC_NEW_RELIC_APPLICATION_ID: ${{ vars.PUBLIC_NEW_RELIC_APPLICATION_ID }}
      PUBLIC_NEW_RELIC_LICENSE_KEY: ${{ secrets.PUBLIC_NEW_RELIC_LICENSE_KEY || vars.PUBLIC_NEW_RELIC_LICENSE_KEY }}
      PUBLIC_NEW_RELIC_BEACON: ${{ vars.PUBLIC_NEW_RELIC_BEACON }}
      PUBLIC_NEW_RELIC_ERROR_BEACON: ${{ vars.PUBLIC_NEW_RELIC_ERROR_BEACON }}
      PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
      PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID }}
      PUBLIC_ENABLE_ADS: ${{ vars.PUBLIC_ENABLE_ADS }}
      PUBLIC_AD_COMPARE_INLINE_IDS: ${{ vars.PUBLIC_AD_COMPARE_INLINE_IDS }}
      PUBLIC_AD_COMPARE_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_COMPARE_SIDEBAR_IDS }}
      PUBLIC_AD_HOME_INLINE_IDS: ${{ vars.PUBLIC_AD_HOME_INLINE_IDS }}
      PUBLIC_AD_DASHBOARD_INLINE_IDS: ${{ vars.PUBLIC_AD_DASHBOARD_INLINE_IDS }}
      PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS }}
      PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS }}
      PUBLIC_AD_CORRIDOR_FOOTER_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_FOOTER_IDS }}
      PUBLIC_AD_BLOG_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_BLOG_SIDEBAR_IDS }}
      PUBLIC_AD_BLOG_INLINE_IDS: ${{ vars.PUBLIC_AD_BLOG_INLINE_IDS }}
      PUBLIC_AD_BLOG_BANNER_IDS: ${{ vars.PUBLIC_AD_BLOG_BANNER_IDS }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || vars.STAGING_COST_BUDGET_AMOUNT_USD || '100' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || vars.STAGING_COST_ANOMALY_THRESHOLD_USD || '60' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || vars.STAGING_COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - name: Resolve deployment ref (staging)
        id: resolve_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          requested="$(echo "${REQUESTED_REF}" | xargs)"
          if [ -z "${requested}" ]; then
            echo "::error::Empty deploy ref; unable to continue."
            exit 1
          fi

          resolved=""
          candidate="${requested}"
          for _ in 1 2 3; do
            encoded="$(printf '%s' "${candidate}" | jq -sRr @uri)"
            resolved="$(gh api "repos/${REPO}/commits/${encoded}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "${resolved}" ]; then
              break
            fi
            if [[ "${candidate}" == refs/heads/* ]]; then
              candidate="${candidate#refs/heads/}"
              continue
            fi
            if [[ "${candidate}" == refs/tags/* ]]; then
              candidate="${candidate#refs/tags/}"
              continue
            fi
            break
          done

          if [ -z "${resolved}" ]; then
            echo "::error::Unable to resolve deploy ref '${requested}' to a commit SHA."
            echo "::error::Provide a valid branch name, tag, short SHA, or full SHA."
            exit 1
          fi

          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "requested_ref=${requested}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref '${requested}' -> ${resolved}"

      - name: Verify ci/main gate for dispatch SHA (staging)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SKIP_CI_GATE: ${{ inputs.skip_ci_gate }}
        run: |
          set -euo pipefail
          if [ "${SKIP_CI_GATE:-false}" = "true" ]; then
            echo "::warning::Skipping ci/main gate for manual staging recovery deploy."
            exit 0
          fi
          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          run_id="$(gh run list --repo "$REPO" --workflow ci-main.yml --json databaseId,headSha,conclusion --jq "map(select(.headSha==\"${deploy_sha}\" and .conclusion==\"success\"))[0].databaseId // \"\"")"
          if [ -z "$run_id" ]; then
            echo "No successful ci/main run found for commit ${deploy_sha}."
            echo "Manual deploys must reference a tested SHA."
            exit 1
          fi
          echo "Found successful ci/main run: ${run_id}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.sha }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: staging
          AUDIT_BLOCKING: '0'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_report=".security/${SECURITY_ENV}-pnpm-audit.json"
          audit_exit=0
          pnpm -w audit --prod --audit-level=high --json > "${audit_report}" || audit_exit=$?
          if [ ! -s "${audit_report}" ]; then
            echo "::error::pnpm audit did not produce JSON output."
            exit "${audit_exit:-1}"
          fi
          high_count="$(jq -r '.metadata.vulnerabilities.high // 0' "${audit_report}")"
          critical_count="$(jq -r '.metadata.vulnerabilities.critical // 0' "${audit_report}")"
          blocker_count=$((high_count + critical_count))
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit). high=${high_count} critical=${critical_count}"
            if [ "${AUDIT_BLOCKING}" = "1" ] && [ "${blocker_count}" -gt 0 ]; then
              exit "$audit_exit"
            fi
            echo "No blocking high/critical production dependencies detected; continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-security-evidence
          path: .security
          retention-days: 90
          if-no-files-found: ignore

      - name: Configure AWS credentials (primary role)
        id: aws_creds_primary
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: Configure AWS credentials (fallback role)
        id: aws_creds_fallback
        if: steps.aws_creds_primary.outcome != 'success' && vars.AWS_ROLE_TO_ASSUME_FALLBACK != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 2

      - name: Validate AWS credential bootstrap
        if: steps.aws_creds_primary.outcome != 'success' && steps.aws_creds_fallback.outcome != 'success'
        shell: bash
        env:
          AWS_ROLE_PRIMARY: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_ROLE_FALLBACK: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
        run: |
          set -euo pipefail
          echo "::error::Failed to assume AWS role via OIDC using both primary and fallback roles."
          echo "::error::Primary role: ${AWS_ROLE_PRIMARY}"
          echo "::error::Fallback role: ${AWS_ROLE_FALLBACK:-<not configured>}"
          echo "::error::Remediation: update IAM trust policy for GitHub OIDC (aud=sts.amazonaws.com) and this repo/environment."
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - name: Validate Required GitHub Environment Vars (staging)
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
          FRONTEND_CERT_ARN: ${{ vars.FRONTEND_CERT_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_SUPABASE_URL:-}" ] || [ -z "${PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY (configure in GitHub environment: staging)."
            exit 1
          fi
          if [ -z "${FRONTEND_DOMAIN_NAME:-}" ] || [ -z "${FRONTEND_CERT_ARN:-}" ]; then
            echo "Missing FRONTEND_DOMAIN_NAME / FRONTEND_CERT_ARN (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: staging)."
            exit 1
          fi
          if [ -z "${PRIVACY_HASH_SALT:-}" ] || [ -z "${PRIVACY_SESSION_SALT:-}" ]; then
            echo "Missing PRIVACY_HASH_SALT / PRIVACY_SESSION_SALT (configure in GitHub environment secrets: staging)."
            exit 1
          fi
          if [ -z "${SES_IDENTITY_ARNS:-}" ] || [ -z "${SNS_TOPIC_ARNS:-}" ]; then
            echo "Missing SES_IDENTITY_ARNS / SNS_TOPIC_ARNS (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [ -z "${SENTRY_SECRET_ARN:-}" ] || [ -z "${SENTRY_SECRET_JSON_KEY:-}" ]; then
            echo "Missing SENTRY_SECRET_ARN / SENTRY_SECRET_JSON_KEY (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [[ "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" == *"nr-data.net"* ]] && \
            [ -z "${OTEL_EXPORTER_OTLP_HEADERS:-}" ] && \
            [ -z "${NEW_RELIC_INGEST_KEY:-}" ]; then
            echo "Missing OTEL_EXPORTER_OTLP_HEADERS or NEW_RELIC_INGEST_KEY for New Relic OTLP endpoint."
            exit 1
          fi
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || [ -z "${NEW_RELIC_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_REGION:-}" ]; then
            echo "Missing NEW_RELIC_USER_API_KEY / NEW_RELIC_ACCOUNT_ID / NEW_RELIC_REGION for hard New Relic gate."
            exit 1
          fi
          if [ "${NEW_RELIC_STAGING_AWS_MODE:-}" != "otlp_only" ] && \
             [ -z "${NEW_RELIC_STAGING_AWS_ACCOUNT_ID:-}" ]; then
            echo "Missing NEW_RELIC_STAGING_AWS_ACCOUNT_ID for account-pinned verify-signals."
            exit 1
          fi
          if [ "${NEW_RELIC_STAGING_AWS_MODE:-}" != "otlp_only" ] && \
             [ -z "${NEW_RELIC_STAGING_AWS_ROLE_ARN:-}" ]; then
            echo "Missing NEW_RELIC_STAGING_AWS_ROLE_ARN for staging cloud-link sync."
            exit 1
          fi
          if [ "${NEW_RELIC_PROD_AWS_MODE:-}" != "otlp_only" ] && \
             { [ -z "${NEW_RELIC_PROD_AWS_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_PROD_AWS_ROLE_ARN:-}" ]; }; then
            echo "Missing NEW_RELIC_PROD_AWS_ACCOUNT_ID / NEW_RELIC_PROD_AWS_ROLE_ARN for prod cloud-link sync."
            exit 1
          fi
          if { [ "${NEW_RELIC_AWS_METRIC_STREAM_ENABLED:-0}" != "0" ] || [ "${NEW_RELIC_AWS_LOG_FORWARDING_ENABLED:-0}" != "0" ]; } && \
             [ -z "${NEW_RELIC_INGEST_KEY_SECRET_ARN:-}" ]; then
            echo "Missing NEW_RELIC_INGEST_KEY_SECRET_ARN for New Relic AWS metric/log streaming."
            exit 1
          fi
          if [ "${NEW_RELIC_AWS_METRIC_STREAM_ENABLED:-0}" != "0" ] && \
             [ -z "${NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES:-}" ]; then
            echo "Missing NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES for explicit staging metric stream allowlisting."
            exit 1
          fi
          if [ "${PUBLIC_NEW_RELIC_BROWSER_ENABLED:-0}" = "1" ] && \
             ( [ -z "${PUBLIC_NEW_RELIC_ACCOUNT_ID:-}" ] || \
               [ -z "${PUBLIC_NEW_RELIC_TRUST_KEY:-}" ] || \
               [ -z "${PUBLIC_NEW_RELIC_AGENT_ID:-}" ] || \
               [ -z "${PUBLIC_NEW_RELIC_APPLICATION_ID:-}" ] || \
               [ -z "${PUBLIC_NEW_RELIC_LICENSE_KEY:-}" ] ); then
            echo "PUBLIC_NEW_RELIC_BROWSER_ENABLED=1 requires PUBLIC_NEW_RELIC_ACCOUNT_ID/TRUST_KEY/AGENT_ID/APPLICATION_ID/LICENSE_KEY."
            exit 1
          fi

      - name: Observability prereq gate (staging)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          STRICT_CONFIG: '1'
          SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
          NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
          NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
          NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
          NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          pnpm -C backend ci:observability

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve staging posture
        id: staging_posture
        shell: bash
        env:
          REQUESTED_STAGING_MODE: ${{ inputs.staging_mode }}
        run: |
          set -euo pipefail
          case "${REQUESTED_STAGING_MODE:-lean}" in
            lean)
              profile_name="staging"
              requested_mode="lean"
              proof_scope="Deploy path, public unauthenticated surfaces, and lean business-hours posture only."
              ;;
            parity)
              profile_name="staging"
              requested_mode="parity"
              proof_scope="Prod-like release rehearsal for auth, workers, queues, observability, and rollback gates."
              ;;
            *)
              echo "::error::Unsupported staging_mode='${REQUESTED_STAGING_MODE}'. Use lean or parity."
              exit 1
              ;;
          esac

          /bin/bash infrastructure/cdk/apply-profile.sh "${profile_name}"
          cpu_architecture="$(jq -r '.context.cpuArchitecture // empty' infrastructure/cdk/cdk.json)"
          case "${cpu_architecture}" in
            arm64)
              docker_platform="linux/arm64"
              ;;
            x86_64|x86|amd64)
              docker_platform="linux/amd64"
              ;;
            *)
              echo "::error::Profile ${profile_name} produced unsupported cpuArchitecture='${cpu_architecture}'."
              exit 1
              ;;
          esac

          echo "profile_name=${profile_name}" >> "$GITHUB_OUTPUT"
          echo "requested_mode=${requested_mode}" >> "$GITHUB_OUTPUT"
          echo "cpu_architecture=${cpu_architecture}" >> "$GITHUB_OUTPUT"
          echo "docker_platform=${docker_platform}" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging posture"
            echo "- Deployment profile: \`${profile_name}\`"
            echo "- Requested staging mode: \`${requested_mode}\`"
            echo "- CPU architecture: \`${cpu_architecture}\`"
            echo "- Docker platform: \`${docker_platform}\`"
            echo "- Proof scope: ${proof_scope}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture Previous Good Image Tag (staging)
        id: prev_good
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter --name \"/remit-scout/${ENV_NAME}/last-good-image\" --query 'Parameter.Value' --output text 2>/dev/null || true)"
          echo "TAG=${value}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: ${{ steps.staging_posture.outputs.docker_platform }}
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:${{ steps.vars.outputs.SEMVER_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:latest

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          DOCKER_PLATFORM: ${{ steps.staging_posture.outputs.docker_platform }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-staging"
          docker run --rm \
            -v "${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro" \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            aquasec/trivy:0.50.1 \
            image --image-src remote --platform "${DOCKER_PLATFORM}" --no-progress --severity HIGH,CRITICAL --exit-code 1 --ignorefile /root/.trivyignore "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 15); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/15)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "ECR scan found $CRITICAL CRITICAL vulnerabilities. Blocking deploy."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: staging
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        continue-on-error: true
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/rilical/Remit-Scout-V2/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      - name: CDK Diff (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c importExistingBackendRepository=true \
            -c minimalInfra=false \
            -c enableDbProxy=false \
            -c enableCostGuardrails=false \
            -c pinpointEnabled=false \
            -c enableWaf=false \
            -c planeBDisableTier1=false \
            -c planeBB2cRefreshServiceEnabled=true \
            -c planeBFxRateRefreshServiceEnabled=true \
            -c planeBOpsAlertsMode=off \
            -c planeBOpsAlertsDesiredCount=0 \
            -c agentOrchestratorServiceEnabled=false \
            -c agentOrchestratorDesiredCount=0 \
            -c planeBIngestDesiredCount=1 \
            -c planeBB2cRefreshDesiredCount=1 \
            -c planeBFxRateRefreshDesiredCount=1 \
            -c planeBIngestFanoutMode=queue \
            -c planeBIngestFanoutTier1DesiredCount=1 \
            -c planeBIngestFanoutTier2DesiredCount=1 \
            -c quoteRefreshQueueMode=queue \
            -c fxRateRefreshQueueMode=queue \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}"

      - name: Recover CloudFormation rollback state (staging)
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENV_NAME: staging
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "STACK_NAME is not set; cannot check rollback state."
            exit 1
          fi

          aws_cf() {
            timeout 45s aws --cli-connect-timeout 10 --cli-read-timeout 30 cloudformation "$@"
          }

          rollback_skip_args=()
          if [ "${ENV_NAME}" = "staging" ]; then
            nested_stack_arn="$(
              aws_cf describe-stack-resource \
                --stack-name "${STACK_NAME}" \
                --logical-resource-id "RuntimeNestedStackRuntimeNestedStackResourceAA41CB9F" \
                --query 'StackResourceDetail.PhysicalResourceId' \
                --output text 2>/dev/null || true
            )"
            if [ -n "${nested_stack_arn}" ] && [ "${nested_stack_arn}" != "None" ]; then
              nested_stack_name="$(printf '%s' "${nested_stack_arn}" | awk -F'/' '{print $(NF-1)}')"
              if [ -n "${nested_stack_name}" ]; then
                rollback_skip_args=(
                  --resources-to-skip
                  "${nested_stack_name}.AgentOrchestratorServiceDDC1295C"
                  "${nested_stack_name}.OpsAlertsQueueWorkerServiceD58F4B7D"
                )
              fi
            fi
          fi

          continue_update_rollback() {
            if aws_cf continue-update-rollback --stack-name "${STACK_NAME}" "${rollback_skip_args[@]}" >/dev/null; then
              return 0
            fi

            echo "Direct continue-update-rollback was denied. Retrying with the CDK bootstrap deploy role."
            local account_id
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            local deploy_role_arn="arn:aws:iam::${account_id}:role/cdk-hnb659fds-deploy-role-${account_id}-${AWS_REGION}"
            local assumed
            assumed="$(aws sts assume-role \
              --role-arn "${deploy_role_arn}" \
              --role-session-name "cf-rollback-recovery-staging" \
              --duration-seconds 3600 \
              --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
              --output text)"
            if [ -z "${assumed}" ]; then
              echo "::error::Failed to assume bootstrap deploy role ${deploy_role_arn} for rollback recovery."
              return 1
            fi
            read -r AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN <<<"${assumed}"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            aws_cf continue-update-rollback --stack-name "${STACK_NAME}" "${rollback_skip_args[@]}" >/dev/null
          }

          aws_ecs() {
            timeout 45s aws --cli-connect-timeout 10 --cli-read-timeout 30 ecs "$@"
          }

          print_stack_diagnostics() {
            echo "::group::CloudFormation stack diagnostics"
            aws_cf describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].{Status:StackStatus,Reason:StackStatusReason,LastUpdated:LastUpdatedTime}' \
              --output json || true
            echo "::endgroup::"

            echo "::group::Recent CloudFormation events"
            aws_cf describe-stack-events \
              --stack-name "${STACK_NAME}" \
              --max-items 40 \
              --query 'StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
              --output table || true
            echo "::endgroup::"
          }

          stack_status() {
            aws_cf describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text
          }

          if ! aws_cf describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            echo "Stack ${STACK_NAME} not found yet; continuing."
            exit 0
          fi

          status="$(stack_status)"
          echo "Current stack status: ${status}"
          if [ "${status}" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Detected UPDATE_ROLLBACK_FAILED. Attempting continue-update-rollback."
            continue_update_rollback
          fi

          start_epoch="$(date +%s)"
          timeout_seconds=14400
          deadline_epoch=$((start_epoch + timeout_seconds))
          poll_seconds=10
          max_attempts=$((timeout_seconds / poll_seconds))
          for i in $(seq 1 "${max_attempts}"); do
            if [ "$(date +%s)" -ge "${deadline_epoch}" ]; then
              break
            fi
            status="$(stack_status)"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                echo "Stack is stable and deployable: ${status}"
                exit 0
                ;;
              *_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for stable stack state: ${status} (attempt ${i}/${max_attempts})"
                # Every 60s, surface ECS rollout progress and fail fast on explicit FAILED rollouts.
                if [ $((i % 6)) -eq 0 ] && [ "$i" -gt 6 ]; then
                  service_arns="$(aws_ecs list-services --cluster "remit-scout-${ENV_NAME}" --query 'serviceArns' --output text 2>/dev/null || true)"
                  if [ -n "${service_arns}" ] && [ "${service_arns}" != "None" ]; then
                    failed_rollouts="$(aws_ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services ${service_arns} --output json 2>/dev/null \
                      | jq -r '[.services[] | select(any(.deployments[]?; .status == "PRIMARY" and .rolloutState == "FAILED"))] | length' 2>/dev/null \
                      || echo "0")"
                    in_progress_rollouts="$(aws_ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services ${service_arns} --output json 2>/dev/null \
                      | jq -r '[.services[] | select(any(.deployments[]?; .status == "PRIMARY" and .rolloutState == "IN_PROGRESS"))] | length' 2>/dev/null \
                      || echo "0")"
                    if ! [[ "${failed_rollouts}" =~ ^[0-9]+$ ]]; then
                      echo "::warning::Unable to parse failed ECS rollout count: ${failed_rollouts}"
                      failed_rollouts=0
                    fi
                    if ! [[ "${in_progress_rollouts}" =~ ^[0-9]+$ ]]; then
                      echo "::warning::Unable to parse in-progress ECS rollout count: ${in_progress_rollouts}"
                      in_progress_rollouts=0
                    fi
                    echo "Primary ECS services still rolling out: ${in_progress_rollouts}"
                    if [ "${failed_rollouts}" -gt 0 ]; then
                      echo "::error::${failed_rollouts} ECS services have PRIMARY deployments in FAILED state."
                      echo "::error::Check Aurora status, secrets, and Redis before retrying."
                      print_stack_diagnostics
                      exit 1
                    fi
                  fi
                fi
                sleep "${poll_seconds}"
                ;;
              *)
                echo "::error::Stack is not deployable after recovery: ${status}"
                print_stack_diagnostics
                exit 1
                ;;
            esac
          done

          elapsed_seconds=$(( $(date +%s) - start_epoch ))
          echo "::error::Timed out waiting for stack to reach a deployable state after ${elapsed_seconds}s."
          print_stack_diagnostics
          exit 1

      - name: Pre-deploy infrastructure health check (staging)
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -uo pipefail
          cluster_id=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier, '${ENV_NAME}')].DBClusterIdentifier" \
            --output text 2>&1) || {
            echo "::error::Cannot check Aurora status for ${ENV_NAME} (missing rds:DescribeDBClusters permission). Blocking deploy."
            exit 1
          }
          cluster_id="$(echo "$cluster_id" | head -1)"
          if [ -z "$cluster_id" ]; then
            echo "::error::No Aurora cluster found for ${ENV_NAME}. Blocking deploy."
            exit 1
          fi
          status=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$cluster_id" \
            --query 'DBClusters[0].Status' --output text)
          if [ "$status" = "stopped" ]; then
            echo "::warning::Aurora cluster $cluster_id is stopped. Starting..."
            aws rds start-db-cluster --db-cluster-identifier "$cluster_id" || {
              echo "::error::Cannot start Aurora cluster $cluster_id for ${ENV_NAME} (missing rds:StartDBCluster permission). Blocking deploy."
              exit 1
            }
            aws rds wait db-cluster-available --db-cluster-identifier "$cluster_id"
            echo "Aurora is now available."
          elif [ "$status" != "available" ]; then
            echo "::error::Aurora cluster is in state: $status"
            exit 1
          fi
          echo "Aurora health check passed: $status"

      - name: Refresh AWS credentials before CDK deploy (staging, long session)
        id: aws_creds_cdk_staging_long
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 21600
          retry-max-attempts: 3

      - name: Refresh AWS credentials before CDK deploy (staging, standard session fallback)
        if: steps.aws_creds_cdk_staging_long.outcome != 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
          retry-max-attempts: 3

      - name: CDK Deploy (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
          FRONTEND_CERT_ARN: ${{ vars.FRONTEND_CERT_ARN }}
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          max_deploy_seconds=$((45 * 60))
          set +e
          timeout --preserve-status --kill-after=60s "${max_deploy_seconds}s" \
            pnpm -C infrastructure/cdk exec -- cdk deploy \
              -c env="${ENV_NAME}" \
              -c backendImageTag="${IMAGE_TAG}" \
              -c importExistingBackendRepository=true \
              -c minimalInfra=false \
              -c enableDbProxy=false \
              -c enableCostGuardrails=false \
              -c pinpointEnabled=false \
              -c enableWaf=false \
              -c planeBDisableTier1=false \
              -c planeBB2cRefreshServiceEnabled=true \
              -c planeBFxRateRefreshServiceEnabled=true \
              -c planeBOpsAlertsMode=off \
              -c planeBOpsAlertsDesiredCount=0 \
              -c agentOrchestratorServiceEnabled=false \
              -c agentOrchestratorDesiredCount=0 \
              -c planeBIngestDesiredCount=1 \
              -c planeBB2cRefreshDesiredCount=1 \
              -c planeBFxRateRefreshDesiredCount=1 \
              -c planeBIngestFanoutMode=queue \
              -c planeBIngestFanoutTier1DesiredCount=1 \
              -c planeBIngestFanoutTier2DesiredCount=1 \
              -c quoteRefreshQueueMode=queue \
              -c fxRateRefreshQueueMode=queue \
              -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}" \
              -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}" \
              -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
              --require-approval never
          deploy_exit=$?
          set -e

          if [ "${deploy_exit}" -eq 0 ]; then
            exit 0
          fi

          if [ "${deploy_exit}" -eq 124 ]; then
            echo "::error::Staging CDK deploy timed out after ${max_deploy_seconds}s."
          fi

          service_arns="$(aws ecs list-services --cluster "${cluster}" --query 'serviceArns' --output text 2>/dev/null || true)"
          if [ -n "${service_arns}" ] && [ "${service_arns}" != "None" ]; then
            echo "ECS rollout diagnostics:"
            aws ecs describe-services --cluster "${cluster}" --services ${service_arns} --output json \
              | jq -r '
                .services[]
                | select(any(.deployments[]?; .status == "PRIMARY"))
                | "SERVICE\t\(.serviceName)\tPRIMARY\t\((.deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"))\tRUNNING\t\((.deployments[] | select(.status == "PRIMARY") | .runningCount // 0))/\((.deployments[] | select(.status == "PRIMARY") | .desiredCount // 0))",
                  (.events[:5][]? | "EVENT\t\(.serviceName)\t\(.message)")
              '
          fi

          exit "${deploy_exit}"

      - name: Run Migrations (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)"
          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --output json)"
          exit_code="$(echo "$task_json" | jq -r '.tasks[0].containers[0].exitCode // "null"')"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Migration task failed (exitCode=$exit_code): $task_arn"
            stopped_reason="$(echo "$task_json" | jq -r '.tasks[0].stoppedReason // ""')"
            container_reason="$(echo "$task_json" | jq -r '.tasks[0].containers[0].reason // ""')"
            log_group="$(aws ecs describe-task-definition --task-definition "$task_def" --query 'taskDefinition.containerDefinitions[?name==`DbMigrateContainer`].logConfiguration.options."awslogs-group"' --output text 2>/dev/null || true)"
            log_stream="$(echo "$task_json" | jq -r '.tasks[0].containers[0].logStreamName // ""')"
            if [ -z "$log_stream" ] || [ "$log_stream" = "null" ]; then
              task_id="${task_arn##*/}"
              log_stream="db-migrate/DbMigrateContainer/${task_id}"
            fi
            if [ -n "$stopped_reason" ] && [ "$stopped_reason" != "null" ]; then
              echo "::error::ECS stoppedReason: $stopped_reason"
            fi
            if [ -n "$container_reason" ] && [ "$container_reason" != "null" ]; then
              echo "::error::Container reason: $container_reason"
            fi
            if [ -n "$log_group" ] && [ "$log_group" != "None" ] && [ -n "$log_stream" ] && [ "$log_stream" != "null" ]; then
              echo "Dumping migration task logs from ${log_group}:${log_stream}"
              aws logs get-log-events \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --limit 200 \
                --query 'events[].message' \
                --output text || true
            fi
            exit 1
          fi

