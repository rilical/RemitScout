            exit 1
          fi

          set +e
          SMOKE_ALLOW_PROTECTED_METRICS=1 SMOKE_ALLOW_PROTECTED_HEALTH=1 SMOKE_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: Staging Go-live Readiness Gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_ref="${{ steps.resolve_ref.outputs.requested_ref }}"
          if [[ "${dispatch_ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            dispatch_ref="staging"
          fi
          if [ -z "${dispatch_ref}" ] || [ "${dispatch_ref}" = "HEAD" ]; then
            dispatch_ref="staging"
          fi

          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          readiness_run_title="staging/go-live-readiness (${deploy_sha})"
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run staging-go-live-readiness.yml --ref "${dispatch_ref}" \
            -f run_runtime_config_validation=true \
            -f skip_duplicate_admin_smoke=true \
            -f deploy_sha="${deploy_sha}"

          run_id=""
          echo "Waiting for readiness workflow run titled: ${readiness_run_title}"
          for i in $(seq 1 60); do
            run_id="$(gh run list --workflow staging-go-live-readiness.yml --json databaseId,event,createdAt,displayTitle -q "sort_by(.createdAt) | reverse | .[] | select(.event==\"workflow_dispatch\" and .createdAt >= \"${dispatch_started_at}\" and .displayTitle==\"${readiness_run_title}\") | .databaseId" | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Unable to resolve staging-go-live-readiness run ID after dispatch."
            exit 1
          fi

          for i in $(seq 1 240); do
            run_payload="$(gh run view "$run_id" --json status,conclusion 2>/dev/null || true)"
            if [ -z "${run_payload}" ]; then
              sleep 5
              continue
            fi

            run_status="$(echo "$run_payload" | jq -r '.status')"
            run_conclusion="$(echo "$run_payload" | jq -r '.conclusion // ""')"
            if [ "$run_status" = "completed" ]; then
              if [ "$run_conclusion" = "success" ]; then
                echo "Staging readiness workflow run ${run_id} succeeded."
                exit 0
              fi
              echo "Staging readiness workflow run ${run_id} completed with conclusion=${run_conclusion}."
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for staging-go-live-readiness run ${run_id}."
          exit 1

      - name: New Relic observability gate (staging)
        shell: bash
        env:
          ENV_NAME: staging
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
