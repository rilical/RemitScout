            -c enableComplianceServices=false
            -c enableCostGuardrails=false
            -c pinpointEnabled=false
            -c enableSynthetics=false
            -c enableWaf=false
            -c planeBDisableTier1=false
            -c planeBB2cRefreshServiceEnabled=true
            -c planeBFxRateRefreshServiceEnabled=true
            -c stagingBusinessHoursEnabled=false
            -c stagingTimezone="America/New_York"
            -c stagingNatGateways=1
            -c stagingInterfaceEndpointsMode=minimal
            -c alertEvaluationServiceEnabled=true
            -c exportServiceEnabled=true
            -c agentOrchestratorServiceEnabled=true
            -c stressResponderServiceEnabled=true
            -c normalizationServiceEnabled=true
            -c planeBIngestDesiredCount=1
            -c planeBB2cRefreshDesiredCount=1
            -c planeBFxRateRefreshDesiredCount=1
            -c planeBIngestFanoutMode=queue
            -c planeBIngestFanoutTier1DesiredCount=1
            -c planeBIngestFanoutTier2DesiredCount=1
            -c goldLiveDesiredCount=1
            -c planeBNotificationsDesiredCount=1
            -c planeBOpsAlertsDesiredCount=1
            -c alertEvaluationDesiredCount=1
            -c exportWorkerDesiredCount=1
            -c agentOrchestratorDesiredCount=1
            -c stressResponderDesiredCount=1
            -c normalizationWorkerDesiredCount=1
            -c planeBQueueWorkerDesiredCount=1
            -c planeBQueueWorkerMaxCount=3
            -c quoteRefreshQueueMode=queue
            -c fxRateRefreshQueueMode=queue
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}"
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}"
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}"
          )
          if [ -n "${PLANE_A_DOMAIN_NAME:-}" ] && [ -n "${PLANE_A_CERT_ARN:-}" ]; then
            cdk_args+=(
              -c planeADomainName="${PLANE_A_DOMAIN_NAME}"
              -c planeACertificateArn="${PLANE_A_CERT_ARN}"
            )
            if [ -n "${PLANE_A_HOSTED_ZONE_ID:-}" ] && [ -n "${PLANE_A_HOSTED_ZONE_NAME:-}" ]; then
              cdk_args+=(
                -c planeAHostedZoneId="${PLANE_A_HOSTED_ZONE_ID}"
                -c planeAHostedZoneName="${PLANE_A_HOSTED_ZONE_NAME}"
              )
            fi
          fi
          pnpm -C infrastructure/cdk exec -- cdk deploy "${cdk_args[@]}" --require-approval never

      - name: Run Migrations (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Seed Launch Users (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAUNCH_PASSWORD_OMAR: ${{ secrets.LAUNCH_PASSWORD_OMAR }}
          LAUNCH_PASSWORD_DEVELOPER: ${{ secrets.LAUNCH_PASSWORD_DEVELOPER }}
          LAUNCH_PASSWORD_AUSTRILIC: ${{ secrets.LAUNCH_PASSWORD_AUSTRILIC }}
          LAUNCH_PASSWORD_GHABAYENEDU: ${{ secrets.LAUNCH_PASSWORD_GHABAYENEDU }}
          LAUNCH_PASSWORD_SUPPORT: ${{ secrets.LAUNCH_PASSWORD_SUPPORT }}
          DEFAULT_LAUNCH_PASSWORD: ${{ secrets.DEFAULT_LAUNCH_PASSWORD }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"
          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '"%s",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          # Build environment overrides JSON
          env_overrides='['
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LAUNCH_PASSWORD_OMAR LAUNCH_PASSWORD_DEVELOPER LAUNCH_PASSWORD_AUSTRILIC LAUNCH_PASSWORD_GHABAYENEDU LAUNCH_PASSWORD_SUPPORT DEFAULT_LAUNCH_PASSWORD; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              env_overrides+='{"name":"'"$var"'","value":"'"$val"'"},'
            fi
          done
          env_overrides="${env_overrides%,}]"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"DbMigrateContainer\",\"command\":[\"sh\",\"-lc\",\"set -euo pipefail; DATABASE_URL=\\\"postgres://\${PLANE_B_DB_USERNAME}:\${PLANE_B_DB_PASSWORD}@\${PLANE_B_DB_HOST}:\${PLANE_B_DB_PORT:-5432}/\${PLANE_B_DB_NAME}?sslmode=require\\\"; export DATABASE_URL DATABASE_URL_PLANE_A=\\\"\$DATABASE_URL\\\"; node backend/dist/scripts/seed-launch-users.js --force\"],\"environment\":${env_overrides}}]}" \
            --query "tasks[0].taskArn" --output text)"

          echo "Seed task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --output json)"
          exit_code="$(echo "$task_json" | jq -r '.tasks[0].containers[0].exitCode // "null"')"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Seed task failed (exitCode=$exit_code)."
            stopped_reason="$(echo "$task_json" | jq -r '.tasks[0].stoppedReason // ""')"
            container_reason="$(echo "$task_json" | jq -r '.tasks[0].containers[0].reason // ""')"
            log_group="$(aws ecs describe-task-definition --task-definition "$task_def" --query 'taskDefinition.containerDefinitions[?name==`DbMigrateContainer`].logConfiguration.options."awslogs-group"' --output text 2>/dev/null || true)"
            log_stream="$(echo "$task_json" | jq -r '.tasks[0].containers[0].logStreamName // ""')"
            if [ -z "$log_stream" ] || [ "$log_stream" = "null" ]; then
              task_id="${task_arn##*/}"
              log_stream="db-migrate/DbMigrateContainer/${task_id}"
            fi
            if [ -n "$stopped_reason" ] && [ "$stopped_reason" != "null" ]; then
              echo "::error::ECS stoppedReason: $stopped_reason"
            fi
            if [ -n "$container_reason" ] && [ "$container_reason" != "null" ]; then
              echo "::error::Container reason: $container_reason"
            fi
            if [ -n "$log_group" ] && [ "$log_group" != "None" ] && [ -n "$log_stream" ] && [ "$log_stream" != "null" ]; then
              echo "Dumping seed task logs from ${log_group}:${log_stream}"
              aws logs get-log-events \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --limit 200 \
                --query 'events[].message' \
                --output text || true
            fi
            exit 1
          else
            echo "Seed completed successfully."
          fi

      - name: Wait For ECS Stability (staging)
        shell: bash
        env:
