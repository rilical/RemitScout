          PLANE_A_DOMAIN_NAME: ${{ vars.PLANE_A_DOMAIN_NAME }}
          PLANE_A_CERT_ARN: ${{ vars.PLANE_A_CERT_ARN }}
          PLANE_A_HOSTED_ZONE_ID: ${{ vars.PLANE_A_HOSTED_ZONE_ID }}
          PLANE_A_HOSTED_ZONE_NAME: ${{ vars.PLANE_A_HOSTED_ZONE_NAME }}
        run: |
          set -euo pipefail
