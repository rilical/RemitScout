name: cd/deploy

on:
  workflow_run:
    workflows: ['ci/main']
    types: [completed]
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
      ref:
        description: Git ref (sha/branch/tag). Leave empty to use default.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.env == 'dev') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run != null && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop')
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || '50' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || '20' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - name: Resolve deployment ref (dev)
        id: resolve_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.ref != '' && inputs.ref || github.sha) }}
        run: |
          set -euo pipefail
          requested="$(echo "${REQUESTED_REF}" | xargs)"
          if [ -z "${requested}" ]; then
            echo "::error::Empty deploy ref; unable to continue."
            exit 1
          fi

          resolved=""
          candidate="${requested}"
          for _ in 1 2 3; do
            encoded="$(printf '%s' "${candidate}" | jq -sRr @uri)"
            resolved="$(gh api "repos/${REPO}/commits/${encoded}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "${resolved}" ]; then
              break
            fi
            if [[ "${candidate}" == refs/heads/* ]]; then
              candidate="${candidate#refs/heads/}"
              continue
            fi
            if [[ "${candidate}" == refs/tags/* ]]; then
              candidate="${candidate#refs/tags/}"
              continue
            fi
            break
          done

          if [ -z "${resolved}" ]; then
            echo "::error::Unable to resolve deploy ref '${requested}' to a commit SHA."
            echo "::error::Provide a valid branch name, tag, short SHA, or full SHA."
            exit 1
          fi

          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "requested_ref=${requested}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref '${requested}' -> ${resolved}"

      - name: Verify ci/main gate for dispatch SHA (dev)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          run_id="$(gh run list --repo "$REPO" --workflow ci-main.yml --json databaseId,headSha,conclusion -q ".[] | select(.headSha==\"${deploy_sha}\" and .conclusion==\"success\") | .databaseId" | head -n1)"
          if [ -z "$run_id" ]; then
            echo "No successful ci/main run found for commit ${deploy_sha}."
            echo "Manual deploys must reference a tested SHA."
            exit 1
          fi
          echo "Found successful ci/main run: ${run_id}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.sha }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: dev
          AUDIT_BLOCKING: '0'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_exit=0
          pnpm -w audit --audit-level=high --json > ".security/${SECURITY_ENV}-pnpm-audit.json" || audit_exit=$?
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit)."
            if [ "${AUDIT_BLOCKING}" = "1" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking mode: continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev-security-evidence
          path: .security
          retention-days: 90
          if-no-files-found: ignore

      - name: Configure AWS credentials (primary role)
        id: aws_creds_primary
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: Configure AWS credentials (fallback role)
        id: aws_creds_fallback
        if: steps.aws_creds_primary.outcome != 'success' && vars.AWS_ROLE_TO_ASSUME_FALLBACK != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 2

      - name: Validate AWS credential bootstrap
        if: steps.aws_creds_primary.outcome != 'success' && steps.aws_creds_fallback.outcome != 'success'
        shell: bash
        env:
          AWS_ROLE_PRIMARY: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_ROLE_FALLBACK: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
        run: |
          set -euo pipefail
          echo "::error::Failed to assume AWS role via OIDC using both primary and fallback roles."
          echo "::error::Primary role: ${AWS_ROLE_PRIMARY}"
          echo "::error::Fallback role: ${AWS_ROLE_FALLBACK:-<not configured>}"
          echo "::error::Remediation: update IAM trust policy for GitHub OIDC (aud=sts.amazonaws.com) and this repo/environment."
          exit 1

      - name: Validate Required Secrets (dev)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: dev)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: dev
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:${{ steps.vars.outputs.SEMVER_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        continue-on-error: true
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-dev"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            aquasec/trivy:0.50.1 \
            image --no-progress --severity HIGH,CRITICAL --exit-code 0 "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        continue-on-error: true
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 15); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/15)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "::warning::ECR scan found $CRITICAL CRITICAL vulnerabilities."
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/rilical/Remit-Scout-V2/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      - name: CDK Diff (dev)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-50}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-20}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            -c devPaused=true \
            -c planeBIngestDesiredCount=0 \
            -c planeBB2cRefreshDesiredCount=0 \
            -c planeBIngestFanoutTier1DesiredCount=0 \
            -c planeBIngestFanoutTier2DesiredCount=0 \
            -c goldLiveDesiredCount=0 \
            -c planeBNotificationsDesiredCount=0 \
            -c planeBOpsAlertsDesiredCount=0 \
            -c planeBQueueWorkerDesiredCount=0 \
            -c planeBQueueWorkerMaxCount=0 \
            -c planeBDisableTier1=true \
            -c enableFrontend=false

      - name: Recover CloudFormation rollback state (dev)
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "STACK_NAME is not set; cannot check rollback state."
            exit 1
          fi

          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            echo "Stack ${STACK_NAME} not found yet; continuing."
            exit 0
          fi

          status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
          echo "Current stack status: ${status}"
          if [ "${status}" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Detected UPDATE_ROLLBACK_FAILED. Attempting continue-update-rollback."
            aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}" >/dev/null
          fi

          max_attempts=90
          poll_seconds=10
          for i in $(seq 1 "${max_attempts}"); do
            status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                echo "Stack is stable and deployable: ${status}"
                exit 0
                ;;
              *_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for stable stack state: ${status} (attempt ${i}/${max_attempts})"
                # Every 60s, check if ECS services are stuck in failed deployment
                if [ $((i % 6)) -eq 0 ] && [ "$i" -gt 6 ]; then
                  failing=$(aws ecs list-services --cluster "remit-scout-${ENV_NAME}" --output json 2>/dev/null \
                    | jq -r '.serviceArns[]' 2>/dev/null \
                    | xargs -r -I{} aws ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services {} --output json 2>/dev/null \
                    | jq '[.services[] | select((.deployments[]? | select(.status=="PRIMARY") | .rolloutState) == "IN_PROGRESS")] | length' 2>/dev/null \
                    || echo "0")
                  if [ "${failing:-0}" -gt 3 ]; then
                    echo "::error::${failing} ECS services stuck in failed deployment. Likely infrastructure dependency issue."
                    echo "::error::Check Aurora status, secrets, and Redis before retrying."
                    exit 1
                  fi
                fi
                sleep "${poll_seconds}"
                ;;
              *)
                echo "::error::Stack is not deployable after recovery: ${status}"
                exit 1
                ;;
            esac
          done

          timeout_seconds=$((max_attempts * poll_seconds))
          echo "::error::Timed out waiting for stack to reach a deployable state after ${timeout_seconds}s."
          exit 1

      - name: Pre-deploy infrastructure health check (dev)
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -uo pipefail
          cluster_id=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier, '${ENV_NAME}')].DBClusterIdentifier" \
            --output text 2>&1) || {
            echo "::warning::Cannot check Aurora status (missing rds:DescribeDBClusters permission). Continuing deploy."
            exit 0
          }
          cluster_id="$(echo "$cluster_id" | head -1)"
          if [ -z "$cluster_id" ]; then
            echo "No Aurora cluster found for ${ENV_NAME}; skipping health check."
            exit 0
          fi
          status=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$cluster_id" \
            --query 'DBClusters[0].Status' --output text)
          if [ "$status" = "stopped" ]; then
            echo "::warning::Aurora cluster $cluster_id is stopped. Starting..."
            aws rds start-db-cluster --db-cluster-identifier "$cluster_id" || {
              echo "::warning::Cannot start Aurora (missing rds:StartDBCluster permission). Continuing deploy."
              exit 0
            }
            aws rds wait db-cluster-available --db-cluster-identifier "$cluster_id"
            echo "Aurora is now available."
          elif [ "$status" != "available" ]; then
            echo "::error::Aurora cluster is in state: $status"
            exit 1
          fi
          echo "Aurora health check passed: $status"

      - name: Refresh AWS credentials before CDK deploy (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: CDK Deploy (dev, paused)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-50}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-20}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            -c devPaused=true \
            -c planeBIngestDesiredCount=0 \
            -c planeBB2cRefreshDesiredCount=0 \
            -c planeBIngestFanoutTier1DesiredCount=0 \
            -c planeBIngestFanoutTier2DesiredCount=0 \
            -c goldLiveDesiredCount=0 \
            -c planeBNotificationsDesiredCount=0 \
            -c planeBOpsAlertsDesiredCount=0 \
            -c planeBQueueWorkerDesiredCount=0 \
            -c planeBQueueWorkerMaxCount=0 \
            -c planeBDisableTier1=true \
            -c enableFrontend=false \
            --require-approval never

      - name: Run Migrations (dev)
        shell: bash
        env:
          ENV_NAME: dev
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=ENABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Wait For ECS Stability (dev)
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ]; then
            aws ecs wait services-stable --cluster "$cluster" --services $services
          fi

      - name: Post-deploy Smoke (dev)
        shell: bash
        env:
          ENV_NAME: dev
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi
          API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke

      - name: Record Last-known-good Image (dev)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --type "String" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: dev
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: dev
          STATUS: ${{ job.status }}
          COMMIT_SHA_IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "Skipping Slack notification: SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi
          COMMIT_SHA="${COMMIT_SHA_IMAGE_TAG:-${RESOLVE_REF_SHA:-${DEFAULT_SHA:-unknown}}}"
          if [ -z "${COMMIT_SHA}" ] || [ "${COMMIT_SHA}" = "null" ]; then
            COMMIT_SHA="unknown"
          fi
          if [[ "${COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT_SHA="${COMMIT_SHA:0:7}"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null

  deploy-staging:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.env == 'staging') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run != null && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging')
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SENTRY_SECRET_ARN: ${{ vars.SENTRY_SECRET_ARN }}
      SENTRY_SECRET_JSON_KEY: ${{ vars.SENTRY_SECRET_JSON_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
      TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
      NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
      NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
      NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
      NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
      NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
      NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
      NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
      NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
      PROXY_RESIDENTIAL_SECRET_ARN: ${{ vars.PROXY_RESIDENTIAL_SECRET_ARN }}
      PROXY_RESIDENTIAL_SECRET_JSON_KEY: ${{ vars.PROXY_RESIDENTIAL_SECRET_JSON_KEY }}
      PROXY_RESIDENTIAL_SSM_NAME: ${{ vars.PROXY_RESIDENTIAL_SSM_NAME }}
      PROXY_RESIDENTIAL_URL: ${{ secrets.PROXY_RESIDENTIAL_URL || vars.PROXY_RESIDENTIAL_URL }}
      PROXY_DATACENTER_SECRET_ARN: ${{ vars.PROXY_DATACENTER_SECRET_ARN }}
      PROXY_DATACENTER_SECRET_JSON_KEY: ${{ vars.PROXY_DATACENTER_SECRET_JSON_KEY }}
      PROXY_DATACENTER_SSM_NAME: ${{ vars.PROXY_DATACENTER_SSM_NAME }}
      PROXY_DATACENTER_URL: ${{ secrets.PROXY_DATACENTER_URL || vars.PROXY_DATACENTER_URL }}
      CAPABILITY_PROBE_PROXY_TIER: ${{ vars.CAPABILITY_PROBE_PROXY_TIER || 'NONE' }}
      AGENT_LLM_CONNECTOR: ${{ vars.AGENT_LLM_CONNECTOR }}
      AGENT_LLM_MODEL: ${{ vars.AGENT_LLM_MODEL }}
      AGENT_LLM_PROMPT_VERSION: ${{ vars.AGENT_LLM_PROMPT_VERSION }}
      AGENT_ANTHROPIC_API_KEY_SECRET_ARN: ${{ vars.AGENT_ANTHROPIC_API_KEY_SECRET_ARN }}
      SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
      SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
      SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
      WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
      ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
      PLANE_A_ADMIN_EMAILS: ${{ vars.PLANE_A_ADMIN_EMAILS }}
      PLANE_A_ENABLE_JWT_AUTH: ${{ vars.PLANE_A_ENABLE_JWT_AUTH }}
      PLANE_A_REQUIRE_JWT: ${{ vars.PLANE_A_REQUIRE_JWT }}
      PLANE_A_REQUIRE_API_KEY: ${{ vars.PLANE_A_REQUIRE_API_KEY }}
      PLANE_A_JWT_ISSUER: ${{ vars.PLANE_A_JWT_ISSUER }}
      PLANE_A_JWT_AUDIENCES: ${{ vars.PLANE_A_JWT_AUDIENCES }}
      PRIVACY_HASH_SALT: ${{ secrets.PRIVACY_HASH_SALT }}
      PRIVACY_SESSION_SALT: ${{ secrets.PRIVACY_SESSION_SALT }}
      PLANE_A_CORS_ORIGINS: ${{ vars.PLANE_A_CORS_ORIGINS }}
      PLANE_A_CORS_ALLOWED_HEADERS: ${{ vars.PLANE_A_CORS_ALLOWED_HEADERS }}
      PLANE_A_CORS_ALLOWED_METHODS: ${{ vars.PLANE_A_CORS_ALLOWED_METHODS }}
      PLANE_A_CORS_ALLOW_CREDENTIALS: ${{ vars.PLANE_A_CORS_ALLOW_CREDENTIALS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PUBLIC_GTM_CONTAINER_ID: ${{ vars.PUBLIC_GTM_CONTAINER_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.PUBLIC_LINKEDIN_PARTNER_ID }}
      PUBLIC_REDDIT_PIXEL_ID: ${{ vars.PUBLIC_REDDIT_PIXEL_ID }}
      PUBLIC_X_PIXEL_ID: ${{ vars.PUBLIC_X_PIXEL_ID }}
      PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.PUBLIC_TIKTOK_PIXEL_ID }}
      PUBLIC_CONTENTSQUARE_TAG_SRC: ${{ vars.PUBLIC_CONTENTSQUARE_TAG_SRC }}
      PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
      PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID }}
      PUBLIC_ENABLE_ADS: ${{ vars.PUBLIC_ENABLE_ADS }}
      PUBLIC_AD_COMPARE_INLINE_IDS: ${{ vars.PUBLIC_AD_COMPARE_INLINE_IDS }}
      PUBLIC_AD_COMPARE_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_COMPARE_SIDEBAR_IDS }}
      PUBLIC_AD_HOME_INLINE_IDS: ${{ vars.PUBLIC_AD_HOME_INLINE_IDS }}
      PUBLIC_AD_DASHBOARD_INLINE_IDS: ${{ vars.PUBLIC_AD_DASHBOARD_INLINE_IDS }}
      PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS }}
      PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS }}
      PUBLIC_AD_CORRIDOR_FOOTER_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_FOOTER_IDS }}
      PUBLIC_AD_BLOG_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_BLOG_SIDEBAR_IDS }}
      PUBLIC_AD_BLOG_INLINE_IDS: ${{ vars.PUBLIC_AD_BLOG_INLINE_IDS }}
      PUBLIC_AD_BLOG_BANNER_IDS: ${{ vars.PUBLIC_AD_BLOG_BANNER_IDS }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || vars.STAGING_COST_BUDGET_AMOUNT_USD || '100' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || vars.STAGING_COST_ANOMALY_THRESHOLD_USD || '60' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || vars.STAGING_COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - name: Resolve deployment ref (staging)
        id: resolve_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.ref != '' && inputs.ref || github.sha) }}
        run: |
          set -euo pipefail
          requested="$(echo "${REQUESTED_REF}" | xargs)"
          if [ -z "${requested}" ]; then
            echo "::error::Empty deploy ref; unable to continue."
            exit 1
          fi

          resolved=""
          candidate="${requested}"
          for _ in 1 2 3; do
            encoded="$(printf '%s' "${candidate}" | jq -sRr @uri)"
            resolved="$(gh api "repos/${REPO}/commits/${encoded}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "${resolved}" ]; then
              break
            fi
            if [[ "${candidate}" == refs/heads/* ]]; then
              candidate="${candidate#refs/heads/}"
              continue
            fi
            if [[ "${candidate}" == refs/tags/* ]]; then
              candidate="${candidate#refs/tags/}"
              continue
            fi
            break
          done

          if [ -z "${resolved}" ]; then
            echo "::error::Unable to resolve deploy ref '${requested}' to a commit SHA."
            echo "::error::Provide a valid branch name, tag, short SHA, or full SHA."
            exit 1
          fi

          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "requested_ref=${requested}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref '${requested}' -> ${resolved}"

      - name: Verify ci/main gate for dispatch SHA (staging)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          run_id="$(gh run list --repo "$REPO" --workflow ci-main.yml --json databaseId,headSha,conclusion -q ".[] | select(.headSha==\"${deploy_sha}\" and .conclusion==\"success\") | .databaseId" | head -n1)"
          if [ -z "$run_id" ]; then
            echo "No successful ci/main run found for commit ${deploy_sha}."
            echo "Manual deploys must reference a tested SHA."
            exit 1
          fi
          echo "Found successful ci/main run: ${run_id}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.sha }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: staging
          AUDIT_BLOCKING: '1'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_exit=0
          pnpm -w audit --audit-level=high --json > ".security/${SECURITY_ENV}-pnpm-audit.json" || audit_exit=$?
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit)."
            if [ "${AUDIT_BLOCKING}" = "1" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking mode: continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-security-evidence
          path: .security
          retention-days: 90
          if-no-files-found: ignore

      - name: Configure AWS credentials (primary role)
        id: aws_creds_primary
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: Configure AWS credentials (fallback role)
        id: aws_creds_fallback
        if: steps.aws_creds_primary.outcome != 'success' && vars.AWS_ROLE_TO_ASSUME_FALLBACK != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 2

      - name: Validate AWS credential bootstrap
        if: steps.aws_creds_primary.outcome != 'success' && steps.aws_creds_fallback.outcome != 'success'
        shell: bash
        env:
          AWS_ROLE_PRIMARY: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_ROLE_FALLBACK: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
        run: |
          set -euo pipefail
          echo "::error::Failed to assume AWS role via OIDC using both primary and fallback roles."
          echo "::error::Primary role: ${AWS_ROLE_PRIMARY}"
          echo "::error::Fallback role: ${AWS_ROLE_FALLBACK:-<not configured>}"
          echo "::error::Remediation: update IAM trust policy for GitHub OIDC (aud=sts.amazonaws.com) and this repo/environment."
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - name: Validate Required GitHub Environment Vars (staging)
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
          FRONTEND_CERT_ARN: ${{ vars.FRONTEND_CERT_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_SUPABASE_URL:-}" ] || [ -z "${PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY (configure in GitHub environment: staging)."
            exit 1
          fi
          if [ -z "${FRONTEND_DOMAIN_NAME:-}" ] || [ -z "${FRONTEND_CERT_ARN:-}" ]; then
            echo "Missing FRONTEND_DOMAIN_NAME / FRONTEND_CERT_ARN (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: staging)."
            exit 1
          fi
          if [ -z "${PRIVACY_HASH_SALT:-}" ] || [ -z "${PRIVACY_SESSION_SALT:-}" ]; then
            echo "Missing PRIVACY_HASH_SALT / PRIVACY_SESSION_SALT (configure in GitHub environment secrets: staging)."
            exit 1
          fi
          if [ -z "${SES_IDENTITY_ARNS:-}" ] || [ -z "${SNS_TOPIC_ARNS:-}" ]; then
            echo "Missing SES_IDENTITY_ARNS / SNS_TOPIC_ARNS (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [ -z "${SENTRY_SECRET_ARN:-}" ] || [ -z "${SENTRY_SECRET_JSON_KEY:-}" ]; then
            echo "Missing SENTRY_SECRET_ARN / SENTRY_SECRET_JSON_KEY (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [[ "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" == *"nr-data.net"* ]] && \
            [ -z "${OTEL_EXPORTER_OTLP_HEADERS:-}" ] && \
            [ -z "${NEW_RELIC_INGEST_KEY:-}" ]; then
            echo "Missing OTEL_EXPORTER_OTLP_HEADERS or NEW_RELIC_INGEST_KEY for New Relic OTLP endpoint."
            exit 1
          fi
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || [ -z "${NEW_RELIC_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_REGION:-}" ]; then
            echo "WARN: New Relic hard gate vars missing; observability gates will be skipped for this staging deploy."
          fi
          if [ -z "${NEW_RELIC_STAGING_AWS_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_STAGING_AWS_ROLE_ARN:-}" ] || [ -z "${NEW_RELIC_PROD_AWS_ROLE_ARN:-}" ]; then
            echo "WARN: New Relic cloud-link vars missing; observability gates will be skipped for this staging deploy."
          fi

      - name: Observability prereq gate (staging)
        env:
          ENVIRONMENT: staging
          NODE_ENV: staging
          STRICT_CONFIG: '1'
          SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || \
             [ -z "${NEW_RELIC_STAGING_AWS_ACCOUNT_ID:-}" ] || \
             [ -z "${NEW_RELIC_STAGING_AWS_ROLE_ARN:-}" ] || \
             [ -z "${NEW_RELIC_PROD_AWS_ROLE_ARN:-}" ]; then
            echo "Skipping staging observability prereq gate: New Relic prerequisites are incomplete."
            exit 0
          fi
          pnpm -C backend ci:observability

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: staging
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Capture Previous Good Image Tag (staging)
        id: prev_good
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter --name \"/remit-scout/${ENV_NAME}/last-good-image\" --query 'Parameter.Value' --output text 2>/dev/null || true)"
          echo "TAG=${value}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:${{ steps.vars.outputs.SEMVER_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        continue-on-error: true
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-staging"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            aquasec/trivy:0.50.1 \
            image --no-progress --severity HIGH,CRITICAL --exit-code 0 "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        continue-on-error: true
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 15); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/15)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "::warning::ECR scan found $CRITICAL CRITICAL vulnerabilities."
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: staging
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        continue-on-error: true
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/rilical/Remit-Scout-V2/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      - name: CDK Diff (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c cpuArchitecture=x86_64 \
            -c importExistingBackendRepository=true \
            -c minimalInfra=false \
            -c enableDbProxy=false \
            -c providerProbeMode=per_provider \
            -c enableComplianceServices=false \
            -c enableCostGuardrails=false \
            -c pinpointEnabled=false \
            -c enableWaf=false \
            -c planeBDisableTier1=false \
            -c planeBB2cRefreshServiceEnabled=true \
            -c planeBFxRateRefreshServiceEnabled=true \
            -c planeBIngestDesiredCount=1 \
            -c planeBB2cRefreshDesiredCount=1 \
            -c planeBFxRateRefreshDesiredCount=1 \
            -c planeBIngestFanoutMode=queue \
            -c planeBIngestFanoutTier1DesiredCount=1 \
            -c planeBIngestFanoutTier2DesiredCount=1 \
            -c quoteRefreshQueueMode=queue \
            -c fxRateRefreshQueueMode=queue \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}"

      - name: Recover CloudFormation rollback state (staging)
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          ENV_NAME: staging
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "STACK_NAME is not set; cannot check rollback state."
            exit 1
          fi

          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            echo "Stack ${STACK_NAME} not found yet; continuing."
            exit 0
          fi

          status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
          echo "Current stack status: ${status}"
          if [ "${status}" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Detected UPDATE_ROLLBACK_FAILED. Attempting continue-update-rollback."
            aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}" >/dev/null
          fi

          max_attempts=90
          poll_seconds=10
          for i in $(seq 1 "${max_attempts}"); do
            status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                echo "Stack is stable and deployable: ${status}"
                exit 0
                ;;
              *_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for stable stack state: ${status} (attempt ${i}/${max_attempts})"
                # Every 60s, check if ECS services are stuck in failed deployment
                if [ $((i % 6)) -eq 0 ] && [ "$i" -gt 6 ]; then
                  failing=$(aws ecs list-services --cluster "remit-scout-${ENV_NAME}" --output json 2>/dev/null \
                    | jq -r '.serviceArns[]' 2>/dev/null \
                    | xargs -r -I{} aws ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services {} --output json 2>/dev/null \
                    | jq '[.services[] | select((.deployments[]? | select(.status=="PRIMARY") | .rolloutState) == "IN_PROGRESS")] | length' 2>/dev/null \
                    || echo "0")
                  if [ "${failing:-0}" -gt 3 ]; then
                    echo "::error::${failing} ECS services stuck in failed deployment. Likely infrastructure dependency issue."
                    echo "::error::Check Aurora status, secrets, and Redis before retrying."
                    exit 1
                  fi
                fi
                sleep "${poll_seconds}"
                ;;
              *)
                echo "::error::Stack is not deployable after recovery: ${status}"
                exit 1
                ;;
            esac
          done

          timeout_seconds=$((max_attempts * poll_seconds))
          echo "::error::Timed out waiting for stack to reach a deployable state after ${timeout_seconds}s."
          exit 1

      - name: Pre-deploy infrastructure health check (staging)
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -uo pipefail
          cluster_id=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier, '${ENV_NAME}')].DBClusterIdentifier" \
            --output text 2>&1) || {
            echo "::warning::Cannot check Aurora status (missing rds:DescribeDBClusters permission). Continuing deploy."
            exit 0
          }
          cluster_id="$(echo "$cluster_id" | head -1)"
          if [ -z "$cluster_id" ]; then
            echo "No Aurora cluster found for ${ENV_NAME}; skipping health check."
            exit 0
          fi
          status=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$cluster_id" \
            --query 'DBClusters[0].Status' --output text)
          if [ "$status" = "stopped" ]; then
            echo "::warning::Aurora cluster $cluster_id is stopped. Starting..."
            aws rds start-db-cluster --db-cluster-identifier "$cluster_id" || {
              echo "::warning::Cannot start Aurora (missing rds:StartDBCluster permission). Continuing deploy."
              exit 0
            }
            aws rds wait db-cluster-available --db-cluster-identifier "$cluster_id"
            echo "Aurora is now available."
          elif [ "$status" != "available" ]; then
            echo "::error::Aurora cluster is in state: $status"
            exit 1
          fi
          echo "Aurora health check passed: $status"

      - name: Refresh AWS credentials before CDK deploy (staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: CDK Deploy (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
          FRONTEND_CERT_ARN: ${{ vars.FRONTEND_CERT_ARN }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c cpuArchitecture=x86_64 \
            -c importExistingBackendRepository=true \
            -c minimalInfra=false \
            -c enableDbProxy=false \
            -c providerProbeMode=per_provider \
            -c enableComplianceServices=false \
            -c enableCostGuardrails=false \
            -c pinpointEnabled=false \
            -c enableWaf=false \
            -c planeBDisableTier1=false \
            -c planeBB2cRefreshServiceEnabled=true \
            -c planeBFxRateRefreshServiceEnabled=true \
            -c planeBIngestDesiredCount=1 \
            -c planeBB2cRefreshDesiredCount=1 \
            -c planeBFxRateRefreshDesiredCount=1 \
            -c planeBIngestFanoutMode=queue \
            -c planeBIngestFanoutTier1DesiredCount=1 \
            -c planeBIngestFanoutTier2DesiredCount=1 \
            -c quoteRefreshQueueMode=queue \
            -c fxRateRefreshQueueMode=queue \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            --require-approval never

      - name: Run Migrations (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          SKIP_MIGRATIONS: '1'
        run: |
          set -euo pipefail
          if [ "${SKIP_MIGRATIONS:-0}" = "1" ]; then
            echo "Skipping migrations for staging minimal deploy profile."
            exit 0
          fi
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Seed Launch Users (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          DATABASE_URL_PLANE_A: ${{ secrets.DATABASE_URL_PLANE_A }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAUNCH_PASSWORD_OMAR: ${{ secrets.LAUNCH_PASSWORD_OMAR }}
          LAUNCH_PASSWORD_DEVELOPER: ${{ secrets.LAUNCH_PASSWORD_DEVELOPER }}
          LAUNCH_PASSWORD_AUSTRILIC: ${{ secrets.LAUNCH_PASSWORD_AUSTRILIC }}
          LAUNCH_PASSWORD_GHABAYENEDU: ${{ secrets.LAUNCH_PASSWORD_GHABAYENEDU }}
          LAUNCH_PASSWORD_SUPPORT: ${{ secrets.LAUNCH_PASSWORD_SUPPORT }}
          DEFAULT_LAUNCH_PASSWORD: ${{ secrets.DEFAULT_LAUNCH_PASSWORD }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"
          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '"%s",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          # Build environment overrides JSON
          env_overrides='['
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LAUNCH_PASSWORD_OMAR LAUNCH_PASSWORD_DEVELOPER LAUNCH_PASSWORD_AUSTRILIC LAUNCH_PASSWORD_GHABAYENEDU LAUNCH_PASSWORD_SUPPORT DEFAULT_LAUNCH_PASSWORD; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              env_overrides+='{"name":"'"$var"'","value":"'"$val"'"},'
            fi
          done
          if [ -n "${DATABASE_URL_PLANE_A:-}" ]; then
            env_overrides+='{"name":"DATABASE_URL","value":"'"$DATABASE_URL_PLANE_A"'"},'
            env_overrides+='{"name":"DATABASE_URL_PLANE_A","value":"'"$DATABASE_URL_PLANE_A"'"},'
          fi
          env_overrides+='{"name":"NODE_OPTIONS","value":"--dns-result-order=ipv4first"},'
          env_overrides="${env_overrides%,}]"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"DbMigrateContainer\",\"command\":[\"node\",\"backend/dist/scripts/seed-launch-users.js\",\"--force\"],\"environment\":${env_overrides}}]}" \
            --query "tasks[0].taskArn" --output text)"

          echo "Seed task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --output json)"
          exit_code="$(echo "$task_json" | jq -r '.tasks[0].containers[0].exitCode // "null"')"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Seed task failed (exitCode=$exit_code)."
            stopped_reason="$(echo "$task_json" | jq -r '.tasks[0].stoppedReason // ""')"
            container_reason="$(echo "$task_json" | jq -r '.tasks[0].containers[0].reason // ""')"
            log_group="$(aws ecs describe-task-definition --task-definition "$task_def" --query 'taskDefinition.containerDefinitions[?name==`DbMigrateContainer`].logConfiguration.options."awslogs-group"' --output text 2>/dev/null || true)"
            log_stream="$(echo "$task_json" | jq -r '.tasks[0].containers[0].logStreamName // ""')"
            if [ -z "$log_stream" ] || [ "$log_stream" = "null" ]; then
              task_id="${task_arn##*/}"
              log_stream="db-migrate/DbMigrateContainer/${task_id}"
            fi
            if [ -n "$stopped_reason" ] && [ "$stopped_reason" != "null" ]; then
              echo "::error::ECS stoppedReason: $stopped_reason"
            fi
            if [ -n "$container_reason" ] && [ "$container_reason" != "null" ]; then
              echo "::error::Container reason: $container_reason"
            fi
            if [ -n "$log_group" ] && [ "$log_group" != "None" ] && [ -n "$log_stream" ] && [ "$log_stream" != "null" ]; then
              echo "Dumping seed task logs from ${log_group}:${log_stream}"
              aws logs get-log-events \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --limit 200 \
                --query 'events[].message' \
                --output text || true
            fi
            exit 1
          else
            echo "Seed completed successfully."
          fi

      - name: Wait For ECS Stability (staging)
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ]; then
            aws ecs wait services-stable --cluster "$cluster" --services $services
          fi

      - name: Deploy Frontend (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          bucket="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')"
          dist_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue')"
          dist_domain="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendDistributionDomain") | .OutputValue')"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          export NODE_ENV=staging
          export CLOUDFRONT_DISTRIBUTION_ID="$dist_id"
          export FRONTEND_DISTRIBUTION_DOMAIN="${dist_domain:-}"
          export PLANE_A_CLOUDFRONT_DOMAIN="${plane_a_cf:-}"
          export PLANE_A_API_ENDPOINT="${plane_a_api:-}"
          export PUBLIC_API_BASE="${api_base}/api/v1"
          export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL}"
          export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY}"

          pnpm -C frontend build
          pnpm -C frontend generate

          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            pnpm -C frontend sentry:sourcemaps || echo "::warning::Sentry sourcemap upload failed (non-fatal)"
          else
            echo "⚠️ SENTRY_AUTH_TOKEN not set — skipping sourcemap upload"
          fi

          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "public, max-age=31536000, immutable" --exclude "*.html" --exclude "*.json" --exclude "*.map"
          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "no-cache, no-store, must-revalidate" --exclude "*" --include "*.html" --include "*.json"
          aws cloudfront create-invalidation --distribution-id "$dist_id" --paths "/*" >/dev/null

      - name: Verify Public API Routes (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          refresh_status="$(curl -sS -o /tmp/refresh-status.out -w '%{http_code}' "${api_base}/api/v1/quotes/refresh-status?request_ids=00000000-0000-4000-8000-000000000001")"
          if [ "${refresh_status}" = "401" ]; then
            echo "/quotes/refresh-status returned 401"
            cat /tmp/refresh-status.out
            exit 1
          fi

          session_status="$(curl -sS -o /tmp/session-track.out -w '%{http_code}' -X POST "${api_base}/api/v1/sessions/track" -H 'content-type: application/json' --data '{"session_id":"stg-check-session","anon_id":"stg-check-anon","metadata":{"source":"deploy-check"}}')"
          if [ "${session_status}" = "401" ]; then
            echo "/sessions/track returned 401"
            cat /tmp/session-track.out
            exit 1
          fi

          pricing_status="$(curl -sS -o /tmp/pricing.out -w '%{http_code}' "${api_base}/api/v1/billing/pricing")"
          if [ "${pricing_status}" = "401" ]; then
            echo "/billing/pricing returned 401"
            cat /tmp/pricing.out
            exit 1
          fi

      - name: Authenticated Watchlist/Alerts Smoke (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY for authenticated smoke."
            exit 1
          fi
          if [ -z "${SMOKE_USER_EMAIL:-}" ] || [ -z "${SMOKE_USER_PASSWORD:-}" ]; then
            echo "Skipping authenticated smoke: SMOKE_USER_EMAIL or SMOKE_USER_PASSWORD not configured in staging environment secrets."
            exit 0
          fi

          SMOKE_BASE_URL="$api_base" \
          SUPABASE_URL="$SUPABASE_URL" \
          SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
          SMOKE_USER_EMAIL="$SMOKE_USER_EMAIL" \
          SMOKE_USER_PASSWORD="$SMOKE_USER_PASSWORD" \
          pnpm -C backend ci:alerts-watchlists-smoke

      - name: Post-deploy Smoke (staging) + Auto Rollback On Failure
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          set +e
          SMOKE_ALLOW_PROTECTED_METRICS=1 SMOKE_ALLOW_PROTECTED_HEALTH=1 API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: Staging Go-live Readiness Gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_ref="${GITHUB_REF_NAME:-staging}"
          if [ -z "${dispatch_ref}" ] || [ "${dispatch_ref}" = "HEAD" ]; then
            dispatch_ref="staging"
          fi

          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run staging-go-live-readiness.yml --ref "${dispatch_ref}" -f run_runtime_config_validation=true

          run_id=""
          for i in $(seq 1 60); do
            run_id="$(gh run list --workflow staging-go-live-readiness.yml --json databaseId,event,createdAt -q ".[] | select(.event==\"workflow_dispatch\" and .createdAt >= \"${dispatch_started_at}\") | .databaseId" | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Unable to resolve staging-go-live-readiness run ID after dispatch."
            exit 1
          fi

          for i in $(seq 1 240); do
            run_payload="$(gh run view "$run_id" --json status,conclusion,headSha 2>/dev/null || true)"
            if [ -z "${run_payload}" ]; then
              sleep 5
              continue
            fi

            run_status="$(echo "$run_payload" | jq -r '.status')"
            run_conclusion="$(echo "$run_payload" | jq -r '.conclusion // ""')"
            run_head_sha="$(echo "$run_payload" | jq -r '.headSha // ""')"
            if [ "$run_status" = "completed" ]; then
              if [ "$run_head_sha" != "${{ steps.resolve_ref.outputs.sha }}" ]; then
                echo "Staging readiness workflow run ${run_id} headSha=${run_head_sha} does not match deploy sha=${{ steps.resolve_ref.outputs.sha }}."
                exit 1
              fi
              if [ "$run_conclusion" = "success" ]; then
                echo "Staging readiness workflow run ${run_id} succeeded."
                exit 0
              fi
              echo "Staging readiness workflow run ${run_id} completed with conclusion=${run_conclusion}."
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for staging-go-live-readiness run ${run_id}."
          exit 1

      - name: New Relic observability gate (staging)
        shell: bash
        env:
          ENV_NAME: staging
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || \
             [ -z "${NEW_RELIC_STAGING_AWS_ACCOUNT_ID:-}" ] || \
             [ -z "${NEW_RELIC_STAGING_AWS_ROLE_ARN:-}" ] || \
             [ -z "${NEW_RELIC_PROD_AWS_ROLE_ARN:-}" ]; then
            echo "Skipping staging New Relic gate: prerequisites are incomplete."
            exit 0
          fi
          set +e
          node ops/newrelic/bootstrap-dashboards.mjs
          dashboards_ec=$?
          node ops/newrelic/sync-alerts.mjs
          alerts_ec=$?
          node ops/newrelic/sync-cloud-links.mjs
          cloud_links_ec=$?
          NEW_RELIC_TARGET_ENV=staging \
          REQUIRE_ACCOUNT_PINNING=1 \
          REQUIRE_LOGS=1 \
          REQUIRE_SPANS=1 \
          node ops/newrelic/verify-signals.mjs
          verify_ec=$?
          set -e

          if [ "$dashboards_ec" != "0" ] || [ "$alerts_ec" != "0" ] || [ "$cloud_links_ec" != "0" ] || [ "$verify_ec" != "0" ]; then
            echo "New Relic gate failed (dashboards=${dashboards_ec}, alerts=${alerts_ec}, cloud_links=${cloud_links_ec}, verify=${verify_ec})."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi
      - name: Alarm rollback gate (staging)
        shell: bash
        env:
          ENV_NAME: staging
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alarms="$(aws cloudwatch describe-alarms \
            --alarm-names \
              "remit-scout-${ENV_NAME}-api-error-rate-high" \
              "remit-scout-${ENV_NAME}-api-p99-latency-high" \
            --query 'MetricAlarms[?StateValue==`ALARM`].AlarmName' \
            --output text)"
          if [ -n "${alarms:-}" ] && [ "${alarms}" != "None" ]; then
            echo "Critical alarm gate failed: ${alarms}"
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Record Last-known-good Image (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --type "String" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: staging
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: staging
          STATUS: ${{ job.status }}
          COMMIT_SHA_IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: | 
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "Skipping Slack notification: SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi
          COMMIT_SHA="${COMMIT_SHA_IMAGE_TAG:-${RESOLVE_REF_SHA:-${DEFAULT_SHA:-unknown}}}"
          if [ -z "${COMMIT_SHA}" ] || [ "${COMMIT_SHA}" = "null" ]; then
            COMMIT_SHA="unknown"
          fi
          if [[ "${COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT_SHA="${COMMIT_SHA:0:7}"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null

  deploy-prod:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.'))
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # IMPORTANT: Production environment requires manual approval.
    # Configure in GitHub Settings -> Environments -> prod -> Required reviewers.
    environment: prod
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SENTRY_SECRET_ARN: ${{ vars.SENTRY_SECRET_ARN }}
      SENTRY_SECRET_JSON_KEY: ${{ vars.SENTRY_SECRET_JSON_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
      TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
      NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
      NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
      NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
      NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
      NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
      NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
      NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
      NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
      PROXY_RESIDENTIAL_SECRET_ARN: ${{ vars.PROXY_RESIDENTIAL_SECRET_ARN }}
      PROXY_RESIDENTIAL_SECRET_JSON_KEY: ${{ vars.PROXY_RESIDENTIAL_SECRET_JSON_KEY }}
      PROXY_RESIDENTIAL_SSM_NAME: ${{ vars.PROXY_RESIDENTIAL_SSM_NAME }}
      PROXY_RESIDENTIAL_URL: ${{ secrets.PROXY_RESIDENTIAL_URL || vars.PROXY_RESIDENTIAL_URL }}
      PROXY_DATACENTER_SECRET_ARN: ${{ vars.PROXY_DATACENTER_SECRET_ARN }}
      PROXY_DATACENTER_SECRET_JSON_KEY: ${{ vars.PROXY_DATACENTER_SECRET_JSON_KEY }}
      PROXY_DATACENTER_SSM_NAME: ${{ vars.PROXY_DATACENTER_SSM_NAME }}
      PROXY_DATACENTER_URL: ${{ secrets.PROXY_DATACENTER_URL || vars.PROXY_DATACENTER_URL }}
      CAPABILITY_PROBE_PROXY_TIER: ${{ vars.CAPABILITY_PROBE_PROXY_TIER || 'NONE' }}
      AGENT_LLM_CONNECTOR: ${{ vars.AGENT_LLM_CONNECTOR }}
      AGENT_LLM_MODEL: ${{ vars.AGENT_LLM_MODEL }}
      AGENT_LLM_PROMPT_VERSION: ${{ vars.AGENT_LLM_PROMPT_VERSION }}
      AGENT_ANTHROPIC_API_KEY_SECRET_ARN: ${{ vars.AGENT_ANTHROPIC_API_KEY_SECRET_ARN }}
      SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
      SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
      SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
      WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
      ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
      PLANE_A_ADMIN_EMAILS: ${{ vars.PLANE_A_ADMIN_EMAILS }}
      PLANE_A_REQUIRE_API_KEY: ${{ vars.PLANE_A_REQUIRE_API_KEY }}
      PRIVACY_HASH_SALT: ${{ secrets.PRIVACY_HASH_SALT }}
      PRIVACY_SESSION_SALT: ${{ secrets.PRIVACY_SESSION_SALT }}
      PLANE_A_CORS_ORIGINS: ${{ vars.PLANE_A_CORS_ORIGINS }}
      PLANE_A_CORS_ALLOWED_HEADERS: ${{ vars.PLANE_A_CORS_ALLOWED_HEADERS }}
      PLANE_A_CORS_ALLOWED_METHODS: ${{ vars.PLANE_A_CORS_ALLOWED_METHODS }}
      PLANE_A_CORS_ALLOW_CREDENTIALS: ${{ vars.PLANE_A_CORS_ALLOW_CREDENTIALS }}
      COMPLIANCE_SOC2_TYPE_II_STATUS: ${{ vars.COMPLIANCE_SOC2_TYPE_II_STATUS }}
      COMPLIANCE_SOC2_TYPE_II_REPORT_STATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_STATE }}
      COMPLIANCE_SOC2_TYPE_II_REPORT_DATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_DATE }}
      COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON: ${{ vars.COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON }}
      COMPLIANCE_SOC2_TYPE_II_REPORT_URL: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_URL }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PUBLIC_GTM_CONTAINER_ID: ${{ vars.PUBLIC_GTM_CONTAINER_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.PUBLIC_LINKEDIN_PARTNER_ID }}
      PUBLIC_REDDIT_PIXEL_ID: ${{ vars.PUBLIC_REDDIT_PIXEL_ID }}
      PUBLIC_X_PIXEL_ID: ${{ vars.PUBLIC_X_PIXEL_ID }}
      PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.PUBLIC_TIKTOK_PIXEL_ID }}
      PUBLIC_CONTENTSQUARE_TAG_SRC: ${{ vars.PUBLIC_CONTENTSQUARE_TAG_SRC }}
      PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
      PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID }}
      PUBLIC_ENABLE_ADS: ${{ vars.PUBLIC_ENABLE_ADS }}
      PUBLIC_AD_COMPARE_INLINE_IDS: ${{ vars.PUBLIC_AD_COMPARE_INLINE_IDS }}
      PUBLIC_AD_COMPARE_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_COMPARE_SIDEBAR_IDS }}
      PUBLIC_AD_HOME_INLINE_IDS: ${{ vars.PUBLIC_AD_HOME_INLINE_IDS }}
      PUBLIC_AD_DASHBOARD_INLINE_IDS: ${{ vars.PUBLIC_AD_DASHBOARD_INLINE_IDS }}
      PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_INTERSTITIAL_IDS }}
      PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_BELOW_FAQ_IDS }}
      PUBLIC_AD_CORRIDOR_FOOTER_IDS: ${{ vars.PUBLIC_AD_CORRIDOR_FOOTER_IDS }}
      PUBLIC_AD_BLOG_SIDEBAR_IDS: ${{ vars.PUBLIC_AD_BLOG_SIDEBAR_IDS }}
      PUBLIC_AD_BLOG_INLINE_IDS: ${{ vars.PUBLIC_AD_BLOG_INLINE_IDS }}
      PUBLIC_AD_BLOG_BANNER_IDS: ${{ vars.PUBLIC_AD_BLOG_BANNER_IDS }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || vars.PROD_COST_BUDGET_AMOUNT_USD || '500' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || vars.PROD_COST_ANOMALY_THRESHOLD_USD || '100' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || vars.PROD_COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - name: Resolve deployment ref (prod)
        id: resolve_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ github.event_name == 'push' && github.ref || (inputs.ref != '' && inputs.ref || github.sha) }}
        run: |
          set -euo pipefail
          requested="$(echo "${REQUESTED_REF}" | xargs)"
          if [ -z "${requested}" ]; then
            echo "::error::Empty deploy ref; unable to continue."
            exit 1
          fi

          resolved=""
          candidate="${requested}"
          for _ in 1 2 3; do
            encoded="$(printf '%s' "${candidate}" | jq -sRr @uri)"
            resolved="$(gh api "repos/${REPO}/commits/${encoded}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "${resolved}" ]; then
              break
            fi
            if [[ "${candidate}" == refs/heads/* ]]; then
              candidate="${candidate#refs/heads/}"
              continue
            fi
            if [[ "${candidate}" == refs/tags/* ]]; then
              candidate="${candidate#refs/tags/}"
              continue
            fi
            break
          done

          if [ -z "${resolved}" ]; then
            echo "::error::Unable to resolve deploy ref '${requested}' to a commit SHA."
            echo "::error::Provide a valid branch name, tag, short SHA, or full SHA."
            exit 1
          fi

          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "requested_ref=${requested}" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy ref '${requested}' -> ${resolved}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.sha }}

      - name: Validate production tag format
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tag must be strict semver (vMAJOR.MINOR.PATCH). Got: ${tag}"
            exit 1
          fi

      - name: Verify ci/main gate for production SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          run_id="$(gh run list --repo "$REPO" --workflow ci-main.yml --json databaseId,headSha,conclusion -q ".[] | select(.headSha==\"${deploy_sha}\" and .conclusion==\"success\") | .databaseId" | head -n1)"
          if [ -z "$run_id" ]; then
            echo "No successful ci/main run found for commit ${deploy_sha}."
            echo "Block prod deploy until ci/main succeeds on this exact commit."
            exit 1
          fi
          echo "Found successful ci/main run: ${run_id}"

      - name: Verify staging readiness gate for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_sha="${{ steps.resolve_ref.outputs.sha }}"
          run_id="$(gh run list --workflow staging-go-live-readiness.yml --json databaseId,headSha,conclusion -q ".[] | select(.headSha==\"${deploy_sha}\" and .conclusion==\"success\") | .databaseId" | head -n1)"
          if [ -z "$run_id" ]; then
            echo "No successful staging-go-live-readiness run found for commit ${deploy_sha}."
            echo "Block prod deploy until staging readiness gate passes on this exact commit."
            exit 1
          fi
          echo "Found successful staging readiness run: ${run_id}"

      - name: SOC 2 Type II enterprise launch gate
        shell: bash
        env:
          PLANE_A_REQUIRE_API_KEY: ${{ vars.PLANE_A_REQUIRE_API_KEY }}
          COMPLIANCE_SOC2_TYPE_II_STATUS: ${{ vars.COMPLIANCE_SOC2_TYPE_II_STATUS }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_STATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_STATE }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_DATE: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_DATE }}
          COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON: ${{ vars.COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON }}
          COMPLIANCE_SOC2_TYPE_II_REPORT_URL: ${{ vars.COMPLIANCE_SOC2_TYPE_II_REPORT_URL }}
        run: |
          set -euo pipefail

          if [ "${PLANE_A_REQUIRE_API_KEY:-0}" != "1" ]; then
            echo "SOC 2 launch gate skipped: PLANE_A_REQUIRE_API_KEY is not set to 1."
            exit 0
          fi

          report_state="${COMPLIANCE_SOC2_TYPE_II_REPORT_STATE:-${COMPLIANCE_SOC2_TYPE_II_STATUS:-}}"
          if [ -z "$report_state" ]; then
            echo "SOC 2 launch gate failed: COMPLIANCE_SOC2_TYPE_II_REPORT_STATE must be set for enterprise mode."
            exit 1
          fi

          if [ "$report_state" != "audited" ]; then
            echo "SOC 2 launch gate failed: report_state must be audited for enterprise production promotion (received \"$report_state\")."
            echo "Set COMPLIANCE_SOC2_TYPE_II_REPORT_STATE=audited and provide a valid report date/window."
            exit 1
          fi

          if [ -z "${COMPLIANCE_SOC2_TYPE_II_REPORT_DATE:-}" ]; then
            echo "SOC 2 launch gate failed: COMPLIANCE_SOC2_TYPE_II_REPORT_DATE is required when report_state is audited."
            exit 1
          fi
          if ! date -d "${COMPLIANCE_SOC2_TYPE_II_REPORT_DATE}" +%s >/dev/null 2>&1; then
            echo "SOC 2 launch gate failed: COMPLIANCE_SOC2_TYPE_II_REPORT_DATE is not a valid date."
            exit 1
          fi

          if [ -z "${COMPLIANCE_SOC2_TYPE_II_REPORT_URL:-}" ]; then
            echo "SOC 2 launch gate failed: COMPLIANCE_SOC2_TYPE_II_REPORT_URL is required when report_state is audited."
            exit 1
          fi

          if [ -n "${COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON:-}" ]; then
            if ! date -d "${COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON}" +%s >/dev/null 2>&1; then
              echo "SOC 2 launch gate failed: COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON is not a valid date."
              exit 1
            fi
            if [ "$(date -d "${COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON}" +%s)" -le "$(date +%s)" ]; then
              echo "SOC 2 launch gate failed: COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON must be in the future."
              exit 1
            fi
          else
            echo "SOC 2 launch gate warning: COMPLIANCE_SOC2_TYPE_II_EXPIRES_ON is empty."
          fi

          echo "SOC 2 Type II production launch gate passed (report_state=audited)."

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: prod
          AUDIT_BLOCKING: '1'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_exit=0
          pnpm -w audit --audit-level=high --json > ".security/${SECURITY_ENV}-pnpm-audit.json" || audit_exit=$?
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit)."
            if [ "${AUDIT_BLOCKING}" = "1" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking mode: continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-prod-security-evidence
          path: .security
          retention-days: 180
          if-no-files-found: ignore

      - name: Full Test Suite (prod gate)
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C backend lint
          pnpm -C backend test

      - name: Configure AWS credentials (primary role)
        id: aws_creds_primary
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
          retry-max-attempts: 3

      - name: Configure AWS credentials (fallback role)
        id: aws_creds_fallback
        if: steps.aws_creds_primary.outcome != 'success' && vars.AWS_ROLE_TO_ASSUME_FALLBACK != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
          retry-max-attempts: 2

      - name: Validate AWS credential bootstrap
        if: steps.aws_creds_primary.outcome != 'success' && steps.aws_creds_fallback.outcome != 'success'
        shell: bash
        env:
          AWS_ROLE_PRIMARY: ${{ vars.AWS_ROLE_TO_ASSUME }}
          AWS_ROLE_FALLBACK: ${{ vars.AWS_ROLE_TO_ASSUME_FALLBACK }}
        run: |
          set -euo pipefail
          echo "::error::Failed to assume AWS role via OIDC using both primary and fallback roles."
          echo "::error::Primary role: ${AWS_ROLE_PRIMARY}"
          echo "::error::Fallback role: ${AWS_ROLE_FALLBACK:-<not configured>}"
          echo "::error::Remediation: update IAM trust policy for GitHub OIDC (aud=sts.amazonaws.com) and this repo/environment."
          exit 1

      - name: Validate Required GitHub Environment Vars (prod)
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_SUPABASE_URL:-}" ] || [ -z "${PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY (configure in GitHub environment: prod)."
            exit 1
          fi
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: prod)."
            exit 1
          fi
          if [ -z "${PRIVACY_HASH_SALT:-}" ] || [ -z "${PRIVACY_SESSION_SALT:-}" ]; then
            echo "Missing PRIVACY_HASH_SALT / PRIVACY_SESSION_SALT (configure in GitHub environment secrets: prod)."
            exit 1
          fi
          if [ -z "${SES_IDENTITY_ARNS:-}" ] || [ -z "${SNS_TOPIC_ARNS:-}" ]; then
            echo "Missing SES_IDENTITY_ARNS / SNS_TOPIC_ARNS (configure in GitHub environment vars: prod)."
            exit 1
          fi
          if [ -z "${SENTRY_SECRET_ARN:-}" ] || [ -z "${SENTRY_SECRET_JSON_KEY:-}" ]; then
            echo "Missing SENTRY_SECRET_ARN / SENTRY_SECRET_JSON_KEY (configure in GitHub environment vars: prod)."
            exit 1
          fi
          if [[ "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" == *"nr-data.net"* ]] && \
            [ -z "${OTEL_EXPORTER_OTLP_HEADERS:-}" ] && \
            [ -z "${NEW_RELIC_INGEST_KEY:-}" ]; then
            echo "Missing OTEL_EXPORTER_OTLP_HEADERS or NEW_RELIC_INGEST_KEY for New Relic OTLP endpoint."
            exit 1
          fi
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || [ -z "${NEW_RELIC_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_REGION:-}" ]; then
            echo "Missing NEW_RELIC_USER_API_KEY / NEW_RELIC_ACCOUNT_ID / NEW_RELIC_REGION for hard New Relic gate."
            exit 1
          fi
          if [ -z "${NEW_RELIC_PROD_AWS_ACCOUNT_ID:-}" ]; then
            echo "Missing NEW_RELIC_PROD_AWS_ACCOUNT_ID for account-pinned verify-signals."
            exit 1
          fi
          if [ -z "${NEW_RELIC_STAGING_AWS_ROLE_ARN:-}" ] || [ -z "${NEW_RELIC_PROD_AWS_ROLE_ARN:-}" ]; then
            echo "Missing NEW_RELIC_STAGING_AWS_ROLE_ARN / NEW_RELIC_PROD_AWS_ROLE_ARN for cloud-link sync."
            exit 1
          fi
          if [ "${NEW_RELIC_LOGS_ENABLED:-1}" = "0" ]; then
            echo "NEW_RELIC_LOGS_ENABLED must not be 0 in staging/prod deploys."
            exit 1
          fi

      - name: Observability prereq gate (prod)
        env:
          ENVIRONMENT: prod
          NODE_ENV: production
          STRICT_CONFIG: '1'
          SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
          TRACING_EXPORTER: ${{ vars.TRACING_EXPORTER || 'otlp' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT || vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS || secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: pnpm -C backend ci:observability

      - uses: docker/setup-buildx-action@v3

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: prod
          AWS_REGION: ${{ vars.AWS_REGION }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Capture Previous Good Image Tag (prod)
        id: prev_good
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter --name \"/remit-scout/${ENV_NAME}/last-good-image\" --query 'Parameter.Value' --output text 2>/dev/null || true)"
          echo "TAG=${value}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          if ! aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "${ECR_REPO}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE \
              >/dev/null
          fi

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-prod:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-prod:${{ steps.vars.outputs.SEMVER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        continue-on-error: true
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-prod"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            aquasec/trivy:0.50.1 \
            image --no-progress --severity HIGH,CRITICAL --exit-code 0 "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        continue-on-error: true
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 15); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/15)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "::warning::ECR scan found $CRITICAL CRITICAL vulnerabilities."
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: prod
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp="https://github.com/rilical/Remit-Scout-V2/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      - name: CDK Diff (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c minimalInfra=false \
            -c providerProbeMode=per_provider \
            -c planeBDisableTier1=false \
            -c planeBB2cRefreshServiceEnabled=true \
            -c planeBFxRateRefreshServiceEnabled=true \
            -c planeBIngestFanoutMode=queue \
            -c quoteRefreshQueueMode=queue \
            -c fxRateRefreshQueueMode=queue \
            -c planeBIngestDesiredCount=1 \
            -c planeBB2cRefreshDesiredCount=1 \
            -c planeBFxRateRefreshDesiredCount=1 \
            -c planeBIngestFanoutTier1DesiredCount=1 \
            -c planeBIngestFanoutTier2DesiredCount=1 \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-500}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-100}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}"

      - name: Recover CloudFormation rollback state (prod)
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          ENV_NAME: prod
        run: |
          set -euo pipefail
          if [ -z "${STACK_NAME:-}" ]; then
            echo "STACK_NAME is not set; cannot check rollback state."
            exit 1
          fi

          if ! aws cloudformation describe-stacks --stack-name "${STACK_NAME}" >/dev/null 2>&1; then
            echo "Stack ${STACK_NAME} not found yet; continuing."
            exit 0
          fi

          status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
          echo "Current stack status: ${status}"
          if [ "${status}" = "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Detected UPDATE_ROLLBACK_FAILED. Attempting continue-update-rollback."
            aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}" >/dev/null
          fi

          max_attempts=90
          poll_seconds=10
          for i in $(seq 1 "${max_attempts}"); do
            status="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|IMPORT_COMPLETE)
                echo "Stack is stable and deployable: ${status}"
                exit 0
                ;;
              *_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Waiting for stable stack state: ${status} (attempt ${i}/${max_attempts})"
                # Every 60s, check if ECS services are stuck in failed deployment
                if [ $((i % 6)) -eq 0 ] && [ "$i" -gt 6 ]; then
                  failing=$(aws ecs list-services --cluster "remit-scout-${ENV_NAME}" --output json 2>/dev/null \
                    | jq -r '.serviceArns[]' 2>/dev/null \
                    | xargs -r -I{} aws ecs describe-services --cluster "remit-scout-${ENV_NAME}" --services {} --output json 2>/dev/null \
                    | jq '[.services[] | select((.deployments[]? | select(.status=="PRIMARY") | .rolloutState) == "IN_PROGRESS")] | length' 2>/dev/null \
                    || echo "0")
                  if [ "${failing:-0}" -gt 3 ]; then
                    echo "::error::${failing} ECS services stuck in failed deployment. Likely infrastructure dependency issue."
                    echo "::error::Check Aurora status, secrets, and Redis before retrying."
                    exit 1
                  fi
                fi
                sleep "${poll_seconds}"
                ;;
              *)
                echo "::error::Stack is not deployable after recovery: ${status}"
                exit 1
                ;;
            esac
          done

          timeout_seconds=$((max_attempts * poll_seconds))
          echo "::error::Timed out waiting for stack to reach a deployable state after ${timeout_seconds}s."
          exit 1

      - name: Pre-deploy infrastructure health check (prod)
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -uo pipefail
          cluster_id=$(aws rds describe-db-clusters \
            --query "DBClusters[?contains(DBClusterIdentifier, '${ENV_NAME}')].DBClusterIdentifier" \
            --output text 2>&1) || {
            echo "::warning::Cannot check Aurora status (missing rds:DescribeDBClusters permission). Continuing deploy."
            exit 0
          }
          cluster_id="$(echo "$cluster_id" | head -1)"
          if [ -z "$cluster_id" ]; then
            echo "No Aurora cluster found for ${ENV_NAME}; skipping health check."
            exit 0
          fi
          status=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$cluster_id" \
            --query 'DBClusters[0].Status' --output text)
          if [ "$status" = "stopped" ]; then
            echo "::warning::Aurora cluster $cluster_id is stopped. Starting..."
            aws rds start-db-cluster --db-cluster-identifier "$cluster_id" || {
              echo "::warning::Cannot start Aurora (missing rds:StartDBCluster permission). Continuing deploy."
              exit 0
            }
            aws rds wait db-cluster-available --db-cluster-identifier "$cluster_id"
            echo "Aurora is now available."
          elif [ "$status" != "available" ]; then
            echo "::error::Aurora cluster is in state: $status"
            exit 1
          fi
          echo "Aurora health check passed: $status"

      - name: Refresh AWS credentials before CDK deploy (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
          retry-max-attempts: 3

      - name: CDK Deploy (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c minimalInfra=false \
            -c providerProbeMode=per_provider \
            -c planeBDisableTier1=false \
            -c planeBB2cRefreshServiceEnabled=true \
            -c planeBFxRateRefreshServiceEnabled=true \
            -c planeBIngestFanoutMode=queue \
            -c quoteRefreshQueueMode=queue \
            -c fxRateRefreshQueueMode=queue \
            -c planeBIngestDesiredCount=1 \
            -c planeBB2cRefreshDesiredCount=1 \
            -c planeBFxRateRefreshDesiredCount=1 \
            -c planeBIngestFanoutTier1DesiredCount=1 \
            -c planeBIngestFanoutTier2DesiredCount=1 \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-500}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-100}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            --require-approval broadening

      - name: Deploy Frontend (prod)
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          bucket="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')"
          dist_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue')"
          dist_domain="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendDistributionDomain") | .OutputValue')"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          export NODE_ENV=production
          export CLOUDFRONT_DISTRIBUTION_ID="$dist_id"
          export FRONTEND_DISTRIBUTION_DOMAIN="${dist_domain:-}"
          export PLANE_A_CLOUDFRONT_DOMAIN="${plane_a_cf:-}"
          export PLANE_A_API_ENDPOINT="${plane_a_api:-}"
          export PUBLIC_API_BASE="${api_base}/api/v1"
          export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL}"
          export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY}"

          pnpm -C frontend build
          pnpm -C frontend generate

          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            pnpm -C frontend sentry:sourcemaps || echo "::warning::Sentry sourcemap upload failed (non-fatal)"
          else
            echo "⚠️ SENTRY_AUTH_TOKEN not set — skipping sourcemap upload"
          fi

          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "public, max-age=31536000, immutable" --exclude "*.html" --exclude "*.json" --exclude "*.map"
          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "no-cache, no-store, must-revalidate" --exclude "*" --include "*.html" --include "*.json"
          aws cloudfront create-invalidation --distribution-id "$dist_id" --paths "/*" >/dev/null

      - name: Run Migrations (prod)
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Seed Launch Users (prod)
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          DATABASE_URL_PLANE_A: ${{ secrets.DATABASE_URL_PLANE_A }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAUNCH_PASSWORD_OMAR: ${{ secrets.LAUNCH_PASSWORD_OMAR }}
          LAUNCH_PASSWORD_DEVELOPER: ${{ secrets.LAUNCH_PASSWORD_DEVELOPER }}
          LAUNCH_PASSWORD_AUSTRILIC: ${{ secrets.LAUNCH_PASSWORD_AUSTRILIC }}
          LAUNCH_PASSWORD_GHABAYENEDU: ${{ secrets.LAUNCH_PASSWORD_GHABAYENEDU }}
          LAUNCH_PASSWORD_SUPPORT: ${{ secrets.LAUNCH_PASSWORD_SUPPORT }}
          DEFAULT_LAUNCH_PASSWORD: ${{ secrets.DEFAULT_LAUNCH_PASSWORD }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"
          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '"%s",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          # Build environment overrides JSON
          env_overrides='['
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LAUNCH_PASSWORD_OMAR LAUNCH_PASSWORD_DEVELOPER LAUNCH_PASSWORD_AUSTRILIC LAUNCH_PASSWORD_GHABAYENEDU LAUNCH_PASSWORD_SUPPORT DEFAULT_LAUNCH_PASSWORD; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              env_overrides+='{"name":"'"$var"'","value":"'"$val"'"},'
            fi
          done
          if [ -n "${DATABASE_URL_PLANE_A:-}" ]; then
            env_overrides+='{"name":"DATABASE_URL","value":"'"$DATABASE_URL_PLANE_A"'"},'
            env_overrides+='{"name":"DATABASE_URL_PLANE_A","value":"'"$DATABASE_URL_PLANE_A"'"},'
          fi
          env_overrides+='{"name":"NODE_OPTIONS","value":"--dns-result-order=ipv4first"},'
          env_overrides="${env_overrides%,}]"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"DbMigrateContainer\",\"command\":[\"node\",\"backend/dist/scripts/seed-launch-users.js\",\"--force\"],\"environment\":${env_overrides}}]}" \
            --query "tasks[0].taskArn" --output text)"

          echo "Seed task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --output json)"
          exit_code="$(echo "$task_json" | jq -r '.tasks[0].containers[0].exitCode // "null"')"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Seed task failed (exitCode=$exit_code)."
            stopped_reason="$(echo "$task_json" | jq -r '.tasks[0].stoppedReason // ""')"
            container_reason="$(echo "$task_json" | jq -r '.tasks[0].containers[0].reason // ""')"
            log_group="$(aws ecs describe-task-definition --task-definition "$task_def" --query 'taskDefinition.containerDefinitions[?name==`DbMigrateContainer`].logConfiguration.options."awslogs-group"' --output text 2>/dev/null || true)"
            log_stream="$(echo "$task_json" | jq -r '.tasks[0].containers[0].logStreamName // ""')"
            if [ -z "$log_stream" ] || [ "$log_stream" = "null" ]; then
              task_id="${task_arn##*/}"
              log_stream="db-migrate/DbMigrateContainer/${task_id}"
            fi
            if [ -n "$stopped_reason" ] && [ "$stopped_reason" != "null" ]; then
              echo "::error::ECS stoppedReason: $stopped_reason"
            fi
            if [ -n "$container_reason" ] && [ "$container_reason" != "null" ]; then
              echo "::error::Container reason: $container_reason"
            fi
            if [ -n "$log_group" ] && [ "$log_group" != "None" ] && [ -n "$log_stream" ] && [ "$log_stream" != "null" ]; then
              echo "Dumping seed task logs from ${log_group}:${log_stream}"
              aws logs get-log-events \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --limit 200 \
                --query 'events[].message' \
                --output text || true
            fi
            exit 1
          else
            echo "Seed completed successfully."
          fi

      - name: Wait For ECS Stability (prod)
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ]; then
            aws ecs wait services-stable --cluster "$cluster" --services $services
          fi

      - name: Post-deploy Smoke (prod) + Auto Rollback On Failure
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          set +e
          SMOKE_ALLOW_PROTECTED_METRICS=1 SMOKE_ALLOW_PROTECTED_HEALTH=1 API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: New Relic observability gate (prod)
        shell: bash
        env:
          ENV_NAME: prod
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          set +e
          node ops/newrelic/bootstrap-dashboards.mjs
          dashboards_ec=$?
          node ops/newrelic/sync-alerts.mjs
          alerts_ec=$?
          node ops/newrelic/sync-cloud-links.mjs
          cloud_links_ec=$?
          NEW_RELIC_TARGET_ENV=prod \
          REQUIRE_ACCOUNT_PINNING=1 \
          REQUIRE_LOGS=1 \
          REQUIRE_SPANS=1 \
          node ops/newrelic/verify-signals.mjs
          verify_ec=$?
          set -e

          if [ "$dashboards_ec" != "0" ] || [ "$alerts_ec" != "0" ] || [ "$cloud_links_ec" != "0" ] || [ "$verify_ec" != "0" ]; then
            echo "New Relic gate failed (dashboards=${dashboards_ec}, alerts=${alerts_ec}, cloud_links=${cloud_links_ec}, verify=${verify_ec})."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Alarm rollback gate (prod)
        shell: bash
        env:
          ENV_NAME: prod
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alarms="$(aws cloudwatch describe-alarms \
            --alarm-names \
              "remit-scout-${ENV_NAME}-api-error-rate-high" \
              "remit-scout-${ENV_NAME}-api-p99-latency-high" \
            --query 'MetricAlarms[?StateValue==`ALARM`].AlarmName' \
            --output text)"
          if [ -n "${alarms:-}" ] && [ "${alarms}" != "None" ]; then
            echo "Critical alarm gate failed: ${alarms}"
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Record Last-known-good Image (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --type "String" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: prod
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: prod
          STATUS: ${{ job.status }}
          COMMIT_SHA_IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "Skipping Slack notification: SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi
          COMMIT_SHA="${COMMIT_SHA_IMAGE_TAG:-${RESOLVE_REF_SHA:-${DEFAULT_SHA:-unknown}}}"
          if [ -z "${COMMIT_SHA}" ] || [ "${COMMIT_SHA}" = "null" ]; then
            COMMIT_SHA="unknown"
          fi
          if [[ "${COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT_SHA="${COMMIT_SHA:0:7}"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null
