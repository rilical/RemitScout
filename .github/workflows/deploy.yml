        run: |
          set -euo pipefail
          api_base="$(echo "${PUBLIC_API_BASE:-}" | sed -E 's:/api/v1/?$::; s:/api/?$::')"
          if [ -z "${api_base:-}" ] || [ "${api_base:-}" = "https://" ]; then
