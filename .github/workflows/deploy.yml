      - name: Seed Launch Users (prod)
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LAUNCH_PASSWORD_OMAR: ${{ secrets.LAUNCH_PASSWORD_OMAR }}
          LAUNCH_PASSWORD_DEVELOPER: ${{ secrets.LAUNCH_PASSWORD_DEVELOPER }}
          LAUNCH_PASSWORD_AUSTRILIC: ${{ secrets.LAUNCH_PASSWORD_AUSTRILIC }}
          LAUNCH_PASSWORD_GHABAYENEDU: ${{ secrets.LAUNCH_PASSWORD_GHABAYENEDU }}
          LAUNCH_PASSWORD_SUPPORT: ${{ secrets.LAUNCH_PASSWORD_SUPPORT }}
          DEFAULT_LAUNCH_PASSWORD: ${{ secrets.DEFAULT_LAUNCH_PASSWORD }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"
          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '"%s",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          # Build environment overrides JSON without exposing shell interpolation bugs.
          env_rows=()
          for var in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY LAUNCH_PASSWORD_OMAR LAUNCH_PASSWORD_DEVELOPER LAUNCH_PASSWORD_AUSTRILIC LAUNCH_PASSWORD_GHABAYENEDU LAUNCH_PASSWORD_SUPPORT DEFAULT_LAUNCH_PASSWORD; do
            val="${!var:-}"
            if [ -n "$val" ]; then
              env_rows+=("$(jq -cn --arg name "$var" --arg value "$val" '{name:$name,value:$value}')")
            fi
          done
          if [ "${#env_rows[@]}" -gt 0 ]; then
            env_overrides="$(printf '%s\n' "${env_rows[@]}" | jq -cs '.')"
          else
            env_overrides='[]'
          fi
          seed_cmd="$(cat <<'EOF'
          set -euo pipefail
          if [ -z "${DATABASE_URL_PLANE_A:-}" ]; then
            if [ -z "${PLANE_A_DB_USERNAME:-}" ] || [ -z "${PLANE_A_DB_PASSWORD:-}" ] || [ -z "${PLANE_A_DB_HOST:-}" ] || [ -z "${PLANE_A_DB_NAME:-}" ]; then
              echo "Missing Plane A database configuration for launch-user seeding" >&2
              exit 1
            fi
            DATABASE_URL_PLANE_A="postgres://${PLANE_A_DB_USERNAME}:${PLANE_A_DB_PASSWORD}@${PLANE_A_DB_HOST}:${PLANE_A_DB_PORT:-5432}/${PLANE_A_DB_NAME}?sslmode=require"
            export DATABASE_URL_PLANE_A
          fi
          node backend/dist/scripts/seed-launch-users.js --force
          EOF
          )"
          overrides="$(jq -cn --arg cmd "$seed_cmd" --argjson env "$env_overrides" '{containerOverrides:[{name:"DbMigrateContainer",command:["sh","-lc",$cmd],environment:$env}]}' )"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --overrides "$overrides" \
            --query "tasks[0].taskArn" --output text)"

          echo "Seed task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          task_json="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --output json)"
          exit_code="$(echo "$task_json" | jq -r '.tasks[0].containers[0].exitCode // "null"')"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Seed task failed (exitCode=$exit_code)."
            stopped_reason="$(echo "$task_json" | jq -r '.tasks[0].stoppedReason // ""')"
            container_reason="$(echo "$task_json" | jq -r '.tasks[0].containers[0].reason // ""')"
            log_group="$(aws ecs describe-task-definition --task-definition "$task_def" --query 'taskDefinition.containerDefinitions[?name==`DbMigrateContainer`].logConfiguration.options."awslogs-group"' --output text 2>/dev/null || true)"
            log_stream="$(echo "$task_json" | jq -r '.tasks[0].containers[0].logStreamName // ""')"
            if [ -z "$log_stream" ] || [ "$log_stream" = "null" ]; then
              task_id="${task_arn##*/}"
              log_stream="db-migrate/DbMigrateContainer/${task_id}"
            fi
            if [ -n "$stopped_reason" ] && [ "$stopped_reason" != "null" ]; then
              echo "::error::ECS stoppedReason: $stopped_reason"
            fi
            if [ -n "$container_reason" ] && [ "$container_reason" != "null" ]; then
              echo "::error::Container reason: $container_reason"
            fi
            if [ -n "$log_group" ] && [ "$log_group" != "None" ] && [ -n "$log_stream" ] && [ "$log_stream" != "null" ]; then
              echo "Dumping seed task logs from ${log_group}:${log_stream}"
              aws logs get-log-events \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --limit 200 \
                --query 'events[].message' \
                --output text || true
            fi
            exit 1
          else
            echo "Seed completed successfully."
          fi

      - name: Wait For ECS Stability (prod)
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ] && [ "$services" != "None" ]; then
            read -r -a service_arns <<< "$services"
            for ((i=0; i<${#service_arns[@]}; i+=10)); do
              batch=("${service_arns[@]:i:10}")
              aws ecs wait services-stable --cluster "$cluster" --services "${batch[@]}"
            done
          fi

      - name: Post-deploy Smoke (prod) + Auto Rollback On Failure
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          fetch_status() {
            local url="$1"
            local output_path="$2"
            local status
            status="$(curl -sS -o "${output_path}" -w '%{http_code}' "${url}" || true)"
            if [ -z "${status}" ]; then
              status="000"
            fi
            printf '%s' "${status}"
          }

          wait_for_api_stabilization() {
            local attempt health_status ready_status metrics_status consecutive
            consecutive=0
            for attempt in $(seq 1 36); do
              health_status="$(fetch_status "${api_base}/healthz" /tmp/postdeploy-healthz.out)"
              ready_status="$(fetch_status "${api_base}/readyz" /tmp/postdeploy-readyz.out)"
              metrics_status="$(fetch_status "${api_base}/metrics" /tmp/postdeploy-metrics.out)"
              if [ "${health_status}" = "200" ] \
                && [ "${ready_status}" = "200" ] \
                && { [ "${metrics_status}" = "200" ] || [ "${metrics_status}" = "401" ] || [ "${metrics_status}" = "403" ]; }; then
                consecutive=$((consecutive + 1))
                echo "Public API stabilization sample ${attempt}/36 passed (${consecutive}/3 consecutive; health=${health_status}, ready=${ready_status}, metrics=${metrics_status})."
                if [ "${consecutive}" -ge 3 ]; then
                  echo "Public API stabilized after ${attempt} checks."
                  return 0
                fi
              else
                consecutive=0
                echo "Waiting for public API stabilization (attempt ${attempt}/36, health=${health_status}, ready=${ready_status}, metrics=${metrics_status})."
              fi
              sleep 5
            done
            echo "::error::Public API did not stabilize before post-deploy smoke."
            return 1
          }

          wait_for_api_stabilization

          set +e
          SMOKE_ALLOW_PROTECTED_METRICS=1 SMOKE_ALLOW_PROTECTED_HEALTH=1 API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: New Relic observability gate (prod)
        shell: bash
        env:
          ENV_NAME: prod
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_ALERT_EMAIL: ${{ vars.NEW_RELIC_ALERT_EMAIL || 'alerts@remit-scout.com' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
          NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
          NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
          NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
          NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || [ -z "${NEW_RELIC_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_REGION:-}" ]; then
            echo "Missing NEW_RELIC_USER_API_KEY / NEW_RELIC_ACCOUNT_ID / NEW_RELIC_REGION for hard New Relic gate."
            exit 1
          fi
          if [ -z "${NEW_RELIC_ALERT_EMAIL:-}" ]; then
            echo "Missing NEW_RELIC_ALERT_EMAIL for New Relic incident workflow/channel sync."
            exit 1
          fi
          if [ "${NEW_RELIC_PROD_AWS_MODE:-}" != "otlp_only" ] && [ -z "${NEW_RELIC_PROD_AWS_ACCOUNT_ID:-}" ]; then
            echo "Missing NEW_RELIC_PROD_AWS_ACCOUNT_ID for account-pinned verify-signals."
            exit 1
          fi
          if [ "${NEW_RELIC_PROD_AWS_MODE:-}" != "otlp_only" ] && [ -z "${NEW_RELIC_PROD_AWS_ROLE_ARN:-}" ]; then
            echo "Missing NEW_RELIC_PROD_AWS_ROLE_ARN for prod cloud-link sync."
            exit 1
          fi
          evidence_dir="$(mktemp -d)"
          trap 'rm -rf "${evidence_dir}"' EXIT
          set +e
          node ops/newrelic/bootstrap-dashboards.mjs | tee "${evidence_dir}/prod-newrelic-dashboards.log"
          dashboards_ec=$?
          node ops/newrelic/sync-alerts.mjs | tee "${evidence_dir}/prod-newrelic-alerts.log"
          alerts_ec=$?
          NEW_RELIC_REQUIRE_MIRROR_POLICIES=1 \
          NEW_RELIC_EVIDENCE_OUTPUT="${evidence_dir}/prod-newrelic-notifications-evidence.json" \
          node ops/newrelic/sync-notifications-workflows.mjs | tee "${evidence_dir}/prod-newrelic-notifications-sync.log"
          notifications_ec=$?
          jq -e '
            .verification.passed == true and
            .verification.mirrorPoliciesRequired == true and
            (.workflows.staging.matchedPolicyNames == ["Remit-Scout STAGING CloudWatch Mirror"]) and
            (.workflows.prod.matchedPolicyNames == ["Remit-Scout PROD CloudWatch Mirror"])
          ' "${evidence_dir}/prod-newrelic-notifications-evidence.json" >/dev/null
          notifications_proof_ec=$?
          node ops/newrelic/sync-cloud-links.mjs | tee "${evidence_dir}/prod-newrelic-cloud-links.log"
          cloud_links_ec=$?
          NEW_RELIC_TARGET_ENV=prod \
          REQUIRE_ACCOUNT_PINNING=1 \
          REQUIRE_LOGS=1 \
          REQUIRE_SPANS=1 \
          REQUIRE_API_GW_METRICS=0 \
          REQUIRE_SQS_METRICS=0 \
          node ops/newrelic/verify-signals.mjs | tee "${evidence_dir}/prod-newrelic-verify-signals.json"
          verify_ec=$?
          jq -e '
            (.results | length) == 1 and
            .results[0].envName == "prod" and
            .results[0].awsMode == "otlp_only" and
            (.results[0].failures | length) == 0 and
            (.results[0].checks.metricCount > 0) and
            (.results[0].checks.logCount > 0) and
            (.results[0].checks.spanCount > 0) and
            (.results[0].checks.customMetricCount > 0) and
            (.results[0].checks.customMetricFamilies.core_slo_indices > 0)
          ' "${evidence_dir}/prod-newrelic-verify-signals.json" >/dev/null
          verify_proof_ec=$?
          set -e

          if [ "$dashboards_ec" != "0" ] || [ "$alerts_ec" != "0" ] || [ "$notifications_ec" != "0" ] || [ "$notifications_proof_ec" != "0" ] || [ "$cloud_links_ec" != "0" ] || [ "$verify_ec" != "0" ] || [ "$verify_proof_ec" != "0" ]; then
            echo "New Relic gate failed (dashboards=${dashboards_ec}, alerts=${alerts_ec}, notifications=${notifications_ec}, notifications_proof=${notifications_proof_ec}, cloud_links=${cloud_links_ec}, verify=${verify_ec}, verify_proof=${verify_proof_ec})."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Alarm rollback gate (prod)
        shell: bash
        env:
          ENV_NAME: prod
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alarms="$(aws cloudwatch describe-alarms \
            --alarm-names \
              "remit-scout-${ENV_NAME}-api-error-rate-high" \
              "remit-scout-${ENV_NAME}-api-p99-latency-high" \
            --query 'MetricAlarms[?StateValue==`ALARM`].AlarmName' \
            --output text)"
          if [ -n "${alarms:-}" ] && [ "${alarms}" != "None" ]; then
            echo "Critical alarm gate failed: ${alarms}"
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Verify ECS task images (prod)
