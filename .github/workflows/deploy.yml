name: cd/deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
      ref:
        description: Git ref (sha/branch/tag). Leave empty to use default.
        required: false
        type: string
      skip_ci_gate:
        description: Emergency override — deploy even if CI is red.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  deploy:
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: ${{ inputs.env }}
    env:
      DEPLOY_ENV: ${{ inputs.env }}
    steps:
      - name: Resolve deploy ref
        id: resolve_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_REF: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        run: |
          set -euo pipefail
          requested="$(echo "${REQUESTED_REF}" | xargs)"
          if [ -z "${requested}" ]; then
            echo "::error::Empty deploy ref."
            exit 1
          fi
          resolved=""
          candidate="${requested}"
          for _ in 1 2 3; do
            encoded="$(printf '%s' "${candidate}" | jq -sRr @uri)"
            resolved="$(gh api "repos/${REPO}/commits/${encoded}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "${resolved}" ]; then break; fi
            candidate="${candidate#refs/heads/}"
            candidate="${candidate#refs/tags/}"
          done
          if [ -z "${resolved}" ]; then
            echo "::error::Unable to resolve deploy ref '${requested}'."
            exit 1
          fi
          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${requested} -> ${resolved}"

      - name: Check CI passed on deploy SHA
        if: inputs.skip_ci_gate != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ steps.resolve_ref.outputs.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${REPO}/commits/${DEPLOY_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci/main")] | first | .conclusion // "pending"' 2>/dev/null || echo "unknown")"
          if [ "${status}" != "success" ]; then
            echo "::error::CI status for ${DEPLOY_SHA} is '${status}', not 'success'."
            echo "::error::Use skip_ci_gate=true for emergency override."
            exit 1
          fi
          echo "CI passed on ${DEPLOY_SHA}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.sha }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: "20.19.6"
          pnpm_version: "10.19.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.resolve_ref.outputs.sha }}
        run: |
          set -euo pipefail
          docker build \
            --file backend/Dockerfile \
            --target runner \
            --tag "${ECR_REGISTRY}/remit-scout-backend:${IMAGE_TAG}" \
            --tag "${ECR_REGISTRY}/remit-scout-backend:latest" \
            .
          docker push "${ECR_REGISTRY}/remit-scout-backend:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/remit-scout-backend:latest"

      - name: Build frontend
        run: pnpm -C frontend build

      - name: Publish frontend to S3
        if: vars.FRONTEND_S3_BUCKET != ''
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync frontend/.output/public/ "s3://${{ vars.FRONTEND_S3_BUCKET }}/" \
            --delete --cache-control "public,max-age=31536000,immutable"
          if [ -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*"
          fi

      - name: CDK deploy
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.resolve_ref.outputs.sha }}
        run: |
          set -euo pipefail
          cd infrastructure/cdk
          npm ci
          timeout --preserve-status --kill-after=60s 1800 \
            npx cdk deploy --all --require-approval never \
              -c deployEnv="${DEPLOY_ENV}" \
              -c imageTag="${DEPLOY_SHA}" \
            || {
              echo "::error::CDK deploy failed or timed out."
              echo "--- Stack events ---"
              aws cloudformation describe-stack-events \
                --stack-name "RemitScout-${DEPLOY_ENV}" \
                --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`ROLLBACK_IN_PROGRESS`].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                --output table 2>/dev/null || true
              echo "--- ECS service diagnostics ---"
              for svc in $(aws ecs list-services --cluster "remit-scout-${DEPLOY_ENV}" --query 'serviceArns[]' --output text 2>/dev/null || true); do
                aws ecs describe-services --cluster "remit-scout-${DEPLOY_ENV}" --services "$svc" \
                  --query 'services[].{name:serviceName,status:status,running:runningCount,desired:desiredCount,events:events[:3]}' \
                  --output json 2>/dev/null || true
              done
              exit 1
            }

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          api_url="${{ vars.API_BASE_URL }}/api/v1/health"
          for i in 1 2 3; do
            echo "Health check attempt $i..."
            if curl -sf --max-time 10 "$api_url" > /dev/null 2>&1; then
              echo "API health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::API health check failed after 3 attempts."
          exit 1
