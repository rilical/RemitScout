name: cd/deploy

on:
  workflow_run:
    workflows: ['ci/main']
    types: [completed]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
      ref:
        description: Git ref (sha/branch/tag). Leave empty to use default.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dev:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.env == 'dev')
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || '50' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || '20' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.ref != '' && inputs.ref || github.sha) }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: dev
          AUDIT_BLOCKING: '0'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_exit=0
          pnpm -w audit --audit-level=high --json > ".security/${SECURITY_ENV}-pnpm-audit.json" || audit_exit=$?
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit)."
            if [ "${AUDIT_BLOCKING}" = "1" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking mode: continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev-security-evidence
          path: .security
          retention-days: 90
          if-no-files-found: ignore

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate Required Secrets (dev)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: dev)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:${{ steps.vars.outputs.SEMVER_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-dev"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.50.1 \
            image --no-progress --severity HIGH,CRITICAL --exit-code 1 "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 30); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/30)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "ECR scan found $CRITICAL CRITICAL vulnerabilities. Blocking deploy."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: dev
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify --keyless "${IMAGE_URI}"

      - name: CDK Diff (dev)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-50}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-20}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            -c devPaused=true \
            -c planeBIngestDesiredCount=0 \
            -c planeBB2cRefreshDesiredCount=0 \
            -c planeBIngestFanoutTier1DesiredCount=0 \
            -c planeBIngestFanoutTier2DesiredCount=0 \
            -c goldLiveDesiredCount=0 \
            -c planeBNotificationsDesiredCount=0 \
            -c planeBOpsAlertsDesiredCount=0 \
            -c planeBQueueWorkerDesiredCount=0 \
            -c planeBQueueWorkerMaxCount=0 \
            -c planeBDisableTier1=true \
            -c enableFrontend=false

      - name: CDK Deploy (dev, paused)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-50}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-20}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            -c devPaused=true \
            -c planeBIngestDesiredCount=0 \
            -c planeBB2cRefreshDesiredCount=0 \
            -c planeBIngestFanoutTier1DesiredCount=0 \
            -c planeBIngestFanoutTier2DesiredCount=0 \
            -c goldLiveDesiredCount=0 \
            -c planeBNotificationsDesiredCount=0 \
            -c planeBOpsAlertsDesiredCount=0 \
            -c planeBQueueWorkerDesiredCount=0 \
            -c planeBQueueWorkerMaxCount=0 \
            -c planeBDisableTier1=true \
            -c enableFrontend=false \
            --require-approval never

      - name: Run Migrations (dev)
        shell: bash
        env:
          ENV_NAME: dev
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"

          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=ENABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Wait For ECS Stability (dev)
        shell: bash
        env:
          ENV_NAME: dev
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ]; then
            aws ecs wait services-stable --cluster "$cluster" --services $services
          fi

      - name: Post-deploy Smoke (dev)
        shell: bash
        env:
          ENV_NAME: dev
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi
          API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke

      - name: Record Last-known-good Image (dev)
        shell: bash
        env:
          ENV_NAME: dev
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: dev
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always() && vars.SLACK_WEBHOOK_URL != ''
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: dev
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null

  deploy-staging:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.env == 'staging')
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: staging
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SENTRY_SECRET_ARN: ${{ vars.SENTRY_SECRET_ARN }}
      SENTRY_SECRET_JSON_KEY: ${{ vars.SENTRY_SECRET_JSON_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
      SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
      SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
      SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
      WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
      ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
      PLANE_A_ADMIN_EMAILS: ${{ vars.PLANE_A_ADMIN_EMAILS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PUBLIC_GTM_CONTAINER_ID: ${{ vars.PUBLIC_GTM_CONTAINER_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.PUBLIC_LINKEDIN_PARTNER_ID }}
      PUBLIC_REDDIT_PIXEL_ID: ${{ vars.PUBLIC_REDDIT_PIXEL_ID }}
      PUBLIC_X_PIXEL_ID: ${{ vars.PUBLIC_X_PIXEL_ID }}
      PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
      PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID }}
      PUBLIC_ENABLE_EZOIC: ${{ vars.PUBLIC_ENABLE_EZOIC }}
      PUBLIC_EZOIC_COMPARE_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_COMPARE_INLINE_IDS }}
      PUBLIC_EZOIC_COMPARE_SIDEBAR_IDS: ${{ vars.PUBLIC_EZOIC_COMPARE_SIDEBAR_IDS }}
      PUBLIC_EZOIC_HOME_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_HOME_INLINE_IDS }}
      PUBLIC_EZOIC_DASHBOARD_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_DASHBOARD_INLINE_IDS }}
      PUBLIC_EZOIC_CORRIDOR_INTERSTITIAL_IDS: ${{ vars.PUBLIC_EZOIC_CORRIDOR_INTERSTITIAL_IDS }}
      PUBLIC_EZOIC_CORRIDOR_BELOW_FAQ_IDS: ${{ vars.PUBLIC_EZOIC_CORRIDOR_BELOW_FAQ_IDS }}
      PUBLIC_EZOIC_CORRIDOR_FOOTER_IDS: ${{ vars.PUBLIC_EZOIC_CORRIDOR_FOOTER_IDS }}
      PUBLIC_EZOIC_BLOG_SIDEBAR_IDS: ${{ vars.PUBLIC_EZOIC_BLOG_SIDEBAR_IDS }}
      PUBLIC_EZOIC_BLOG_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_BLOG_INLINE_IDS }}
      PUBLIC_EZOIC_BLOG_BANNER_IDS: ${{ vars.PUBLIC_EZOIC_BLOG_BANNER_IDS }}
      PUBLIC_EZOIC_LIMIT_COOKIES: ${{ vars.PUBLIC_EZOIC_LIMIT_COOKIES }}
      PUBLIC_EZOIC_ANCHOR_AD_POSITION: ${{ vars.PUBLIC_EZOIC_ANCHOR_AD_POSITION }}
      PUBLIC_EZOIC_ANCHOR_AD_EXPANSION: ${{ vars.PUBLIC_EZOIC_ANCHOR_AD_EXPANSION }}
      PUBLIC_EZOIC_DISABLE_INTERSTITIAL: ${{ vars.PUBLIC_EZOIC_DISABLE_INTERSTITIAL }}
      PUBLIC_EZOIC_VIGNETTE_DESKTOP: ${{ vars.PUBLIC_EZOIC_VIGNETTE_DESKTOP }}
      PUBLIC_EZOIC_VIGNETTE_MOBILE: ${{ vars.PUBLIC_EZOIC_VIGNETTE_MOBILE }}
      PUBLIC_EZOIC_VIGNETTE_TABLET: ${{ vars.PUBLIC_EZOIC_VIGNETTE_TABLET }}
      PUBLIC_EZOIC_ANCHOR_AD_ENABLED: ${{ vars.PUBLIC_EZOIC_ANCHOR_AD_ENABLED }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || vars.STAGING_COST_BUDGET_AMOUNT_USD || '100' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || vars.STAGING_COST_ANOMALY_THRESHOLD_USD || '60' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || vars.STAGING_COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (inputs.ref != '' && inputs.ref || github.sha) }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: staging
          AUDIT_BLOCKING: '1'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_exit=0
          pnpm -w audit --audit-level=high --json > ".security/${SECURITY_ENV}-pnpm-audit.json" || audit_exit=$?
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit)."
            if [ "${AUDIT_BLOCKING}" = "1" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking mode: continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-security-evidence
          path: .security
          retention-days: 90
          if-no-files-found: ignore

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Validate Required GitHub Environment Vars (staging)
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_SUPABASE_URL:-}" ] || [ -z "${PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY (configure in GitHub environment: staging)."
            exit 1
          fi
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: staging)."
            exit 1
          fi
          if [ -z "${SES_IDENTITY_ARNS:-}" ] || [ -z "${SNS_TOPIC_ARNS:-}" ]; then
            echo "Missing SES_IDENTITY_ARNS / SNS_TOPIC_ARNS (configure in GitHub environment vars: staging)."
            exit 1
          fi
          if [ -z "${SENTRY_SECRET_ARN:-}" ] || [ -z "${SENTRY_SECRET_JSON_KEY:-}" ]; then
            echo "Missing SENTRY_SECRET_ARN / SENTRY_SECRET_JSON_KEY (configure in GitHub environment vars: staging)."
            exit 1
          fi

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Capture Previous Good Image Tag (staging)
        id: prev_good
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter --name \"/remit-scout/${ENV_NAME}/last-good-image\" --query 'Parameter.Value' --output text 2>/dev/null || true)"
          echo "TAG=${value}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:${{ steps.vars.outputs.SEMVER_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-staging:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-staging"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.50.1 \
            image --no-progress --severity HIGH,CRITICAL --exit-code 1 "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 30); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/30)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "ECR scan found $CRITICAL CRITICAL vulnerabilities. Blocking deploy."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: staging
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify --keyless "${IMAGE_URI}"

      - name: CDK Diff (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}"

      - name: CDK Deploy (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-100}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-60}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            --require-approval never

      - name: Run Migrations (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Wait For ECS Stability (staging)
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ]; then
            aws ecs wait services-stable --cluster "$cluster" --services $services
          fi

      - name: Deploy Frontend (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          bucket="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')"
          dist_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue')"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          export NODE_ENV=staging
          export CLOUDFRONT_DISTRIBUTION_ID="$dist_id"
          export PLANE_A_CLOUDFRONT_DOMAIN="${plane_a_cf:-}"
          export PLANE_A_API_ENDPOINT="${plane_a_api:-}"
          export PUBLIC_API_BASE="${api_base}/api/v1"
          export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL}"
          export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY}"

          pnpm -C frontend build
          pnpm -C frontend generate
          pnpm -C frontend sentry:sourcemaps

          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "public, max-age=31536000, immutable" --exclude "*.html" --exclude "*.json" --exclude "*.map"
          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "no-cache, no-store, must-revalidate" --exclude "*" --include "*.html" --include "*.json"
          aws cloudfront create-invalidation --distribution-id "$dist_id" --paths "/*" >/dev/null

      - name: Post-deploy Smoke (staging) + Auto Rollback On Failure
        shell: bash
        env:
          ENV_NAME: staging
          STACK_NAME: ${{ vars.STACK_NAME }}
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          set +e
          API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: Staging Go-live Readiness Gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run staging-go-live-readiness.yml --ref "${GITHUB_SHA}" -f run_runtime_config_validation=true
          run_id=""
          for i in $(seq 1 30); do
            run_id="$(gh run list --workflow staging-go-live-readiness.yml --json databaseId,headSha,event -q ".[] | select(.headSha==\"${GITHUB_SHA}\" and .event==\"workflow_dispatch\") | .databaseId" | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Unable to resolve staging-go-live-readiness run ID for ${GITHUB_SHA}."
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Alarm rollback gate (staging)
        shell: bash
        env:
          ENV_NAME: staging
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alarms="$(aws cloudwatch describe-alarms \
            --alarm-names \
              "remit-scout-${ENV_NAME}-api-error-rate-high" \
              "remit-scout-${ENV_NAME}-api-p99-latency-high" \
            --query 'MetricAlarms[?StateValue==`ALARM`].AlarmName' \
            --output text)"
          if [ -n "${alarms:-}" ] && [ "${alarms}" != "None" ]; then
            echo "Critical alarm gate failed: ${alarms}"
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Record Last-known-good Image (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: staging
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always() && vars.SLACK_WEBHOOK_URL != ''
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: staging
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null

  deploy-prod:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # IMPORTANT: Production environment requires manual approval.
    # Configure in GitHub Settings -> Environments -> prod -> Required reviewers.
    environment: prod
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SENTRY_SECRET_ARN: ${{ vars.SENTRY_SECRET_ARN }}
      SENTRY_SECRET_JSON_KEY: ${{ vars.SENTRY_SECRET_JSON_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
      SES_IDENTITY_ARNS: ${{ vars.SES_IDENTITY_ARNS }}
      SNS_TOPIC_ARNS: ${{ vars.SNS_TOPIC_ARNS }}
      SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
      WAF_ADMIN_ALLOWLIST_IPS: ${{ vars.WAF_ADMIN_ALLOWLIST_IPS }}
      ADMIN_IP_ALLOWLIST: ${{ vars.ADMIN_IP_ALLOWLIST }}
      PLANE_A_ADMIN_EMAILS: ${{ vars.PLANE_A_ADMIN_EMAILS }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PUBLIC_GTM_CONTAINER_ID: ${{ vars.PUBLIC_GTM_CONTAINER_ID }}
      PUBLIC_META_PIXEL_ID: ${{ vars.PUBLIC_META_PIXEL_ID }}
      PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.PUBLIC_LINKEDIN_PARTNER_ID }}
      PUBLIC_REDDIT_PIXEL_ID: ${{ vars.PUBLIC_REDDIT_PIXEL_ID }}
      PUBLIC_X_PIXEL_ID: ${{ vars.PUBLIC_X_PIXEL_ID }}
      PUBLIC_GOOGLE_ADS_CONVERSION_ID: ${{ vars.PUBLIC_GOOGLE_ADS_CONVERSION_ID }}
      PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.PUBLIC_GOOGLE_ADSENSE_PUBLISHER_ID }}
      PUBLIC_ENABLE_EZOIC: ${{ vars.PUBLIC_ENABLE_EZOIC }}
      PUBLIC_EZOIC_COMPARE_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_COMPARE_INLINE_IDS }}
      PUBLIC_EZOIC_COMPARE_SIDEBAR_IDS: ${{ vars.PUBLIC_EZOIC_COMPARE_SIDEBAR_IDS }}
      PUBLIC_EZOIC_HOME_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_HOME_INLINE_IDS }}
      PUBLIC_EZOIC_DASHBOARD_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_DASHBOARD_INLINE_IDS }}
      PUBLIC_EZOIC_CORRIDOR_INTERSTITIAL_IDS: ${{ vars.PUBLIC_EZOIC_CORRIDOR_INTERSTITIAL_IDS }}
      PUBLIC_EZOIC_CORRIDOR_BELOW_FAQ_IDS: ${{ vars.PUBLIC_EZOIC_CORRIDOR_BELOW_FAQ_IDS }}
      PUBLIC_EZOIC_CORRIDOR_FOOTER_IDS: ${{ vars.PUBLIC_EZOIC_CORRIDOR_FOOTER_IDS }}
      PUBLIC_EZOIC_BLOG_SIDEBAR_IDS: ${{ vars.PUBLIC_EZOIC_BLOG_SIDEBAR_IDS }}
      PUBLIC_EZOIC_BLOG_INLINE_IDS: ${{ vars.PUBLIC_EZOIC_BLOG_INLINE_IDS }}
      PUBLIC_EZOIC_BLOG_BANNER_IDS: ${{ vars.PUBLIC_EZOIC_BLOG_BANNER_IDS }}
      PUBLIC_EZOIC_LIMIT_COOKIES: ${{ vars.PUBLIC_EZOIC_LIMIT_COOKIES }}
      PUBLIC_EZOIC_ANCHOR_AD_POSITION: ${{ vars.PUBLIC_EZOIC_ANCHOR_AD_POSITION }}
      PUBLIC_EZOIC_ANCHOR_AD_EXPANSION: ${{ vars.PUBLIC_EZOIC_ANCHOR_AD_EXPANSION }}
      PUBLIC_EZOIC_DISABLE_INTERSTITIAL: ${{ vars.PUBLIC_EZOIC_DISABLE_INTERSTITIAL }}
      PUBLIC_EZOIC_VIGNETTE_DESKTOP: ${{ vars.PUBLIC_EZOIC_VIGNETTE_DESKTOP }}
      PUBLIC_EZOIC_VIGNETTE_MOBILE: ${{ vars.PUBLIC_EZOIC_VIGNETTE_MOBILE }}
      PUBLIC_EZOIC_VIGNETTE_TABLET: ${{ vars.PUBLIC_EZOIC_VIGNETTE_TABLET }}
      PUBLIC_EZOIC_ANCHOR_AD_ENABLED: ${{ vars.PUBLIC_EZOIC_ANCHOR_AD_ENABLED }}
      COST_BUDGET_AMOUNT_USD: ${{ vars.COST_BUDGET_AMOUNT_USD || vars.PROD_COST_BUDGET_AMOUNT_USD || '500' }}
      COST_ANOMALY_THRESHOLD_USD: ${{ vars.COST_ANOMALY_THRESHOLD_USD || vars.PROD_COST_ANOMALY_THRESHOLD_USD || '100' }}
      COST_ALERT_EMAILS: ${{ vars.COST_ALERT_EMAILS || vars.PROD_COST_ALERT_EMAILS || 'alerts@remit-scout.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || (inputs.ref != '' && inputs.ref || github.sha) }}

      - name: Verify staging readiness gate for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow staging-go-live-readiness.yml --json databaseId,headSha,conclusion -q ".[] | select(.headSha==\"${GITHUB_SHA}\" and .conclusion==\"success\") | .databaseId" | head -n1)"
          if [ -z "$run_id" ]; then
            echo "No successful staging-go-live-readiness run found for commit ${GITHUB_SHA}."
            echo "Block prod deploy until staging readiness gate passes on this exact commit."
            exit 1
          fi
          echo "Found successful staging readiness run: ${run_id}"

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: Security Evidence Gate
        shell: bash
        env:
          SECURITY_ENV: prod
          AUDIT_BLOCKING: '1'
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json="/workspace/.security/${SECURITY_ENV}-sbom.spdx.json"
          audit_exit=0
          pnpm -w audit --audit-level=high --json > ".security/${SECURITY_ENV}-pnpm-audit.json" || audit_exit=$?
          if [ "$audit_exit" -ne 0 ]; then
            echo "pnpm audit reported issues (exit=$audit_exit)."
            if [ "${AUDIT_BLOCKING}" = "1" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking mode: continuing."
          fi

      - name: Upload Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-prod-security-evidence
          path: .security
          retention-days: 180
          if-no-files-found: ignore

      - name: Full Test Suite (prod gate)
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C backend lint
          pnpm -C backend test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate Required GitHub Environment Vars (prod)
        shell: bash
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_SUPABASE_URL:-}" ] || [ -z "${PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY (configure in GitHub environment: prod)."
            exit 1
          fi
          if [ -z "${SHARED_SECRET_ARN:-}" ]; then
            echo "Missing SHARED_SECRET_ARN (configure in GitHub environment secret: prod)."
            exit 1
          fi
          if [ -z "${SES_IDENTITY_ARNS:-}" ] || [ -z "${SNS_TOPIC_ARNS:-}" ]; then
            echo "Missing SES_IDENTITY_ARNS / SNS_TOPIC_ARNS (configure in GitHub environment vars: prod)."
            exit 1
          fi
          if [ -z "${SENTRY_SECRET_ARN:-}" ] || [ -z "${SENTRY_SECRET_JSON_KEY:-}" ]; then
            echo "Missing SENTRY_SECRET_ARN / SENTRY_SECRET_JSON_KEY (configure in GitHub environment vars: prod)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Compute Build Vars
        id: vars
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          echo "ENV_NAME=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> "$GITHUB_OUTPUT"
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          fi
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          VERSION="$(jq -r '.version' package.json)"
          echo "SEMVER_TAG=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Capture Previous Good Image Tag (prod)
        id: prev_good
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter --name \"/remit-scout/${ENV_NAME}/last-good-image\" --query 'Parameter.Value' --output text 2>/dev/null || true)"
          echo "TAG=${value}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR Repo
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          ECR_REPO="remit-scout-backend-${ENV_NAME}"
          if ! aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "${ECR_REPO}" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability IMMUTABLE \
              >/dev/null
          fi

      - name: Login To ECR
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build + Push Backend Image (with Cache)
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.vars.outputs.IMAGE_TAG }}
          tags: |
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-prod:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ steps.vars.outputs.ACCOUNT_ID }}.dkr.ecr.${{ steps.vars.outputs.AWS_REGION }}.amazonaws.com/remit-scout-backend-prod:${{ steps.vars.outputs.SEMVER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Backend Image (Trivy HIGH/CRITICAL)
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-prod"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.50.1 \
            image --no-progress --severity HIGH,CRITICAL --exit-code 1 "${ECR_URI}:${IMAGE_TAG}"

      - name: Validate ECR Scan Results
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          ENV_NAME: ${{ steps.vars.outputs.ENV_NAME }}
        run: |
          set -euo pipefail
          REPO="remit-scout-backend-${ENV_NAME}"
          for i in $(seq 1 30); do
            STATUS="$(aws ecr describe-image-scan-findings \
              --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo "IN_PROGRESS")"
            [ "$STATUS" = "COMPLETE" ] && break
            echo "ECR scan status: $STATUS (attempt $i/30)"
            sleep 10
          done
          CRITICAL="$(aws ecr describe-image-scan-findings \
            --repository-name "$REPO" --image-id imageTag="$IMAGE_TAG" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text 2>/dev/null || echo "0")"
          if [ "$CRITICAL" != "0" ] && [ "$CRITICAL" != "None" ]; then
            echo "ECR scan found $CRITICAL CRITICAL vulnerabilities. Blocking deploy."
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign backend image (digest)
        id: sign_image
        shell: bash
        env:
          AWS_REGION: ${{ steps.vars.outputs.AWS_REGION }}
          ACCOUNT_ID: ${{ steps.vars.outputs.ACCOUNT_ID }}
          IMAGE_DIGEST: ${{ steps.build_push.outputs.digest }}
          ENV_NAME: prod
        run: |
          set -euo pipefail
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/remit-scout-backend-${ENV_NAME}@${IMAGE_DIGEST}"
          cosign sign --yes "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Verify backend image signature
        shell: bash
        env:
          IMAGE_URI: ${{ steps.sign_image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail
          cosign verify --keyless "${IMAGE_URI}"

      - name: CDK Diff (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk build
          pnpm -C infrastructure/cdk exec -- cdk diff \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-500}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-100}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}"

      - name: CDK Deploy (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          pnpm -C infrastructure/cdk exec -- cdk deploy \
            -c env="${ENV_NAME}" \
            -c backendImageTag="${IMAGE_TAG}" \
            -c costBudgetAmountUsd="${COST_BUDGET_AMOUNT_USD:-500}" \
            -c costAnomalyThresholdUsd="${COST_ANOMALY_THRESHOLD_USD:-100}" \
            -c costAlertEmails="${COST_ALERT_EMAILS:-alerts@remit-scout.com}" \
            --require-approval never

      - name: Deploy Frontend (prod)
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          bucket="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')"
          dist_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue')"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          export NODE_ENV=production
          export CLOUDFRONT_DISTRIBUTION_ID="$dist_id"
          export PLANE_A_CLOUDFRONT_DOMAIN="${plane_a_cf:-}"
          export PLANE_A_API_ENDPOINT="${plane_a_api:-}"
          export PUBLIC_API_BASE="${api_base}/api/v1"
          export PUBLIC_SUPABASE_URL="${PUBLIC_SUPABASE_URL}"
          export PUBLIC_SUPABASE_ANON_KEY="${PUBLIC_SUPABASE_ANON_KEY}"

          pnpm -C frontend build
          pnpm -C frontend generate
          pnpm -C frontend sentry:sourcemaps

          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "public, max-age=31536000, immutable" --exclude "*.html" --exclude "*.json" --exclude "*.map"
          aws s3 sync "frontend/.output/public" "s3://${bucket}" --delete --cache-control "no-cache, no-store, must-revalidate" --exclude "*" --include "*.html" --include "*.json"
          aws cloudfront create-invalidation --distribution-id "$dist_id" --paths "/*" >/dev/null

      - name: Run Migrations (prod)
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          task_def="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="DbMigrateTaskDefinitionArn") | .OutputValue')"
          sg_id="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneBSecurityGroupId") | .OutputValue')"
          subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PrivateSubnetIds") | .OutputValue')"
          if [ -z "$subnet_csv" ] || [ "$subnet_csv" = "null" ]; then
            subnet_csv="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PublicSubnetIds") | .OutputValue')"
          fi
          IFS=',' read -r -a subnets <<< "$subnet_csv"

          cluster="remit-scout-${ENV_NAME}"
          subnet_list="$(printf '\"%s\",' "${subnets[@]}")"
          subnet_list="[${subnet_list%,}]"
          task_arn="$(aws ecs run-task \
            --cluster "$cluster" \
            --launch-type FARGATE \
            --task-definition "$task_def" \
            --network-configuration "awsvpcConfiguration={subnets=${subnet_list},securityGroups=[\"$sg_id\"],assignPublicIp=DISABLED}" \
            --query "tasks[0].taskArn" --output text)"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --query "tasks[0].containers[0].exitCode" --output text)"
          if [ "$exit_code" != "0" ]; then
            echo "Migration task failed (exitCode=$exit_code): $task_arn"
            exit 1
          fi

      - name: Wait For ECS Stability (prod)
        shell: bash
        env:
          ENV_NAME: prod
        run: |
          set -euo pipefail
          cluster="remit-scout-${ENV_NAME}"
          services="$(aws ecs list-services --cluster "$cluster" --query 'serviceArns' --output text)"
          if [ -n "$services" ]; then
            aws ecs wait services-stable --cluster "$cluster" --services $services
          fi

      - name: Post-deploy Smoke (prod) + Auto Rollback On Failure
        shell: bash
        env:
          ENV_NAME: prod
          STACK_NAME: ${{ vars.STACK_NAME }}
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          set +e
          API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: Alarm rollback gate (prod)
        shell: bash
        env:
          ENV_NAME: prod
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alarms="$(aws cloudwatch describe-alarms \
            --alarm-names \
              "remit-scout-${ENV_NAME}-api-error-rate-high" \
              "remit-scout-${ENV_NAME}-api-p99-latency-high" \
            --query 'MetricAlarms[?StateValue==`ALARM`].AlarmName' \
            --output text)"
          if [ -n "${alarms:-}" ] && [ "${alarms}" != "None" ]; then
            echo "Critical alarm gate failed: ${alarms}"
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Record Last-known-good Image (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: prod
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always() && vars.SLACK_WEBHOOK_URL != ''
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: prod
          STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null
