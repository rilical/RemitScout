          set -euo pipefail
          pnpm -C backend exec tsx scripts/ci/verify-ecs-task-images.ts

      - name: Record Last-known-good Image (prod)
        shell: bash
        env:
          ENV_NAME: prod
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
