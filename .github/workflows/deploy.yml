          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          fetch_status() {
            local url="$1"
            local output_path="$2"
            local status
            status="$(curl -sS -o "${output_path}" -w '%{http_code}' "${url}" || true)"
            if [ -z "${status}" ]; then
              status="000"
            fi
            printf '%s' "${status}"
          }

          wait_for_api_stabilization() {
            local attempt health_status ready_status metrics_status consecutive
            consecutive=0
            for attempt in $(seq 1 36); do
              health_status="$(fetch_status "${api_base}/healthz" /tmp/postdeploy-healthz.out)"
              ready_status="$(fetch_status "${api_base}/readyz" /tmp/postdeploy-readyz.out)"
              metrics_status="$(fetch_status "${api_base}/metrics" /tmp/postdeploy-metrics.out)"
              if [ "${health_status}" = "200" ] \
                && [ "${ready_status}" = "200" ] \
                && { [ "${metrics_status}" = "200" ] || [ "${metrics_status}" = "401" ] || [ "${metrics_status}" = "403" ]; }; then
                consecutive=$((consecutive + 1))
                echo "Public API stabilization sample ${attempt}/36 passed (${consecutive}/3 consecutive; health=${health_status}, ready=${ready_status}, metrics=${metrics_status})."
                if [ "${consecutive}" -ge 3 ]; then
                  echo "Public API stabilized after ${attempt} checks."
                  return 0
                fi
              else
                consecutive=0
                echo "Waiting for public API stabilization (attempt ${attempt}/36, health=${health_status}, ready=${ready_status}, metrics=${metrics_status})."
              fi
              sleep 5
            done
            echo "::error::Public API did not stabilize before post-deploy smoke."
            return 1
          }

          wait_for_api_stabilization

          set +e
          SMOKE_ALLOW_PROTECTED_METRICS=1 SMOKE_ALLOW_PROTECTED_HEALTH=1 API_BASE_URL="$api_base" pnpm -C backend ci:api-smoke
          smoke_ec=$?
          set -e
          if [ "$smoke_ec" != "0" ]; then
            echo "Smoke test failed."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              echo "Triggering rollback to last-known-good image: ${PREV_GOOD_TAG}"
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            else
              echo "No last-known-good image tag found in SSM; skipping rollback dispatch."
            fi
            exit 1
          fi

      - name: Verify runner IP is allowlisted for staging admin smoke
        id: admin_runner_check
        shell: bash
        run: |
          set -euo pipefail
          admin_allowlist="${ADMIN_IP_ALLOWLIST:-${WAF_ADMIN_ALLOWLIST_IPS:-}}"
          if [ -z "${admin_allowlist}" ]; then
            echo "allowlisted=false" >> "$GITHUB_OUTPUT"
            echo "runner_ip=" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing ADMIN_IP_ALLOWLIST/WAF_ADMIN_ALLOWLIST_IPS for staging admin smoke. Staging deploy can continue, but privileged admin proof is skipped and go-live readiness remains pending."
            exit 0
          fi
          runner_ip="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"
          echo "runner_ip=${runner_ip}" >> "$GITHUB_OUTPUT"
          if python3 - "$runner_ip" "$admin_allowlist" <<'PY'
          import ipaddress
          import sys

          runner_ip = ipaddress.ip_address(sys.argv[1].strip())
          allowlist_raw = sys.argv[2]

          for token in [item.strip() for item in allowlist_raw.split(',') if item.strip()]:
              network = ipaddress.ip_network(token if '/' in token else f"{token}/32", strict=False)
              if runner_ip in network:
                  print(f"Runner IP {runner_ip} is allowlisted by {network}")
                  raise SystemExit(0)

          print(f"Runner IP {runner_ip} is not present in ADMIN_IP_ALLOWLIST.", file=sys.stderr)
          raise SystemExit(1)
          PY
          then
            echo "allowlisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowlisted=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Runner IP ${runner_ip} is not present in ADMIN_IP_ALLOWLIST. Staging deploy can continue, but privileged admin proof is skipped and go-live readiness remains pending."
          fi

      - name: Admin surface smoke (staging)
        if: steps.admin_runner_check.outputs.allowlisted == 'true'
        shell: bash
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          SMOKE_USER_EMAIL: omar@remit-scout.com
          SMOKE_USER_PASSWORD: ${{ secrets.LAUNCH_PASSWORD_OMAR || secrets.DEFAULT_LAUNCH_PASSWORD }}
          SMOKE_USER_MFA_CODE: ${{ secrets.LAUNCH_MFA_OMAR || '' }}
          SMOKE_EXPECT_ADMIN_MFA: ${{ vars.ADMIN_MFA_REQUIRED }}
          SMOKE_INCLUDE_PAGE_SURFACES: '1'
          ADMIN_SMOKE_TARGET_EMAIL: support@remit-scout.com
        run: |
          set -euo pipefail
          outputs="$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs" --output json)"
          plane_a_cf="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneACloudFrontDomain") | .OutputValue')"
          plane_a_api="$(echo "$outputs" | jq -r '.[] | select(.OutputKey=="PlaneAApiUrl") | .OutputValue')"
          api_base="https://${plane_a_cf}"
          if [ -z "$plane_a_cf" ] || [ "$plane_a_cf" = "null" ]; then
            api_base="$(echo "$plane_a_api" | sed 's:/*$::')"
          fi

          if [ -z "${api_base:-}" ] || [ "${api_base}" = "null" ]; then
            echo "Unable to resolve Plane A API base for staging admin surface smoke."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing PUBLIC_SUPABASE_URL or PUBLIC_SUPABASE_ANON_KEY for staging admin surface smoke."
            exit 1
          fi
          if [ -z "${SMOKE_USER_PASSWORD:-}" ]; then
            echo "Missing LAUNCH_PASSWORD_OMAR or DEFAULT_LAUNCH_PASSWORD for staging admin surface smoke."
            exit 1
          fi
          mkdir -p .smoke-artifacts
          admin_smoke_log=".smoke-artifacts/staging-admin-surface-smoke.log"
          SMOKE_BASE_URL="$api_base" pnpm -C backend ci:admin-surface-smoke 2>&1 | tee "${admin_smoke_log}"
          if grep -Fq 'skipped=requires_verified_admin_session' "${admin_smoke_log}"; then
            echo "::error::Staging admin surface smoke did not prove privileged coverage; observer/audit or grant/revoke checks were skipped because admin exchange fell back."
            exit 1
          fi

      - name: Install Playwright browser runtime (staging admin UI smoke)
        run: pnpm -C frontend exec playwright install --with-deps chromium

      - name: Public UI smoke (staging)
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PLAYWRIGHT_BASE_URL:-}" ]; then
            echo "Missing PUBLIC_SITE_URL for staging public UI smoke."
            exit 1
          fi
          pnpm -C frontend exec playwright test tests/e2e/public-release-smoke.spec.ts

      - name: Admin UI smoke (staging)
        if: steps.admin_runner_check.outputs.allowlisted == 'true'
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PUBLIC_SITE_URL }}
          E2E_AUTH_EMAIL: omar@remit-scout.com
          E2E_AUTH_PASSWORD: ${{ secrets.LAUNCH_PASSWORD_OMAR || secrets.DEFAULT_LAUNCH_PASSWORD }}
          E2E_AUTH_MFA_CODE: ${{ secrets.LAUNCH_MFA_OMAR || '' }}
          E2E_ADMIN_SMOKE_TARGET_EMAIL: support@remit-scout.com
        run: |
          set -euo pipefail
          if [ -z "${PLAYWRIGHT_BASE_URL:-}" ]; then
            echo "Missing PUBLIC_SITE_URL for staging admin UI smoke."
            exit 1
          fi
          if [ -z "${E2E_AUTH_PASSWORD:-}" ]; then
            echo "Missing LAUNCH_PASSWORD_OMAR or DEFAULT_LAUNCH_PASSWORD for staging admin UI smoke."
            exit 1
          fi
          if [ -z "${E2E_AUTH_MFA_CODE:-}" ]; then
            echo "::error::Missing LAUNCH_MFA_OMAR for staging admin UI smoke; cannot prove privileged observer and reversible grant/revoke coverage."
            exit 1
          fi
          mkdir -p .smoke-artifacts
          admin_ui_log=".smoke-artifacts/staging-admin-ui-smoke.log"
          pnpm -C frontend exec playwright test tests/e2e/admin-surface.spec.ts 2>&1 | tee "${admin_ui_log}"
          if grep -Fq 'Skipping privileged admin UI checks' "${admin_ui_log}"; then
            echo "::error::Staging admin UI smoke skipped privileged coverage."
            exit 1
          fi

      - name: Upload staging admin smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-staging-admin-smoke-evidence
          path: |
            .smoke-artifacts/staging-admin-surface-smoke.log
            .smoke-artifacts/staging-admin-ui-smoke.log
          retention-days: 90
          if-no-files-found: ignore

      - name: Staging Go-live Readiness Gate
        if: steps.admin_runner_check.outputs.allowlisted == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatch_ref="${{ steps.resolve_ref.outputs.requested_ref }}"
          if [[ "${dispatch_ref}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            dispatch_ref="${GITHUB_REF_NAME:-staging}"
          fi
          if [ -z "${dispatch_ref}" ] || [ "${dispatch_ref}" = "HEAD" ]; then
            dispatch_ref="${GITHUB_REF_NAME:-staging}"
          fi

          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run staging-go-live-readiness.yml \
            --ref "${dispatch_ref}" \
            -f deploy_sha="${{ steps.resolve_ref.outputs.sha }}" \
            -f run_runtime_config_validation=true

          run_id=""
          for i in $(seq 1 60); do
            run_id="$(gh run list --repo "${REPO}" --workflow staging-go-live-readiness.yml --json databaseId,event,createdAt,headSha --jq "map(select(.event==\"workflow_dispatch\" and .headSha==\"${{ steps.resolve_ref.outputs.sha }}\" and .createdAt >= \"${dispatch_started_at}\"))[0].databaseId // \"\"")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Unable to resolve staging-go-live-readiness run ID after dispatch."
            exit 1
          fi

          readiness_succeeded=0
          for i in $(seq 1 240); do
            run_payload="$(gh run view "$run_id" --json status,conclusion,displayTitle 2>/dev/null || true)"
            if [ -z "${run_payload}" ]; then
              sleep 5
              continue
            fi

            run_status="$(echo "$run_payload" | jq -r '.status')"
            run_conclusion="$(echo "$run_payload" | jq -r '.conclusion // ""')"
            run_display_title="$(echo "$run_payload" | jq -r '.displayTitle // ""')"
            if [ "$run_status" = "completed" ]; then
              if [ "$run_conclusion" = "success" ]; then
                echo "Staging readiness workflow run ${run_id} succeeded."
                readiness_succeeded=1
                break
              fi
              echo "::error::Staging readiness run ${run_id} completed with conclusion=${run_conclusion}."
              if [ -n "$run_display_title" ]; then
                echo "::error::Readiness run title: ${run_display_title}"
              fi
              exit 1
            fi
            sleep 5
          done

          if [ "${readiness_succeeded}" != "1" ]; then
            echo "::error::Timed out waiting for staging-go-live-readiness run ${run_id}."
            exit 1
          fi

          artifact_payload=""
          for i in $(seq 1 12); do
            artifact_payload="$(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts?per_page=100" 2>/dev/null || true)"
            if [ -n "${artifact_payload}" ] && [ "${artifact_payload}" != "null" ]; then
              admin_count="$(echo "${artifact_payload}" | jq '[.artifacts[]? | select(.name=="staging-readiness-admin-smoke-evidence" and .expired==false)] | length')"
              release_count="$(echo "${artifact_payload}" | jq '[.artifacts[]? | select(.name=="staging-go-live-release-evidence" and .expired==false)] | length')"
              if [ "${admin_count}" -ge 1 ] && [ "${release_count}" -ge 1 ]; then
                break
              fi
            fi
            sleep 5
          done

          if [ -z "${artifact_payload}" ] || [ "${artifact_payload}" = "null" ]; then
            echo "::error::Unable to read artifacts for staging-go-live-readiness run ${run_id}."
            exit 1
          fi

          for artifact_name in staging-readiness-admin-smoke-evidence staging-go-live-release-evidence; do
            count="$(echo "${artifact_payload}" | jq --arg name "${artifact_name}" '[.artifacts[]? | select(.name==$name and .expired==false)] | length')"
            if [ "${count}" -lt 1 ]; then
              echo "::error::Staging readiness run ${run_id} is missing required artifact ${artifact_name}."
              exit 1
            fi
          done

          evidence_dir="$(mktemp -d)"
          gh run download "${run_id}" --repo "${REPO}" --name staging-go-live-release-evidence --dir "${evidence_dir}"
          manifest_path="${evidence_dir}/staging-go-live-release-evidence.json"
          if [ ! -f "${manifest_path}" ]; then
            echo "::error::Downloaded staging-go-live-release-evidence artifact did not contain staging-go-live-release-evidence.json."
            exit 1
          fi

          pnpm -C backend exec tsx scripts/ci/staging-go-live-readiness.ts \
            --verify-release-evidence \
            --manifest "${manifest_path}" \
            --expected-sha "${{ steps.resolve_ref.outputs.sha }}"

      - name: New Relic observability gate (staging)
        shell: bash
        env:
          ENV_NAME: staging
          STAGING_MODE: ${{ inputs.staging_mode || 'lean' }}
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
          NEW_RELIC_USER_API_KEY: ${{ secrets.NEW_RELIC_USER_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ vars.NEW_RELIC_ACCOUNT_ID || '7756888' }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          NEW_RELIC_ALERT_EMAIL: ${{ vars.NEW_RELIC_ALERT_EMAIL || 'alerts@remit-scout.com' }}
          NEW_RELIC_INGEST_KEY: ${{ secrets.NEW_RELIC_INGEST_KEY }}
          NEW_RELIC_LOGS_ENABLED: ${{ vars.NEW_RELIC_LOGS_ENABLED || '1' }}
          NEW_RELIC_STAGING_AWS_MODE: ${{ vars.NEW_RELIC_STAGING_AWS_MODE || 'push_only' }}
          NEW_RELIC_PROD_AWS_MODE: ${{ vars.NEW_RELIC_PROD_AWS_MODE || 'otlp_only' }}
          NEW_RELIC_AWS_METRIC_STREAM_ENABLED: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_ENABLED || '0' }}
          NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES: ${{ vars.NEW_RELIC_AWS_METRIC_STREAM_NAMESPACES || '' }}
          NEW_RELIC_AWS_LOG_FORWARDING_ENABLED: ${{ vars.NEW_RELIC_AWS_LOG_FORWARDING_ENABLED || '0' }}
          NEW_RELIC_STAGING_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_STAGING_AWS_ACCOUNT_ID }}
          NEW_RELIC_PROD_AWS_ACCOUNT_ID: ${{ vars.NEW_RELIC_PROD_AWS_ACCOUNT_ID }}
          NEW_RELIC_STAGING_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_STAGING_AWS_ROLE_ARN }}
          NEW_RELIC_PROD_AWS_ROLE_ARN: ${{ vars.NEW_RELIC_PROD_AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "${NEW_RELIC_USER_API_KEY:-}" ] || [ -z "${NEW_RELIC_ACCOUNT_ID:-}" ] || [ -z "${NEW_RELIC_REGION:-}" ]; then
            echo "Missing NEW_RELIC_USER_API_KEY / NEW_RELIC_ACCOUNT_ID / NEW_RELIC_REGION for hard New Relic gate."
            exit 1
          fi
          if [ -z "${NEW_RELIC_ALERT_EMAIL:-}" ]; then
            echo "Missing NEW_RELIC_ALERT_EMAIL for New Relic incident workflow/channel sync."
            exit 1
          fi
          if [ "${NEW_RELIC_STAGING_AWS_MODE:-}" != "otlp_only" ] && [ -z "${NEW_RELIC_STAGING_AWS_ACCOUNT_ID:-}" ]; then
            echo "Missing NEW_RELIC_STAGING_AWS_ACCOUNT_ID for account-pinned verify-signals."
            exit 1
          fi
          if [ "${NEW_RELIC_STAGING_AWS_MODE:-}" != "otlp_only" ] && [ -z "${NEW_RELIC_STAGING_AWS_ROLE_ARN:-}" ]; then
            echo "Missing NEW_RELIC_STAGING_AWS_ROLE_ARN for staging cloud-link sync."
            exit 1
          fi
          require_spans=1
          if [ "${STAGING_MODE:-lean}" = "lean" ]; then
            require_spans=0
            echo "::warning::Staging lean mode keeps New Relic spans advisory so a healthy deploy is not blocked on OTLP trace visibility."
          fi
          evidence_dir="$(mktemp -d)"
          trap 'rm -rf "${evidence_dir}"' EXIT
          set +e
          node ops/newrelic/bootstrap-dashboards.mjs | tee "${evidence_dir}/staging-newrelic-dashboards.log"
          dashboards_ec=$?
          node ops/newrelic/sync-alerts.mjs | tee "${evidence_dir}/staging-newrelic-alerts.log"
          alerts_ec=$?
          NEW_RELIC_REQUIRE_MIRROR_POLICIES=1 \
          NEW_RELIC_EVIDENCE_OUTPUT="${evidence_dir}/staging-newrelic-notifications-evidence.json" \
          node ops/newrelic/sync-notifications-workflows.mjs | tee "${evidence_dir}/staging-newrelic-notifications-sync.log"
          notifications_ec=$?
          jq -e '
            .verification.passed == true and
            .verification.mirrorPoliciesRequired == true and
            (.workflows.staging.matchedPolicyNames == ["Remit-Scout STAGING CloudWatch Mirror"]) and
            (.workflows.prod.matchedPolicyNames == ["Remit-Scout PROD CloudWatch Mirror"])
          ' "${evidence_dir}/staging-newrelic-notifications-evidence.json" >/dev/null
          notifications_proof_ec=$?
          node ops/newrelic/sync-cloud-links.mjs | tee "${evidence_dir}/staging-newrelic-cloud-links.log"
          cloud_links_ec=$?
          NEW_RELIC_TARGET_ENV=staging \
          REQUIRE_ACCOUNT_PINNING=1 \
          REQUIRE_LOGS=1 \
          REQUIRE_SPANS="${require_spans}" \
          REQUIRE_CUSTOM_METRICS=1 \
          REQUIRE_API_GW_METRICS=0 \
          REQUIRE_SQS_METRICS=1 \
          node ops/newrelic/verify-signals.mjs | tee "${evidence_dir}/staging-newrelic-verify-signals.json"
          verify_ec=$?
          verify_filter='
            (.results | length) == 1 and
            .results[0].envName == "staging" and
            .results[0].awsMode == "push_only" and
            (.results[0].failures | length) == 0 and
            (.results[0].checks.metricCount > 0) and
            (.results[0].checks.logCount > 0) and
            (.results[0].checks.sqsMetricCount > 0) and
            (.results[0].checks.customMetricCount > 0) and
            (.results[0].checks.customMetricFamilies.core_slo_indices > 0)'
          if [ "${require_spans}" = "1" ]; then
            verify_filter="${verify_filter} and (.results[0].checks.spanCount > 0)"
          else
            echo "::warning::New Relic span proof is advisory in staging lean mode; metrics/logs/custom metrics remain hard-required."
          fi
          jq -e "${verify_filter}" "${evidence_dir}/staging-newrelic-verify-signals.json" >/dev/null
          verify_proof_ec=$?
          set -e

          if [ "$dashboards_ec" != "0" ] || [ "$alerts_ec" != "0" ] || [ "$notifications_ec" != "0" ] || [ "$notifications_proof_ec" != "0" ] || [ "$cloud_links_ec" != "0" ] || [ "$verify_ec" != "0" ] || [ "$verify_proof_ec" != "0" ]; then
            echo "New Relic gate failed (dashboards=${dashboards_ec}, alerts=${alerts_ec}, notifications=${notifications_ec}, notifications_proof=${notifications_proof_ec}, cloud_links=${cloud_links_ec}, verify=${verify_ec}, verify_proof=${verify_proof_ec})."
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi
      - name: Alarm rollback gate (staging)
        shell: bash
        env:
          ENV_NAME: staging
          PREV_GOOD_TAG: ${{ steps.prev_good.outputs.TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alarms="$(aws cloudwatch describe-alarms \
            --alarm-names \
              "remit-scout-${ENV_NAME}-api-error-rate-high" \
              "remit-scout-${ENV_NAME}-api-p99-latency-high" \
            --query 'MetricAlarms[?StateValue==`ALARM`].AlarmName' \
            --output text)"
          if [ -n "${alarms:-}" ] && [ "${alarms}" != "None" ]; then
            echo "Critical alarm gate failed: ${alarms}"
            if [ -n "${PREV_GOOD_TAG:-}" ] && [ "${PREV_GOOD_TAG:-}" != "None" ]; then
              gh workflow run rollback.yml -f env="${ENV_NAME}" -f image_tag="${PREV_GOOD_TAG}" || true
            fi
            exit 1
          fi

      - name: Verify ECS task images (staging)
        shell: bash
        env:
          ENV_NAME: staging
        run: |
          set -euo pipefail
          pnpm -C backend exec tsx scripts/ci/verify-ecs-task-images.ts

      - name: Record Last-known-good Image (staging)
        shell: bash
        env:
          ENV_NAME: staging
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/remit-scout/${ENV_NAME}/last-good-image" \
            --type "String" \
            --value "${IMAGE_TAG}" \
            --overwrite

      - name: Record Deployment (CloudWatch)
        shell: bash
        env:
          ENV_NAME: staging
          COMMIT_SHA: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          aws cloudwatch put-metric-data \
            --namespace RemitScout/Deployments \
            --metric-name DeploymentCount \
            --value 1 \
            --dimensions "Environment=${ENV_NAME},Commit=${COMMIT_SHA}"

      - name: Notify Slack
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          ENV_NAME: staging
          STATUS: ${{ job.status }}
          COMMIT_SHA_IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
          RESOLVE_REF_SHA: ${{ steps.resolve_ref.outputs.sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: | 
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "Skipping Slack notification: SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi
          COMMIT_SHA="${COMMIT_SHA_IMAGE_TAG:-${RESOLVE_REF_SHA:-${DEFAULT_SHA:-unknown}}}"
          if [ -z "${COMMIT_SHA}" ] || [ "${COMMIT_SHA}" = "null" ]; then
            COMMIT_SHA="unknown"
          fi
          if [[ "${COMMIT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            COMMIT_SHA="${COMMIT_SHA:0:7}"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Deploy ${ENV_NAME}: ${STATUS} (${COMMIT_SHA})\"}" >/dev/null

  deploy-prod:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '.'))
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    # IMPORTANT: Production environment requires manual approval.
    # Configure in GitHub Settings -> Environments -> prod -> Required reviewers.
    environment: prod
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      SHARED_SECRET_ARN: ${{ secrets.SHARED_SECRET_ARN }}
      SENTRY_SECRET_ARN: ${{ vars.SENTRY_SECRET_ARN }}
      SENTRY_SECRET_JSON_KEY: ${{ vars.SENTRY_SECRET_JSON_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.NUXT_PUBLIC_SENTRY_DSN }}
