          export PUBLIC_NEW_RELIC_TRUST_KEY="${PUBLIC_NEW_RELIC_TRUST_KEY:-}"
          export PUBLIC_NEW_RELIC_AGENT_ID="${PUBLIC_NEW_RELIC_AGENT_ID:-}"
          export PUBLIC_NEW_RELIC_APPLICATION_ID="${PUBLIC_NEW_RELIC_APPLICATION_ID:-}"
