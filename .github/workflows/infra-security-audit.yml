name: infra/security-audit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      env:
        description: Environment profile
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: IAM wildcard audit
        run: pnpm -C backend ci:audit:iam-wildcards

      - name: Storage encryption audit
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
          S3_BUCKETS_CSV: ${{ vars.SECURITY_AUDIT_BUCKETS }}
          RDS_CLUSTER_IDENTIFIER: ${{ vars.SECURITY_AUDIT_RDS_CLUSTER }}
          SECURITY_AUDIT_REPORT: artifacts/aws-security-posture.json
        run: pnpm -C backend ci:audit:storage-encryption

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infra-security-audit
          path: |
            artifacts/aws-security-posture.json
            artifacts/iam-wildcard-audit.json
          retention-days: 90
          if-no-files-found: ignore

