  npm-audit:
    name: NPM Audit Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        directory: ['.', 'backend', 'frontend']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          pnpm audit --audit-level=high --json > audit-results.json || true
        continue-on-error: true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.directory }}
          path: ${{ matrix.directory }}/audit-results.json
          if-no-files-found: ignore

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.directory }}/audit-results.json';
            if (fs.existsSync(path)) {
              const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
              const vulnerabilities = audit.metadata?.vulnerabilities || {};
              const total = Object.values(vulnerabilities).reduce((a, b) => a + b, 0);
              if (total > 0) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## NPM Audit Results (${{ matrix.directory }})\n\n` +
                        `⚠️ Found ${total} vulnerabilities:\n` +
                        `- Critical: ${vulnerabilities.critical || 0}\n` +
                        `- High: ${vulnerabilities.high || 0}\n` +
                        `- Moderate: ${vulnerabilities.moderate || 0}\n` +
                        `- Low: ${vulnerabilities.low || 0}\n\n` +
                        `Please review and fix these issues.`
                });
              }
            }
