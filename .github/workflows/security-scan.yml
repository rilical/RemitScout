name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM
  workflow_dispatch:

# Security scanning automation for Remit-Scout
# Includes: Dependency scanning (Snyk, npm audit), DAST (OWASP ZAP), Secret scanning (TruffleHog)

jobs:
  snyk-security-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Snyk CLI
        run: npm i -g snyk

      - name: Run Snyk (SARIF)
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"
          snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          wait-for-processing: true

  owasp-zap-baseline:
    name: OWASP ZAP Baseline (Staging)
    runs-on: ubuntu-latest
    if: vars.ZAP_TARGET_URL != ''
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ZAP baseline against staging
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ vars.ZAP_TARGET_URL }}" \
              -J zap-baseline.json \
              -w zap-baseline.md \
              -r zap-baseline.html \
              -I

      - name: Upload ZAP baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: |
            zap-baseline.json
            zap-baseline.md
            zap-baseline.html
          if-no-files-found: ignore

  owasp-zap-full-scan:
    name: OWASP ZAP Full Scan (Staging)
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.ZAP_TARGET_URL != ''
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ZAP full scan against staging
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
              -t "${{ vars.ZAP_TARGET_URL }}" \
              -J zap-full.json \
              -w zap-full.md \
              -r zap-full.html \
              -I

      - name: Upload ZAP full scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-scan
          path: |
            zap-full.json
            zap-full.md
            zap-full.html
          if-no-files-found: ignore

  npm-audit:
    name: NPM Audit Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        directory: ['.', 'backend', 'frontend']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          pnpm audit --json > audit-results.json || true
          node -e "const fs=require('fs'); const p='audit-results.json'; if(!fs.existsSync(p)) process.exit(1); const raw=fs.readFileSync(p,'utf8').trim(); if(!raw) process.exit(0); let j; try{j=JSON.parse(raw);}catch(e){console.error('Failed to parse audit JSON'); process.exit(1);} const v=j.metadata?.vulnerabilities||{}; const high=Number(v.high||0); const critical=Number(v.critical||0); if(high>0||critical>0){console.error('pnpm audit: high/critical vulnerabilities detected', {high, critical}); process.exit(1);} console.log('pnpm audit: ok', {high, critical});"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.directory }}
          path: ${{ matrix.directory }}/audit-results.json
          if-no-files-found: ignore

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.directory }}/audit-results.json';
            if (fs.existsSync(path)) {
              const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
              const vulnerabilities = audit.metadata?.vulnerabilities || {};
              const total = Object.values(vulnerabilities).reduce((a, b) => a + b, 0);
              if (total > 0) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## NPM Audit Results (${{ matrix.directory }})\n\n` +
                        `⚠️ Found ${total} vulnerabilities:\n` +
                        `- Critical: ${vulnerabilities.critical || 0}\n` +
                        `- High: ${vulnerabilities.high || 0}\n` +
                        `- Moderate: ${vulnerabilities.moderate || 0}\n` +
                        `- Low: ${vulnerabilities.low || 0}\n\n` +
                        `Please review and fix these issues.`
                });
              }
            }
