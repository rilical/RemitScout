name: Security Scanning

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
  schedule:
    - cron: '10 4 * * 0' # Weekly on Sunday at 04:10 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: Optional DAST target URL override (falls back to repo var ZAP_TARGET_URL)
        required: false
        type: string
      run_full_scan:
        description: Run authenticated ZAP full scan (manual dispatch only)
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      run_authenticated:
        description: Run authenticated DAST jobs (requires DAST_AUTH_BEARER_TOKEN)
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: security-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve DAST Target
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_run_dast: ${{ steps.resolve.outputs.should_run_dast }}
      target_url: ${{ steps.resolve.outputs.target_url }}
      run_authenticated: ${{ steps.resolve.outputs.run_authenticated }}
      run_full_scan: ${{ steps.resolve.outputs.run_full_scan }}
      auth_header_name: ${{ steps.resolve.outputs.auth_header_name }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET_URL: ${{ inputs.target_url }}
          INPUT_RUN_AUTHENTICATED: ${{ inputs.run_authenticated }}
          INPUT_RUN_FULL_SCAN: ${{ inputs.run_full_scan }}
          VAR_DAST_AUTH_HEADER_NAME: ${{ vars.DAST_AUTH_HEADER_NAME }}
          VAR_ZAP_TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
        run: |
          set -euo pipefail

          should_run_dast="false"
          target_url=""
          run_authenticated="false"
          run_full_scan="false"
          auth_header_name="${VAR_DAST_AUTH_HEADER_NAME}"

          if [ -z "${auth_header_name}" ]; then
            auth_header_name="Authorization"
          fi

          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_run_dast="true"

            target_url="${INPUT_TARGET_URL}"
            if [ -z "${target_url}" ]; then
              target_url="${VAR_ZAP_TARGET_URL}"
            fi
            target_url="$(echo "${target_url}" | tr -d '[:space:]')"

            if [ -z "${target_url}" ]; then
              echo "::error::DAST target URL is empty. Set workflow input target_url or repo var ZAP_TARGET_URL."
              exit 1
            fi

            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              run_authenticated="${INPUT_RUN_AUTHENTICATED}"
              run_full_scan="${INPUT_RUN_FULL_SCAN}"
            else
              run_authenticated="true"
              run_full_scan="false"
            fi
          fi

          echo "should_run_dast=${should_run_dast}" >> "$GITHUB_OUTPUT"
          echo "target_url=${target_url}" >> "$GITHUB_OUTPUT"
          echo "run_authenticated=${run_authenticated}" >> "$GITHUB_OUTPUT"
          echo "run_full_scan=${run_full_scan}" >> "$GITHUB_OUTPUT"
          echo "auth_header_name=${auth_header_name}" >> "$GITHUB_OUTPUT"

  trivy-filesystem-scan:
    name: Trivy Filesystem Security Scan
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (MEDIUM/HIGH/CRITICAL)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/trivy

          scan_ec=0
          docker run --rm \
            -v "${PWD}:/workdir" \
            -v "${PWD}/.cache/trivy:/root/.cache/trivy" \
            ghcr.io/aquasecurity/trivy:0.69.1 \
            fs \
            --format sarif \
            --output /workdir/trivy-results.sarif \
            --severity MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false \
            --vuln-type os,library \
            --exit-code 1 \
            /workdir || scan_ec=$?

          if [ ! -f trivy-results.sarif ]; then
            echo "::error::Trivy did not produce trivy-results.sarif."
            exit 1
          fi

          exit "${scan_ec}"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          wait-for-processing: true

  npm-audit:
    name: NPM Audit Security Scan
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
      pull-requests: write
    strategy:
      matrix:
        directory: ['.', 'backend', 'frontend']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          pnpm audit --json > audit-results.json || true
          node -e "const fs=require('fs'); const p='audit-results.json'; if(!fs.existsSync(p)) process.exit(1); const raw=fs.readFileSync(p,'utf8').trim(); if(!raw) process.exit(0); let j; try{j=JSON.parse(raw);}catch(_e){console.error('Failed to parse audit JSON'); process.exit(1);} const v=j.metadata?.vulnerabilities||{}; const high=Number(v.high||0); const critical=Number(v.critical||0); if(high>0||critical>0){console.error('pnpm audit: high/critical vulnerabilities detected', {high, critical}); process.exit(1);} console.log('pnpm audit: ok', {high, critical});"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.directory }}
          path: ${{ matrix.directory }}/audit-results.json
          if-no-files-found: ignore

      - name: Comment PR with audit results
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = '${{ matrix.directory }}/audit-results.json';
            if (fs.existsSync(path)) {
              const audit = JSON.parse(fs.readFileSync(path, 'utf8'));
              const vulnerabilities = audit.metadata?.vulnerabilities || {};
              const total = Object.values(vulnerabilities).reduce((a, b) => a + b, 0);
              if (total > 0) {
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## NPM Audit Results (${{ matrix.directory }})\n\n` +
                        `⚠️ Found ${total} vulnerabilities:\n` +
                        `- Critical: ${vulnerabilities.critical || 0}\n` +
                        `- High: ${vulnerabilities.high || 0}\n` +
                        `- Moderate: ${vulnerabilities.moderate || 0}\n` +
                        `- Low: ${vulnerabilities.low || 0}\n\n` +
                        `Please review and fix these issues.`
                });
              }
            }


  zap-baseline-unauth:
    name: ZAP Baseline Unauthenticated (Staging)
    needs: [resolve-target]
    if: (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') && needs.resolve-target.result == 'success' && needs.resolve-target.outputs.should_run_dast == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Run ZAP baseline against staging
        env:
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${TARGET_URL}" \
              -J zap-baseline.json \
              -w zap-baseline.md \
              -r zap-baseline.html \
              -I

      - name: Enforce ZAP baseline policy (medium+)
        run: |
          node scripts/ci/check-zap-findings.mjs \
            --input zap-baseline.json \
            --baseline .security/zap-allowlist.json \
            --profile baseline \
            --out zap-baseline-summary.json

      - name: Upload ZAP baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-unauth
          path: |
            zap-baseline.json
            zap-baseline.md
            zap-baseline.html
            zap-baseline-summary.json
          retention-days: 90
          if-no-files-found: ignore

  zap-api-auth:
    name: ZAP API Authenticated (Staging)
    needs: [resolve-target]
    if: (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') && needs.resolve-target.result == 'success' && needs.resolve-target.outputs.should_run_dast == 'true' && needs.resolve-target.outputs.run_authenticated == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Validate auth token secret is configured
        env:
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DAST_AUTH_BEARER_TOKEN}" ]; then
            echo "::error::Missing staging secret DAST_AUTH_BEARER_TOKEN"
            exit 1
          fi

      - name: Generate staging OpenAPI for authenticated DAST
        env:
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const input = 'docs/openapi/api.yaml'
          const output = 'zap-api-openapi.yaml'
          const target = String(process.env.TARGET_URL || '').trim()
          if (!target) {
            throw new Error('Missing TARGET_URL')
          }
          const source = fs.readFileSync(input, 'utf8')
          const replaced = source.replace(
            /servers:\n(?:  - url:.*\n    description:.*\n)+/m,
            `servers:\n  - url: ${target}\n    description: Staging DAST target\n`,
          )
          if (replaced === source) {
            throw new Error('Unable to rewrite OpenAPI servers block')
          }
          fs.writeFileSync(output, replaced)
          NODE

      - name: Run ZAP API scan with bearer auth header
        env:
          AUTH_HEADER_NAME: ${{ needs.resolve-target.outputs.auth_header_name }}
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -f openapi \
              -t /zap/wrk/zap-api-openapi.yaml \
              -J zap-api-auth.json \
              -w zap-api-auth.md \
              -r zap-api-auth.html \
              -I \
              -z "-config replacer.full_list(0).description=auth-header -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=${AUTH_HEADER_NAME} -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer ${DAST_AUTH_BEARER_TOKEN}"

      - name: Enforce ZAP authenticated API policy (medium+)
        run: |
          node scripts/ci/check-zap-findings.mjs \
            --input zap-api-auth.json \
            --baseline .security/zap-allowlist.json \
            --profile api-auth \
            --out zap-api-auth-summary.json

      - name: Upload ZAP authenticated API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-auth
          path: |
            zap-api-openapi.yaml
            zap-api-auth.json
            zap-api-auth.md
            zap-api-auth.html
            zap-api-auth-summary.json
          retention-days: 90
          if-no-files-found: ignore

  zap-full-auth:
    name: ZAP Full Authenticated (Staging, Manual)
    needs: [resolve-target]
    if: (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') && needs.resolve-target.result == 'success' && github.event_name == 'workflow_dispatch' && needs.resolve-target.outputs.should_run_dast == 'true' && needs.resolve-target.outputs.run_authenticated == 'true' && needs.resolve-target.outputs.run_full_scan == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Validate auth token secret is configured
        env:
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DAST_AUTH_BEARER_TOKEN}" ]; then
            echo "::error::Missing staging secret DAST_AUTH_BEARER_TOKEN"
            exit 1
          fi

      - name: Run ZAP full authenticated scan
        env:
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
          AUTH_HEADER_NAME: ${{ needs.resolve-target.outputs.auth_header_name }}
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
              -t "${TARGET_URL}" \
              -J zap-full-auth.json \
              -w zap-full-auth.md \
              -r zap-full-auth.html \
              -I \
              -z "-config replacer.full_list(0).description=auth-header -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=${AUTH_HEADER_NAME} -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer ${DAST_AUTH_BEARER_TOKEN}"

      - name: Enforce ZAP full authenticated policy (medium+)
        run: |
          node scripts/ci/check-zap-findings.mjs \
            --input zap-full-auth.json \
            --baseline .security/zap-allowlist.json \
            --profile full-auth \
            --out zap-full-auth-summary.json

      - name: Upload ZAP full authenticated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-full-auth
          path: |
            zap-full-auth.json
            zap-full-auth.md
            zap-full-auth.html
            zap-full-auth-summary.json
          retention-days: 180
          if-no-files-found: ignore

  nuclei-unauth:
    name: Nuclei Unauthenticated (Staging)
    needs: [resolve-target]
    if: (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') && needs.resolve-target.result == 'success' && needs.resolve-target.outputs.should_run_dast == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Run Nuclei unauthenticated scan (curated templates)
        env:
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            projectdiscovery/nuclei:latest \
            -u "${TARGET_URL}" \
            -t http/ \
            -t ssl/ \
            -t misconfiguration/ \
            -jsonl \
            -silent \
            -duc \
            > nuclei-unauth.jsonl

      - name: Enforce Nuclei policy (medium+)
        run: |
          node scripts/ci/check-nuclei-findings.mjs \
            --input nuclei-unauth.jsonl \
            --baseline .security/nuclei-allowlist.json \
            --out nuclei-unauth-summary.json

      - name: Upload Nuclei unauthenticated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-unauth
          path: |
            nuclei-unauth.jsonl
            nuclei-unauth-summary.json
          retention-days: 90
          if-no-files-found: ignore

  nuclei-auth:
    name: Nuclei Authenticated (Staging)
    needs: [resolve-target]
    if: (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') && needs.resolve-target.result == 'success' && needs.resolve-target.outputs.should_run_dast == 'true' && needs.resolve-target.outputs.run_authenticated == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.6

      - name: Validate auth token secret is configured
        env:
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DAST_AUTH_BEARER_TOKEN}" ]; then
            echo "::error::Missing staging secret DAST_AUTH_BEARER_TOKEN"
            exit 1
          fi

      - name: Run Nuclei authenticated scan (curated templates)
        env:
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            projectdiscovery/nuclei:latest \
            -u "${TARGET_URL}" \
            -H "Authorization: Bearer ${DAST_AUTH_BEARER_TOKEN}" \
            -t http/ \
            -t ssl/ \
            -t misconfiguration/ \
            -jsonl \
            -silent \
            -duc \
            > nuclei-auth.jsonl

      - name: Enforce Nuclei authenticated policy (medium+)
        run: |
          node scripts/ci/check-nuclei-findings.mjs \
            --input nuclei-auth.jsonl \
            --baseline .security/nuclei-allowlist.json \
            --out nuclei-auth-summary.json

      - name: Upload Nuclei authenticated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-auth
          path: |
            nuclei-auth.jsonl
            nuclei-auth-summary.json
          retention-days: 90
          if-no-files-found: ignore

  alert-dast-failure:
    name: Alert on DAST Failure
    needs:
      - resolve-target
      - zap-baseline-unauth
      - zap-api-auth
      - zap-full-auth
      - nuclei-unauth
      - nuclei-auth
    if: |
      (github.event_name != 'pull_request' || github.actor != 'dependabot[bot]') &&
      always() &&
      needs.resolve-target.result == 'success' &&
      (
        needs.zap-baseline-unauth.result == 'failure' ||
        needs.zap-api-auth.result == 'failure' ||
        needs.zap-full-auth.result == 'failure' ||
        needs.nuclei-unauth.result == 'failure' ||
        needs.nuclei-auth.result == 'failure'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Alert Slack on DAST failure
        if: always()
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.ALERT_SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "Skipping Slack alert: SLACK_WEBHOOK_URL is not configured."
            exit 0
          fi
          payload="{\"text\":\"[Security] DAST failure on ${GITHUB_REPOSITORY} @ ${GITHUB_SHA} (target=${TARGET_URL})\"}"
          curl -sS -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d "$payload" >/dev/null

      - name: Alert PagerDuty on DAST failure
        if: always()
        shell: bash
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          TARGET_URL: ${{ needs.resolve-target.outputs.target_url }}
        run: |
          set -euo pipefail
          if [ -z "${PAGERDUTY_ROUTING_KEY:-}" ]; then
            echo "Skipping PagerDuty alert: PAGERDUTY_ROUTING_KEY is not configured."
            exit 0
          fi
          summary="DAST failure (${GITHUB_REPOSITORY}, target=${TARGET_URL})"
          curl -sS https://events.pagerduty.com/v2/enqueue \
            -H 'Content-Type: application/json' \
            -d '{
              "routing_key":"'"${PAGERDUTY_ROUTING_KEY}"'",
              "event_action":"trigger",
              "payload":{
                "summary":"'"${summary}"'",
                "source":"github-actions/security-scan",
                "severity":"error"
              }
            }' >/dev/null
