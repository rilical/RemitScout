name: Evidence - No Quotes Audit

run-name: Evidence - No Quotes Audit (case=${{ inputs.case_id }} dispatch=${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: IssueOps case_id (for traceability + artifact naming)
        required: true
        type: string
      dispatch_id:
        description: Brain dispatch correlation id (uuid)
        required: true
        type: string
      env:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      plane_a_base_url:
        description: Plane A base URL (API Gateway base, no /api/v1 suffix)
        required: true
        type: string
      send_currencies:
        description: CSV list (default USD,AED,GBP,EUR)
        required: false
        type: string
      method:
        description: bank|cash|wallet|airtime (default bank)
        required: false
        type: string
      amount:
        description: Amount (default 100)
        required: false
        type: string
      refresh:
        description: Set 1 to request refresh (default 0)
        required: false
        type: string
      max_corridors:
        description: Max corridors scanned (default 200)
        required: false
        type: string
      providers:
        description: Optional provider filter CSV
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: Generate evidence.json
        env:
          ENVIRONMENT: ${{ inputs.env }}
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          PLANE_A_BASE_URL: ${{ inputs.plane_a_base_url }}
          SEND_CURRENCIES: ${{ inputs.send_currencies }}
          METHOD: ${{ inputs.method }}
          AMOUNT: ${{ inputs.amount }}
          REFRESH: ${{ inputs.refresh }}
          MAX_CORRIDORS: ${{ inputs.max_corridors }}
          PROVIDERS: ${{ inputs.providers }}
          EVIDENCE_OUTPUT_FILE: evidence.json
        run: pnpm -C backend exec tsx scripts/evidence/no-quotes-evidence.ts
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.case_id }}-${{ inputs.dispatch_id }}-no-quotes
          path: evidence.json
          if-no-files-found: ignore
          retention-days: 30
