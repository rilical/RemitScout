name: Evidence - Security DAST

run-name: Evidence - Security DAST (case=${{ inputs.case_id }} dispatch=${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: IssueOps case_id (for traceability + artifact naming)
        required: true
        type: string
      dispatch_id:
        description: Brain dispatch correlation id (uuid)
        required: true
        type: string
      env:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      target_url:
        description: DAST target URL
        required: true
        type: string
      run_authenticated:
        description: Run authenticated DAST checks
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_full_scan:
        description: Run authenticated ZAP full scan
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ZAP baseline (unauth)
        id: zap_baseline
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${TARGET_URL}" \
              -J zap-baseline.json \
              -w zap-baseline.md \
              -r zap-baseline.html \
              -I

      - name: Enforce ZAP baseline policy
        id: zap_baseline_policy
        if: always()
        continue-on-error: true
        run: |
          node scripts/ci/check-zap-findings.mjs \
            --input zap-baseline.json \
            --baseline .security/zap-allowlist.json \
            --profile baseline \
            --out zap-baseline-summary.json

      - name: Run Nuclei (unauth)
        id: nuclei_unauth
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            projectdiscovery/nuclei:latest \
            -u "${TARGET_URL}" \
            -t http/ \
            -t ssl/ \
            -t misconfiguration/ \
            -jsonl \
            -silent \
            -duc \
            > nuclei-unauth.jsonl

      - name: Enforce Nuclei unauth policy
        id: nuclei_unauth_policy
        if: always()
        continue-on-error: true
        run: |
          node scripts/ci/check-nuclei-findings.mjs \
            --input nuclei-unauth.jsonl \
            --baseline .security/nuclei-allowlist.json \
            --out nuclei-unauth-summary.json

      - name: Validate auth token secret is configured
        id: auth_secret_check
        if: inputs.run_authenticated == 'true'
        continue-on-error: true
        env:
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DAST_AUTH_BEARER_TOKEN}" ]; then
            echo "::error::Missing environment secret DAST_AUTH_BEARER_TOKEN"
            exit 1
          fi

      - name: Generate staging OpenAPI for auth scan
        id: auth_openapi
        if: inputs.run_authenticated == 'true' && steps.auth_secret_check.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const input = 'docs/openapi/api.yaml'
          const output = 'zap-api-openapi.yaml'
          const target = String(process.env.TARGET_URL || '').trim()
          if (!target) throw new Error('Missing TARGET_URL')
          const source = fs.readFileSync(input, 'utf8')
          const replaced = source.replace(
            /servers:\n(?:  - url:.*\n    description:.*\n)+/m,
            `servers:\n  - url: ${target}\n    description: Staging DAST target\n`,
          )
          if (replaced === source) throw new Error('Unable to rewrite OpenAPI servers block')
          fs.writeFileSync(output, replaced)
          NODE

      - name: Run ZAP API scan (auth)
        id: zap_auth
        if: inputs.run_authenticated == 'true' && steps.auth_secret_check.outcome == 'success' && steps.auth_openapi.outcome == 'success'
        continue-on-error: true
        env:
          AUTH_HEADER_NAME: ${{ vars.DAST_AUTH_HEADER_NAME || 'Authorization' }}
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -f openapi \
              -t /zap/wrk/zap-api-openapi.yaml \
              -J zap-api-auth.json \
              -w zap-api-auth.md \
              -r zap-api-auth.html \
              -I \
              -z "-config replacer.full_list(0).description=auth-header -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=${AUTH_HEADER_NAME} -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer ${DAST_AUTH_BEARER_TOKEN}"

      - name: Enforce ZAP auth policy
        id: zap_auth_policy
        if: always() && inputs.run_authenticated == 'true'
        continue-on-error: true
        run: |
          node scripts/ci/check-zap-findings.mjs \
            --input zap-api-auth.json \
            --baseline .security/zap-allowlist.json \
            --profile api-auth \
            --out zap-api-auth-summary.json

      - name: Run Nuclei (auth)
        id: nuclei_auth
        if: inputs.run_authenticated == 'true' && steps.auth_secret_check.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            projectdiscovery/nuclei:latest \
            -u "${TARGET_URL}" \
            -H "Authorization: Bearer ${DAST_AUTH_BEARER_TOKEN}" \
            -t http/ \
            -t ssl/ \
            -t misconfiguration/ \
            -jsonl \
            -silent \
            -duc \
            > nuclei-auth.jsonl

      - name: Enforce Nuclei auth policy
        id: nuclei_auth_policy
        if: always() && inputs.run_authenticated == 'true'
        continue-on-error: true
        run: |
          node scripts/ci/check-nuclei-findings.mjs \
            --input nuclei-auth.jsonl \
            --baseline .security/nuclei-allowlist.json \
            --out nuclei-auth-summary.json

      - name: Run ZAP full scan (auth)
        id: zap_full
        if: inputs.run_authenticated == 'true' && inputs.run_full_scan == 'true' && steps.auth_secret_check.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_URL: ${{ inputs.target_url }}
          AUTH_HEADER_NAME: ${{ vars.DAST_AUTH_HEADER_NAME || 'Authorization' }}
          DAST_AUTH_BEARER_TOKEN: ${{ secrets.DAST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
              -t "${TARGET_URL}" \
              -J zap-full-auth.json \
              -w zap-full-auth.md \
              -r zap-full-auth.html \
              -I \
              -z "-config replacer.full_list(0).description=auth-header -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=${AUTH_HEADER_NAME} -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer ${DAST_AUTH_BEARER_TOKEN}"

      - name: Enforce ZAP full auth policy
        id: zap_full_policy
        if: always() && inputs.run_authenticated == 'true' && inputs.run_full_scan == 'true'
        continue-on-error: true
        run: |
          node scripts/ci/check-zap-findings.mjs \
            --input zap-full-auth.json \
            --baseline .security/zap-allowlist.json \
            --profile full-auth \
            --out zap-full-auth-summary.json

      - name: Generate evidence.json
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.env }}
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TARGET_URL: ${{ inputs.target_url }}
          AUTH_SCAN_REQUESTED: ${{ inputs.run_authenticated }}
          RUN_FULL_SCAN: ${{ inputs.run_full_scan }}
          AUTH_SECRET_CHECK_OUTCOME: ${{ steps.auth_secret_check.outcome }}
          ZAP_BASELINE_POLICY_OUTCOME: ${{ steps.zap_baseline_policy.outcome }}
          NUCLEI_UNAUTH_POLICY_OUTCOME: ${{ steps.nuclei_unauth_policy.outcome }}
          ZAP_AUTH_POLICY_OUTCOME: ${{ steps.zap_auth_policy.outcome }}
          NUCLEI_AUTH_POLICY_OUTCOME: ${{ steps.nuclei_auth_policy.outcome }}
          ZAP_FULL_POLICY_OUTCOME: ${{ steps.zap_full_policy.outcome }}
          ZAP_BASELINE_SUMMARY_FILE: zap-baseline-summary.json
          NUCLEI_UNAUTH_SUMMARY_FILE: nuclei-unauth-summary.json
          ZAP_AUTH_SUMMARY_FILE: zap-api-auth-summary.json
          NUCLEI_AUTH_SUMMARY_FILE: nuclei-auth-summary.json
          ZAP_FULL_SUMMARY_FILE: zap-full-auth-summary.json
          EVIDENCE_OUTPUT_FILE: evidence.json
        run: pnpm -C backend exec tsx scripts/evidence/security-dast-evidence.ts

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.case_id }}-${{ inputs.dispatch_id }}-security-dast
          path: evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload supporting scan summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.case_id }}-${{ inputs.dispatch_id }}-security-dast-summaries
          path: |
            zap-baseline-summary.json
            nuclei-unauth-summary.json
            zap-api-auth-summary.json
            nuclei-auth-summary.json
            zap-full-auth-summary.json
          if-no-files-found: ignore
          retention-days: 30
