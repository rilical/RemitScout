name: Evidence - Provider Capability Probe

run-name: Evidence - Provider Capability Probe (case=${{ inputs.case_id }} dispatch=${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: IssueOps case_id (for traceability + artifact naming)
        required: true
        type: string
      dispatch_id:
        description: Brain dispatch correlation id (uuid)
        required: true
        type: string
      env:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      tiers:
        description: CSV list of tiers (default tier_1,tier_2)
        required: false
        type: string
      limit:
        description: Limit per provider (default 25)
        required: false
        type: string
      amount_bucket:
        description: Amount bucket (default 500)
        required: false
        type: string
      payin_method:
        description: Payin method (default bank_transfer)
        required: false
        type: string
      payout_method:
        description: Payout method (default bank_deposit)
        required: false
        type: string
      orchestrator_run_id:
        description: Optional provider onboarding orchestrator run id
        required: false
        type: string
      ci_ref:
        description: Optional commit/context reference from orchestrator contract
        required: false
        type: string
      run_contract_json:
        description: Optional serialized run contract payload for traceability
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: Generate evidence.json
        env:
          ENVIRONMENT: ${{ inputs.env }}
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          CAPABILITY_PROBE_TIERS: ${{ inputs.tiers }}
          CAPABILITY_PROBE_LIMIT: ${{ inputs.limit }}
          CAPABILITY_PROBE_AMOUNT_BUCKET: ${{ inputs.amount_bucket }}
          CAPABILITY_PROBE_PAYIN_METHOD: ${{ inputs.payin_method }}
          CAPABILITY_PROBE_PAYOUT_METHOD: ${{ inputs.payout_method }}
          ORCHESTRATOR_RUN_ID: ${{ inputs.orchestrator_run_id }}
          CI_REF: ${{ inputs.ci_ref }}
          RUN_CONTRACT_JSON: ${{ inputs.run_contract_json }}
          DATABASE_URL_PLANE_B: ${{ secrets.DATABASE_URL_PLANE_B }}
          EVIDENCE_OUTPUT_FILE: evidence.json
        run: pnpm -C backend exec tsx scripts/evidence/provider-capability-probe-evidence.ts
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.case_id }}-${{ inputs.dispatch_id }}-provider-capability-probe
          path: evidence.json
          if-no-files-found: ignore
          retention-days: 30
