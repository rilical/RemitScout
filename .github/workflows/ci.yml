name: ci/core

on:
  workflow_call:
    inputs:
      mode:
        description: pr | main | nightly
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: 20.19.6
      pnpm_version:
        required: false
        type: string
        default: 10.19.0
  workflow_dispatch:
    inputs:
      mode:
        description: pr | main | nightly
        required: true
        default: pr
        type: choice
        options:
          - pr
          - main
          - nightly

concurrency:
  group: ci-core-${{ github.ref }}-${{ inputs.mode || github.event.inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend_changed }}
      frontend_changed: ${{ steps.filter.outputs.frontend_changed }}
      infra_changed: ${{ steps.filter.outputs.infra_changed }}
      migrations_changed: ${{ steps.filter.outputs.migrations_changed }}
      issueops_changed: ${{ steps.filter.outputs.issueops_changed }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      run_backend: ${{ steps.flags.outputs.run_backend }}
      run_frontend: ${{ steps.flags.outputs.run_frontend }}
      run_infra: ${{ steps.flags.outputs.run_infra }}
      run_e2e: ${{ steps.flags.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_changed:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            frontend_changed:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            infra_changed:
              - 'infrastructure/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            migrations_changed:
              - 'backend/db/migrations/**'
            issueops_changed:
              - '.remit-scout/**'
            docs_only:
              - 'docs/**'
              - 'README.md'
              - 'notes/**'
      - id: flags
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.mode || github.event.inputs.mode }}"
          BACKEND="${{ steps.filter.outputs.backend_changed }}"
          FRONTEND="${{ steps.filter.outputs.frontend_changed }}"
          INFRA="${{ steps.filter.outputs.infra_changed }}"
          DOCS_ONLY="${{ steps.filter.outputs.docs_only }}"

          if [ "$MODE" = "nightly" ]; then
            echo "run_backend=true" >> "$GITHUB_OUTPUT"
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            echo "run_infra=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DOCS_ONLY" = "true" ] && [ "$BACKEND" != "true" ] && [ "$FRONTEND" != "true" ] && [ "$INFRA" != "true" ]; then
            echo "run_backend=false" >> "$GITHUB_OUTPUT"
            echo "run_frontend=false" >> "$GITHUB_OUTPUT"
            echo "run_infra=false" >> "$GITHUB_OUTPUT"
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run_backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "run_infra=$INFRA" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$FRONTEND" >> "$GITHUB_OUTPUT"

  lockfile-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - name: Lockfile integrity passed
        run: echo "pnpm-lock.yaml is parseable and frozen install succeeded."

  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.docs_only != 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}

      - name: Generate Dependency SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .security
          docker run --rm -v "$PWD:/workspace" anchore/syft:v1.18.1 \
            dir:/workspace \
            -o spdx-json=/workspace/.security/pnpm-sbom.spdx.json

      - name: Dependency audit (high/critical)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .security
          audit_exit=0
          pnpm -w audit --audit-level=high --json > .security/pnpm-audit.json || audit_exit=$?

          if [ "$audit_exit" -ne 0 ]; then
            echo "Dependency audit failed with exit code $audit_exit"
            if [ "${{ inputs.mode }}" = "main" ]; then
              exit "$audit_exit"
            fi
            echo "Non-blocking in mode=${{ inputs.mode }}. Continuing."
          fi

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-evidence
          path: |
            .security/pnpm-sbom.spdx.json
            .security/pnpm-audit.json
          if-no-files-found: ignore

  lint-typecheck-build:
    runs-on: ubuntu-latest
    needs: [changes, security-gate]
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - name: AWS SDK version alignment
        run: pnpm -C backend exec tsx scripts/ci/check-sdk-versions.ts
      - name: Agent surfaces lint (AGENTS.md + provider registry)
        run: pnpm -C backend exec tsx scripts/ci/validate-agent-surfaces.ts
      - name: Reason code registry lint (EvidenceResult reason_code)
        run: pnpm -C backend exec tsx scripts/ci/validate-reason-codes.ts
      - name: Skill catalog lint (skills <-> workflows)
        run: pnpm -C backend exec tsx scripts/ci/validate-skill-catalog.ts
      - name: Provider probe coverage lint
        run: pnpm -C backend exec tsx scripts/ci/validate-provider-probe-coverage.ts
      - name: Code map lint (LLM Code Map headers)
        run: pnpm -C backend exec tsx scripts/ci/validate-code-maps.ts --changed-only
      - name: IssueOps contracts validation
        if: needs.changes.outputs.issueops_changed == 'true' || (github.event_name == 'pull_request' && contains(join(github.event.pull_request.labels.*.name, ','), 'issueops:'))
        run: pnpm -C backend exec tsx scripts/ci/validate-issueops-contracts.ts
      - name: Migration lint
        run: pnpm -C backend exec tsx scripts/ci/migration-lint.ts
      - name: SQL interpolation guardrail (changed files)
        run: |
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only --plane-a
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only --plane-c
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only --root scripts
      - name: License audit (prod deps)
        run: pnpm licenses list --prod --json | node scripts/ci/check-licenses.mjs
      - name: sharp native smoke
        run: pnpm -C backend exec node -e "require('sharp'); console.log('sharp ok')"
      - run: pnpm -C backend lint
        if: needs.changes.outputs.run_backend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'
      - run: pnpm -C frontend lint
        if: needs.changes.outputs.run_frontend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'
      - name: Boundary enforcement (Golden Rule)
        if: needs.changes.outputs.run_backend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'
        shell: bash
        run: |
          set +e
          pnpm exec eslint backend/plane-a/ForbiddenImport.test.js --no-ignore
          eslint_exit=$?
          if [ $eslint_exit -eq 0 ]; then
            echo "ERROR: Boundary rule did NOT trigger on forbidden import!"
            exit 1
          fi
          echo "Golden Rule enforcement working (forbidden import was blocked)."
      - run: pnpm -C frontend type-check
        if: needs.changes.outputs.run_frontend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'
      - run: pnpm -C frontend build
        if: needs.changes.outputs.run_frontend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'
      - run: pnpm -C backend build
        if: needs.changes.outputs.run_backend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'

  contract-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.run_backend == 'true' || needs.changes.outputs.run_frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C frontend api:types:check

  migration-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.migrations_changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disallow editing historical migrations
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          git fetch origin "$base" --depth=1
          # Only allow added migrations in PR diffs. Modified/deleted migrations are blocked.
          bad=$(git diff --name-status "origin/$base"...HEAD -- backend/db/migrations | awk '$1 != "A" {print}')
          if [ -n "$bad" ]; then
            echo "Editing existing migrations is not allowed:"
            echo "$bad"
            exit 1
          fi
          echo "✅ Migration immutability check passed"

  migration-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.run_backend == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DATABASE_URL_PLANE_A: postgres://test:test@localhost:5432/test
      DATABASE_URL_PLANE_B: postgres://test:test@localhost:5432/test
      DATABASE_URL_PLANE_C: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - name: Migration dry-run
        run: pnpm -C backend db:migrate

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.run_backend == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remit -d remit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_A: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_B: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_C: postgres://remit:remit@localhost:5432/remit
      PLANE_A_ADMIN_EMAILS: admin@example.com
      ENFORCE_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C backend db:migrate
      - run: pnpm -C backend db:seed
      - name: Rights differential gate
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode || github.event.inputs.mode }}"
          if [ "$MODE" = "main" ] || [ "$MODE" = "nightly" ]; then
            RIGHTS_SCOPE=all STRICT_DATA_HEALTH=1 pnpm -C backend ci:rights-differential-gate
          else
            RIGHTS_SCOPE=priority pnpm -C backend ci:rights-differential-gate
          fi
      - run: pnpm -C backend exec tsx scripts/generate-fixtures.ts
      - run: pnpm -C backend test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/lcov.info
          flags: backend,backend_shared,backend_plane_a,backend_plane_c,backend_billing
          name: backend-coverage
          fail_ci_if_error: true

  mutation-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.run_backend == 'true' || (inputs.mode || github.event.inputs.mode) == 'nightly'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - name: Run critical mutation suite
        run: pnpm -C backend test:mutation:critical
      - name: Enforce mutation survivor gate
        env:
          MUTATION_MAX_SURVIVED: '0'
        run: pnpm -C backend ci:mutation-gate
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-critical
          path: |
            backend/reports/mutation
            backend/reports/mutation/**/*.json
          if-no-files-found: ignore

  backend-docker-native-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.run_backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (${{ matrix.platform }})
        shell: bash
        run: |
          set -euo pipefail
          tag="remit-scout-backend-native:${{ matrix.platform }}"
          tag="${tag//\//-}"
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --file backend/Dockerfile \
            --target runner \
            --build-arg SKIP_BACKEND_BUILD=1 \
            --tag "$tag" \
            --load \
            .
          docker run --rm --platform "${{ matrix.platform }}" "$tag" node -e "require('sharp'); console.log('sharp ok')"

  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lockfile-integrity, contract-types]
    if: needs.changes.outputs.run_frontend == 'true'
    env:
      ENFORCE_COVERAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C frontend type-check
      - run: pnpm -C frontend test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: true

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, lockfile-integrity, contract-types]
    if: needs.changes.outputs.run_e2e == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -C frontend exec playwright install --with-deps
      - run: pnpm -C frontend build
      - run: pnpm -C frontend sentry:sourcemaps
      - name: Check bundle size
        run: node scripts/ci/check-frontend-bundle-size.mjs
      - run: pnpm -C frontend test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.run_backend == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remit -d remit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_A: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_B: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_C: postgres://remit:remit@localhost:5432/remit
      PLANE_A_ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C backend db:migrate
      - run: pnpm -C backend ci:seed-sanity
      - run: pnpm -C backend ci:api-smoke

  config-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, lockfile-integrity]
    if: needs.changes.outputs.docs_only != 'true'
    env:
      NODE_ENV: production
      STRICT_CONFIG: "1"
      DATABASE_URL_PLANE_A: postgres://user:pass@host:5432/db
      DATABASE_URL_PLANE_B: postgres://user:pass@host:5432/db
      DATABASE_URL_PLANE_C: postgres://user:pass@host:5432/db
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: example-key
      STRIPE_SECRET_KEY: sk_test_example
      STRIPE_WEBHOOK_SECRET: whsec_example
      STRIPE_PRICE_ID_PLUS: price_example
      PLANE_A_REQUIRE_JWT: "1"
      PLANE_A_JWT_SECRET: jwt_secret_example
      SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
      TRACING_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.example.com/v1/traces
      CLOUDWATCH_METRICS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C backend ci:config-validate
      - run: pnpm -C backend ci:observability
