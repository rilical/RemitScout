name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10.19.0

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend lint
      - run: pnpm -C frontend lint
      - name: Boundary enforcement (Golden Rule)
        shell: bash
        run: |
          set +e
          pnpm exec eslint backend/plane-a/ForbiddenImport.test.js --no-ignore
          eslint_exit=$?
          if [ $eslint_exit -eq 0 ]; then
            echo "ERROR: Boundary rule did NOT trigger on forbidden import!"
            exit 1
          fi
          echo "Golden Rule enforcement working (forbidden import was blocked)."
      - run: pnpm -C frontend type-check
      - run: pnpm -C backend build

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remit -d remit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_A: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_B: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_C: postgres://remit:remit@localhost:5432/remit
      PLANE_A_ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend db:migrate
      - run: pnpm -C backend test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  guardrail:
    if: ${{ secrets.DATABASE_URL_PLANE_A != '' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_PLANE_A: ${{ secrets.DATABASE_URL_PLANE_A }}
      RUN_BRONZE_GUARDRAIL_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend test -- tests/guardrails.test.ts

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm -C frontend exec playwright install --with-deps
      - run: pnpm -C frontend build
      - run: pnpm -C frontend test:e2e

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remit -d remit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_A: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_B: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_C: postgres://remit:remit@localhost:5432/remit
      PLANE_A_ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend db:migrate
      - run: pnpm -C backend ci:seed-sanity
      - run: pnpm -C backend ci:api-smoke

  config-validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      STRICT_CONFIG: "1"
      DATABASE_URL_PLANE_A: postgres://user:pass@host:5432/db
      DATABASE_URL_PLANE_B: postgres://user:pass@host:5432/db
      DATABASE_URL_PLANE_C: postgres://user:pass@host:5432/db
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: example-key
      STRIPE_SECRET_KEY: sk_test_example
      STRIPE_WEBHOOK_SECRET: whsec_example
      STRIPE_PRICE_ID_PLUS: price_example
      PLANE_A_REQUIRE_JWT: "1"
      PLANE_A_JWT_SECRET: jwt_secret_example
      SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
      TRACING_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.example.com/v1/traces
      CLOUDWATCH_METRICS_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C backend ci:config-validate
      - run: pnpm -C backend ci:observability

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        with:
          args: "--verbose --redact"

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C infrastructure/cdk build
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/cdk
          framework: cdk

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - lint-typecheck-build
      - backend-tests
      - frontend-unit
      - frontend-e2e
      - smoke
      - config-validate
      - audit
      - gitleaks
      - semgrep
      - iac-scan
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remit -d remit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL_PLANE_B: postgres://remit:remit@localhost:5432/remit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version-tag.mjs
      - run: pnpm -C backend db:migrate
