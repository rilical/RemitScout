name: ci/core

on:
  workflow_call:
    inputs:
      mode:
        description: pr | main
        required: true
        type: string
      node_version:
        required: false
        type: string
        default: "20.19.6"
      pnpm_version:
        required: false
        type: string
        default: "10.19.0"
  workflow_dispatch:
    inputs:
      mode:
        description: pr | main
        required: true
        default: pr
        type: choice
        options:
          - pr
          - main

concurrency:
  group: ci-core-${{ github.ref }}-${{ inputs.mode || github.event.inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      migrations: ${{ steps.filter.outputs.migrations }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            infra:
              - 'infrastructure/**'
            migrations:
              - 'backend/db/migrations/**'
      - id: docs
        shell: bash
        run: |
          if [ "${{ steps.filter.outputs.backend }}" != "true" ] && \
             [ "${{ steps.filter.outputs.frontend }}" != "true" ] && \
             [ "${{ steps.filter.outputs.infra }}" != "true" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - name: Backend lint
        if: needs.changes.outputs.backend == 'true'
        run: pnpm -C backend lint
      - name: Backend build (typecheck)
        if: needs.changes.outputs.backend == 'true'
        run: pnpm -C backend build
      - name: Frontend lint
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm -C frontend lint
      - name: Frontend typecheck
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm -C frontend type-check
      - name: Frontend API types check
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
        run: pnpm -C frontend api:types:check
        continue-on-error: true
      - name: SQL interpolation guardrail
        if: needs.changes.outputs.backend == 'true'
        run: |
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only --plane-a
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only --plane-c
          pnpm -C backend exec tsx scripts/sql-guardrail.ts --unsafe-interpolation --changed-only --root scripts
      - name: Migration lint
        if: needs.changes.outputs.migrations == 'true'
        run: pnpm -C backend exec tsx scripts/ci/migration-lint.ts

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remit
          POSTGRES_PASSWORD: remit
          POSTGRES_DB: remit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U remit -d remit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_A: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_B: postgres://remit:remit@localhost:5432/remit
      DATABASE_URL_PLANE_C: postgres://remit:remit@localhost:5432/remit
      PLANE_A_ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C backend db:migrate
      - run: pnpm -C backend db:seed
      - run: pnpm -C backend exec tsx scripts/generate-fixtures.ts
      - run: pnpm -C backend test

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C frontend test

  migration-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      DATABASE_URL_PLANE_A: postgres://test:test@localhost:5432/test
      DATABASE_URL_PLANE_B: postgres://test:test@localhost:5432/test
      DATABASE_URL_PLANE_C: postgres://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: pnpm -C backend db:migrate
      - name: Migration immutability check
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          bad=$(git diff --name-status "origin/$BASE_REF"...HEAD -- backend/db/migrations | awk '$1 != "A" {print}')
          if [ -n "$bad" ]; then
            echo "::error::Editing existing migrations is not allowed:"
            echo "$bad"
            exit 1
          fi

  infra-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    env:
      CDK_DEFAULT_ACCOUNT: "000000000000"
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
      - run: cd infrastructure/cdk && npm ci
      - run: cd infrastructure/cdk && npx cdk synth --quiet
