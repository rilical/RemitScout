name: ci/workflow-guards

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enforce CI/CD workflow invariants
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          must_contain() {
            local file="$1"
            local needle="$2"
            local label="$3"
            grep -Fq -- "$needle" "$file" || fail "$label ($file)"
          }

          must_not_contain() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if grep -Fq -- "$needle" "$file"; then
              fail "$label ($file)"
            fi
          }

          # 1) Forbid hardcoded pnpm/action-setup version pins.
          violations="$(awk '
            /^[[:space:]]*-[[:space:]]*uses:[[:space:]]*pnpm\/action-setup@v4[[:space:]]*$/ { in_step=1; next }
            in_step {
              if ($0 ~ /^[[:space:]]*-[[:space:]]/) { in_step=0; next }
              if ($0 ~ /^[[:space:]]*version:[[:space:]]*[^[:space:]]+/) {
                print FILENAME ":" NR ": " $0
                bad=1
              }
            }
            END { if (bad) exit 0; exit 1 }
          ' .github/workflows/*.yml || true)"
          if [ -n "${violations}" ]; then
            echo "${violations}"
            fail "Forbidden pnpm/action-setup@v4 + version pin reintroduced"
          fi

          # 2) paths-filter permission hardening.
          must_contain ".github/workflows/ci.yml" "pull-requests: read" "ci.yml must include pull-requests: read"
          must_contain ".github/workflows/ci-pr.yml" "pull-requests: read" "ci-pr.yml must include pull-requests: read"
          must_contain ".github/workflows/infra-synth.yml" "pull-requests: read" "infra-synth.yml must include pull-requests: read"
          must_contain ".github/workflows/ci.yml" "dorny/paths-filter@v3" "ci.yml must keep paths-filter usage"
          must_contain ".github/workflows/infra-synth.yml" "dorny/paths-filter@v3" "infra-synth.yml must keep paths-filter usage"

          # 3) CI core stability invariants.
          must_contain ".github/workflows/ci.yml" "PLANE_C_BASE_URL" "config-validate must include PLANE_C_BASE_URL placeholder"
          must_contain ".github/workflows/ci.yml" "ALERT_EVALUATION_QUEUE_URL" "config-validate must include ALERT_EVALUATION_QUEUE_URL placeholder"
          must_contain ".github/workflows/ci.yml" "PLANE_A_CORS_ORIGINS: http://localhost:3000" "CORS bootstrap placeholder must be set"
          must_contain ".github/workflows/ci.yml" "@stryker-mutator/typescript-checker" "mutation preflight must validate Stryker checker"
          must_not_contain ".github/workflows/ci.yml" "--build-arg SKIP_BACKEND_BUILD=1" "backend docker native deps must not skip backend build artifacts"
          must_contain ".github/workflows/ci.yml" "Non-blocking in mode=\${{ inputs.mode }}. Continuing." "security gate must stay non-blocking in ci/main"
          must_not_contain ".github/workflows/ci.yml" "if [ \"\${{ inputs.mode }}\" = \"main\" ]; then" "security gate must not block ci/main audit"

          # 4) Dependabot noise controls and security fixes.
          must_contain ".github/workflows/security-lite.yml" "github.actor != 'dependabot[bot]'" "security-lite must skip dependabot PRs"
          must_contain ".github/workflows/security-lite.yml" "GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}" "gitleaks must pass GITHUB_TOKEN"
          must_not_contain ".github/workflows/security-lite.yml" "args:" "gitleaks unsupported args input must stay removed"
          must_contain ".github/workflows/security-scan.yml" "run_install: false" "security-scan pnpm setup must avoid hardcoded version"
          must_contain ".github/workflows/security-scan.yml" "continue-on-error: true" "security-scan SARIF upload must be non-fatal"
          must_contain ".github/workflows/codeql-analysis.yml" "name: CodeQL Preflight" "codeql preflight must exist"
          must_contain ".github/workflows/codeql-analysis.yml" "skip_reason=code_scanning_disabled" "codeql disabled-scanning skip reason must exist"
          must_contain ".github/workflows/codeql-analysis.yml" "name: CodeQL Skipped" "codeql skip-notice job must exist"

          # 5) Deploy resilience invariants.
          resolve_count="$(grep -c "name: Resolve deployment ref" .github/workflows/deploy.yml || true)"
          [ "${resolve_count}" -ge 3 ] || fail "deploy.yml must resolve refs for dev/staging/prod"
          must_contain ".github/workflows/deploy.yml" "AWS_ROLE_TO_ASSUME_FALLBACK" "deploy.yml must include optional fallback role contract"
          must_contain ".github/workflows/deploy.yml" "aws_creds_primary" "deploy.yml must include primary credential bootstrap step"
          must_contain ".github/workflows/deploy.yml" "aws_creds_fallback" "deploy.yml must include fallback credential bootstrap step"
          recover_count="$(grep -c "Recover CloudFormation rollback state" .github/workflows/deploy.yml || true)"
          [ "${recover_count}" -ge 3 ] || fail "deploy.yml must include rollback recovery preflight for dev/staging/prod"
          must_contain ".github/workflows/deploy.yml" "continue-update-rollback" "deploy.yml must continue rollback when UPDATE_ROLLBACK_FAILED"
          must_contain ".github/workflows/deploy.yml" "resolve_ref.outputs.sha" "deploy.yml checkouts must use resolved SHA"

          # 6) Uptime target fallback behavior.
          must_contain ".github/workflows/uptime-synthetic.yml" "PUBLIC_SITE_URL" "uptime-synthetic must include PUBLIC_SITE_URL fallback source"
          must_contain ".github/workflows/uptime-synthetic.yml" "should_run=false" "uptime-synthetic must support safe skip when target is unresolved"
          must_contain ".github/workflows/uptime-synthetic.yml" "Skipping synthetic run" "uptime-synthetic must emit explicit non-noisy warning path"

          echo "All workflow guard checks passed."
