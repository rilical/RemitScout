name: Evidence - HTTP Latency

run-name: Evidence - HTTP Latency (case=${{ inputs.case_id }} dispatch=${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: IssueOps case_id (for traceability + artifact naming)
        required: true
        type: string
      dispatch_id:
        description: Brain dispatch correlation id (uuid)
        required: true
        type: string
      env:
        description: Environment (used for thresholds/severity)
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      target_url:
        description: URL to probe (GET)
        required: true
        type: string
      requests:
        description: Request count (default 20)
        required: false
        type: string
      timeout_ms:
        description: Per-request timeout (default 5000)
        required: false
        type: string

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0
      - name: Generate evidence.json
        env:
          ENVIRONMENT: ${{ inputs.env }}
          CASE_ID: ${{ inputs.case_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TARGET_URL: ${{ inputs.target_url }}
          REQUESTS: ${{ inputs.requests }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
          EVIDENCE_OUTPUT_FILE: evidence.json
        run: pnpm -C backend exec tsx scripts/evidence/http-latency-evidence.ts
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.case_id }}-${{ inputs.dispatch_id }}-http-latency
          path: evidence.json
          if-no-files-found: ignore
          retention-days: 30
