name: ci/agent-pr-checks

on:
  push:
    branches:
      - 'agent/repair-*'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/plane-b/src/providers/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-repair-validation:
    if: startsWith(github.head_ref || github.ref_name, 'agent/repair-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: Lint changed files
        run: pnpm lint

      - name: Run contract tests
        run: pnpm vitest run --reporter=verbose backend/tests/
        env:
          NODE_ENV: test

      - name: Validate provider code maps
        run: pnpm tsx backend/scripts/ci/validate-code-maps.ts

      - name: Validate reason codes
        run: pnpm tsx backend/scripts/ci/validate-reason-codes.ts

      - name: Summary
        if: always()
        run: |
          echo "## Agent Repair PR Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.head_ref || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
