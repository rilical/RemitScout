name: resilience/chaos-tests

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment for chaos execution
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
      scenario:
        description: Chaos scenario profile
        required: true
        default: redis_unavailable
        type: choice
        options:
          - redis_unavailable
          - sqs_failure
          - provider_timeout
      dry_run:
        description: Validate wiring only, do not trigger FIS
        required: true
        default: false
        type: boolean
      auto_rollback:
        description: Trigger rollback workflow if scenario/smoke fails
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node_version: 20.19.6
          pnpm_version: 10.19.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Execute chaos scenario
        shell: bash
        env:
          CHAOS_ALLOW: '1'
          CHAOS_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ENVIRONMENT: ${{ inputs.env }}
          CHAOS_SCENARIO: ${{ inputs.scenario }}
          CHAOS_TEMPLATE_REDIS_UNAVAILABLE: ${{ vars.CHAOS_TEMPLATE_REDIS_UNAVAILABLE }}
          CHAOS_TEMPLATE_SQS_FAILURE: ${{ vars.CHAOS_TEMPLATE_SQS_FAILURE }}
          CHAOS_TEMPLATE_PROVIDER_TIMEOUT: ${{ vars.CHAOS_TEMPLATE_PROVIDER_TIMEOUT }}
          CHAOS_SUMMARY_PATH: artifacts/chaos/chaos-summary.json
        run: |
          set -euo pipefail
          pnpm -C backend chaos:run --scenario "$CHAOS_SCENARIO" --env "$ENVIRONMENT"

      - name: Post-chaos smoke
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.PLANE_A_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${SMOKE_BASE_URL:-}" ]; then
            pnpm -C backend ci:api-smoke
          else
            echo "SMOKE_BASE_URL not configured; skipping post-chaos smoke."
          fi

      - name: Trigger rollback hook
        if: failure() && inputs.auto_rollback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          gh workflow run rollback.yml -f env="$ROLLBACK_ENV" || true

      - name: Upload chaos artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-artifacts-${{ inputs.env }}-${{ inputs.scenario }}
          path: artifacts/chaos
          retention-days: 90
          if-no-files-found: ignore

