title = "Remit-Scout Gitleaks Configuration"

[extend]
# Use default regexes
useDefault = true

[allowlist]
description = "Allowlist for known false positives"
paths = [
  '''\.md$''',
  '''\.txt$''',
  '''\.json$''',
  '''\.example$''',
  '''\.sample$''',
  '''\.test\.ts$''',
  '''\.test\.js$''',
  '''\.spec\.ts$''',
  '''\.spec\.js$''',
  '''node_modules/''',
  '''\.git/''',
  '''dist/''',
  '''build/''',
  '''coverage/''',
  '''\.env\.example''',
  '''\.env\.sample''',
  '''\.github/workflows/.*\.yml$''',
  '''\.github/actions/.*\.yml$''',
  '''pnpm-lock\.yaml$''',
  '''artifacts/''',
]

commits = [
  '''^Initial commit''',
  '''^Merge.*''',
]

regexes = [
  '''example.*key''',
  '''test.*secret''',
  '''placeholder''',
  '''your.*here''',
  '''sk_test_[A-Za-z0-9]+''',
  '''GITHUB_TOKEN''',
  '''secrets\.\w+''',
  '''arn:aws:iam::[0-9]*:''',
]

[[rules]]
id = "remit-scout-custom"
description = "Custom patterns for Remit-Scout"
regex = '''(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|private[_-]?key)\s*[=:]\s*['"]?[a-zA-Z0-9]{20,}['"]?'''



