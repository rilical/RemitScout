openapi: 3.0.3
info:
  title: Remit-Scout Billing API
  version: 0.1.0
paths:
  /api/v1/billing/checkout-session:
    post:
      summary: Create Stripe checkout session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code:
                  type: string
                  enum: [plus, enterprise]
                billing_interval:
                  type: string
                  enum: [month, year]
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  session_id:
                    type: string
        "400":
          description: Unsupported or invalid checkout request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already has an active or trialing Plus subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/billing/portal:
    get:
      summary: Create Stripe billing portal session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        "400":
          description: No Stripe customer is attached to the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/billing/history:
    get:
      summary: List Stripe invoice history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing history response
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        date:
                          type: string
                          format: date-time
                          nullable: true
                        amount:
                          type: number
                          nullable: true
                        currency:
                          type: string
                          nullable: true
                        status:
                          type: string
                          nullable: true
                        invoice_url:
                          type: string
                          format: uri
                          nullable: true
        "400":
          description: No Stripe customer is attached to the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/billing/verify-session:
    post:
      summary: Verify a Stripe checkout session belongs to the caller
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
      responses:
        "200":
          description: Checkout session verification response
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  session_id:
                    type: string
                  status:
                    type: string
                    nullable: true
                  payment_status:
                    type: string
                    nullable: true
        "400":
          description: Invalid session verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/billing/webhook:
    post:
      summary: Stripe webhook handler
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
