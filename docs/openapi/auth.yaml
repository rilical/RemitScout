openapi: 3.0.3
info:
  title: Remit-Scout Auth API
  version: 0.1.0
paths:
  /api/me:
    get:
      summary: Get current user plan and entitlements
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User plan and entitlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                    format: date-time
                  user:
                    type: object
                    properties:
                      user_id:
                        type: string
                      email:
                        type: string
                  plan:
                    type: object
                    properties:
                      plan_code:
                        type: string
                      status:
                        type: string
                  entitlements:
                    type: object
                  usage:
                    type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
