openapi: 3.0.3
info:
  title: Remit-Scout Public API
  version: 0.1.0
paths:
  /api/quotes/current:
    get:
      summary: Current quotes for a corridor
      parameters:
        - in: query
          name: corridor_id
          required: true
          schema:
            type: string
        - in: query
          name: amount_bucket
          required: true
          schema:
            type: integer
        - in: query
          name: payin
          required: true
          schema:
            type: string
        - in: query
          name: payout
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quotes response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                  count:
                    type: integer
                  requested_amount:
                    type: number
                  bucket_used:
                    type: integer
                  fee_bucket_used:
                    type: integer
                  approximate:
                    type: boolean
                  cache:
                    type: object
                    properties:
                      ttl_seconds:
                        type: integer
                      age_seconds:
                        type: integer
                        nullable: true
                      fresh:
                        type: boolean
                  refresh:
                    type: object
                    properties:
                      attempted:
                        type: boolean
                      enqueued:
                        type: boolean
                      request_id:
                        type: string
                        nullable: true
                      request_ids:
                        type: array
                        items:
                          type: string
                      providers:
                        type: array
                        items:
                          type: string
                  quotes:
                    type: array
                    items:
                      type: object
                      properties:
                        provider_id:
                          type: string
                        corridor_id:
                          type: string
                        amount_bucket:
                          type: integer
                        payin:
                          type: string
                        payout:
                          type: string
                        payin_method:
                          type: string
                        payout_method:
                          type: string
                        delivery_time_min_minutes:
                          type: integer
                          nullable: true
                        delivery_time_max_minutes:
                          type: integer
                          nullable: true
                        collected_at:
                          type: string
                        send_amount:
                          type: number
                        fee_amount:
                          type: number
                        receive_amount:
                          type: number
                        implied_fx_rate:
                          type: number
                        promotional_rate:
                          type: number
                          nullable: true
                        base_rate:
                          type: number
                          nullable: true
                        promotional_cap_amount:
                          type: number
                          nullable: true
                        quality_flags:
                          type: object
                        updated_at:
                          type: string
  /api/popular-corridors:
    get:
      summary: Popular corridors summary
      responses:
        '200':
          description: Popular corridors response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  timestamp:
                    type: string
                  count:
                    type: integer
                  corridors:
                    type: array
                    items:
                      type: object
                      properties:
                        route:
                          type: string
                        count_24h:
                          type: integer
                        top_provider:
                          type: string
                        fee_range:
                          type: string
                        speed_range:
                          type: string
                        best_for:
                          type: string

  /api/bank-vs-specialist:
    get:
      summary: Bank vs specialist comparison (US to Mexico)
      parameters:
        - in: query
          name: amount
          required: false
          schema:
            type: number
        - in: query
          name: from
          required: false
          schema:
            type: string
        - in: query
          name: to
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Bank vs specialist response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      corridor:
                        type: object
                        properties:
                          from:
                            type: string
                          to:
                            type: string
                          sendCurrency:
                            type: string
                          recvCurrency:
                            type: string
                      midRate:
                        type: number
                      bank:
                        type: object
                        properties:
                          name:
                            type: string
                          fee:
                            type: number
                          fxRate:
                            type: number
                          recipientGets:
                            type: number
                          delivery:
                            type: string
                      top:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          fee:
                            type: number
                          fxRate:
                            type: number
                          recipientGets:
                            type: number
                          delivery:
                            type: string
                      updatedAt:
                        type: string
                      savings:
                        type: object
                        properties:
                          amount:
                            type: number
                          recipientGetsDifference:
                            type: number
                          percentage:
                            type: number
                  updatedAt:
                    type: string

  /api/geo:
    get:
      summary: Geolocation lookup
      responses:
        '200':
          description: Geolocation response
          content:
            application/json:
              schema:
                type: object
                properties:
                  countryCode:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  timezone:
                    type: string
                    nullable: true
                  source:
                    type: string
                        updated_at:
                          type: string
