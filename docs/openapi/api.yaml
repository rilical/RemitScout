components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase Auth
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Enterprise API key for server-to-server access

  schemas:
    ProviderQuote:
      type: object
      required:
        - id
        - name
        - fee
        - marginPct
        - fxRate
        - recipientGets
        - delivery
        - reliability
        - methods
        - bestFor
      properties:
        id:
          type: string
          description: Provider slug
          example: remitly
        providerId:
          type: string
          description: Provider ID (canonical)
          example: westernunion
        name:
          type: string
          description: Provider display name
          example: Remitly
        logoUrl:
          type: string
          format: uri
          nullable: true
          example: /logos/remitly.svg
        fee:
          type: number
          description: Total fee in send currency
          example: 1.99
        marginPct:
          type: number
          description: FX markup percentage vs mid-market rate
          example: 0.4
        fxRate:
          type: number
          description: Exchange rate (send currency → receive currency)
          example: 56.5
        recipientGets:
          type: number
          description: Amount recipient receives in receive currency
          example: 56500
        delivery:
          type: string
          description: Human-readable delivery time
          example: Same day
        reliability:
          type: number
          description: Reliability score (0-1)
          minimum: 0
          maximum: 1
          example: 0.91
        methods:
          type: array
          items:
            type: string
            enum: [bank, cash, wallet]
          description: Available payment methods
          example: [bank]
        bestFor:
          type: string
          description: Use case description
          example: Bank deposit
        whyThisRanking:
          type: string
          nullable: true
          description: Explanation for ranking
          example: Bank deposit
        limits:
          type: string
          nullable: true
          description: Transfer limits
        corridorPros:
          type: array
          items:
            type: string
          nullable: true
          description: Corridor-specific pros
        corridorCons:
          type: array
          items:
            type: string
          nullable: true
          description: Corridor-specific cons

    ProvidersResponse:
      type: object
      required:
        - data
        - updatedAt
        - corridor
        - amount
        - method
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderQuote'
        updatedAt:
          type: string
          format: date-time
          description: ISO timestamp of when data was last updated
        corridor:
          type: string
          description: Corridor ID
          example: US-PH-USD-PHP
        amount:
          type: number
          description: Send amount
          example: 1000
        method:
          type: string
          enum: [bank, cash, wallet]
          description: Payment method used
          example: bank
        indices:
          $ref: '#/components/schemas/CorridorIndices'
        indicesReason:
          type: string
          nullable: true
          description: Reason indices are unavailable (if indices is null or suppressed)

    CorridorIndices:
      type: object
      properties:
        teer:
          type: number
          nullable: true
        rvi_bps:
          type: number
          nullable: true
        rci:
          type: number
          nullable: true
        providerCount:
          type: integer
        amount:
          type: number
        midMarketRate:
          type: number
          nullable: true
        weights:
          type: string
        source:
          type: string
          enum: [gold]
        updatedAt:
          type: string
          format: date-time
          nullable: true
        indicesBucket:
          type: integer
        methodProfile:
          type: string
          enum: [standard_bank, standard_card, cash_pickup]
        suppressionFlag:
          type: boolean
        suppressionReason:
          type: string
          nullable: true
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true

    IndicesSeriesPoint:
      type: object
      properties:
        date:
          type: string
          example: 2024-01-15
        teer:
          type: number
          nullable: true
        rci:
          type: number
          nullable: true
        rvi_bps:
          type: number
          nullable: true
        providerCountBinned:
          type: integer
          nullable: true
        providerCount:
          type: integer
          nullable: true
        suppressionFlag:
          type: boolean
        suppressionReason:
          type: string
          nullable: true
        midMarketRate:
          type: number
          nullable: true
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true

    IndicesSeriesResponse:
      type: object
      properties:
        corridorId:
          type: string
          example: US-PH-USD-PHP
        amountBucket:
          type: integer
          example: 500
        methodProfile:
          type: string
          enum: [standard_bank, standard_card, cash_pickup]
        weightingModel:
          type: string
          example: provider_volume
        methodologyVersion:
          type: string
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        dataTier:
          type: integer
          enum: [1, 2]
        cadenceMinutes:
          type: integer
        exportCadenceMinutes:
          type: integer
        collectionCadenceMinutes:
          type: integer
        collectionTier:
          type: string
          enum: [tier_1, tier_2]
        isUsdOrigin:
          type: boolean
        series:
          type: array
          items:
            $ref: '#/components/schemas/IndicesSeriesPoint'
        dataWindow:
          $ref: '#/components/schemas/IndicesDataWindow'

    IndicesLatestResponse:
      type: object
      properties:
        corridorId:
          type: string
          example: US-PH-USD-PHP
        amountBucket:
          type: integer
          example: 500
        methodProfile:
          type: string
          enum: [standard_bank, standard_card, cash_pickup]
        weightingModel:
          type: string
          example: provider_volume
        methodologyVersion:
          type: string
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        dataTier:
          type: integer
          enum: [1, 2]
        cadenceMinutes:
          type: integer
        exportCadenceMinutes:
          type: integer
        collectionCadenceMinutes:
          type: integer
        collectionTier:
          type: string
          enum: [tier_1, tier_2]
        isUsdOrigin:
          type: boolean
        point:
          $ref: '#/components/schemas/IndicesSeriesPoint'

    IndicesDataAvailabilityResponse:
      type: object
      required:
        - corridorId
        - amountBucket
        - methodProfile
        - dataAvailable
        - reason
        - message
        - dataTier
        - cadenceMinutes
        - exportCadenceMinutes
        - collectionCadenceMinutes
        - collectionTier
        - isUsdOrigin
        - dataWindow
      properties:
        corridorId:
          type: string
          example: US-PH-USD-PHP
        amountBucket:
          type: integer
          example: 500
        methodProfile:
          type: string
          enum: [standard_bank, standard_card, cash_pickup]
        dataAvailable:
          type: boolean
          enum: [false]
        reason:
          type: string
          enum: [no_data, corridor_not_tracked, gold_table_empty]
        message:
          type: string
        dataTier:
          type: integer
          enum: [1, 2]
        cadenceMinutes:
          type: integer
        exportCadenceMinutes:
          type: integer
        collectionCadenceMinutes:
          type: integer
        collectionTier:
          type: string
          enum: [tier_1, tier_2]
        isUsdOrigin:
          type: boolean
        dataWindow:
          $ref: '#/components/schemas/IndicesDataWindow'

    IndicesDataWindow:
      type: object
      properties:
        requestedDays:
          type: integer
        availableDays:
          type: integer
          nullable: true
        returnedDays:
          type: integer
        availableStartDate:
          type: string
          nullable: true
        availableEndDate:
          type: string
          nullable: true
        startDate:
          type: string
        endDate:
          type: string
        capped:
          type: boolean

    QuotesResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
        requested_amount:
          type: number
        bucket_used:
          type: integer
        fee_bucket_used:
          type: integer
        approximate:
          type: boolean
        cache:
          type: object
          properties:
            ttl_seconds:
              type: integer
            age_seconds:
              type: integer
              nullable: true
            fresh:
              type: boolean
        refresh:
          type: object
          properties:
            attempted:
              type: boolean
            enqueued:
              type: boolean
            request_id:
              type: string
              nullable: true
            request_ids:
              type: array
              items:
                type: string
            providers:
              type: array
              items:
                type: string
        quotes:
          type: array
          items:
            type: object

    PopularCorridorsResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
        corridors:
          type: array
          items:
            type: object
            properties:
              route:
                type: string
                example: US→PH
              count_24h:
                type: integer
              top_provider:
                type: string
                nullable: true
              fee_range:
                type: string
                nullable: true
              speed_range:
                type: string
                nullable: true
              best_for:
                type: string
                nullable: true
              updated_at:
                type: string
                format: date-time

    MeResponse:
      type: object
      properties:
        success:
          type: boolean
        timestamp:
          type: string
          format: date-time
        user:
          type: object
          properties:
            user_id:
              type: string
            email:
              type: string
        plan:
          type: object
          properties:
            plan_code:
              type: string
              enum: [free, plus, enterprise]
            status:
              type: string
              enum: [active, cancelled, expired]
        entitlements:
          type: object
          properties:
            pulse_access:
              type: string
              enum: [none, full]
            exports_enabled:
              type: boolean
            alerts_max:
              type: integer
              nullable: true
            history_max_days:
              type: integer
              nullable: true
            watchlist_items:
              type: integer
              nullable: true
            api_access:
              type: boolean
            api_tier:
              type: integer
              nullable: true
            api_cadence_hours:
              type: integer
              nullable: true
        usage:
          type: object

    ApiKeyRecord:
      type: object
      properties:
        key_id:
          type: string
        key_prefix:
          type: string
        name:
          type: string
          nullable: true
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    ApiKeyListResponse:
      type: object
      properties:
        success:
          type: boolean
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyRecord'

    ApiKeyCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        api_key:
          $ref: '#/components/schemas/ApiKeyRecord'
        token:
          type: string

    ProviderHealthResponse:
      type: object
      properties:
        provider_id:
          type: string
        summary:
          type: object
          properties:
            corridor_count:
              type: integer
            stale_count:
              type: integer
            ok_count:
              type: integer
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Providers
    description: Provider quotes and comparison endpoints
  - name: Quotes
    description: Raw quote data endpoints
  - name: Corridors
    description: Corridor information endpoints
  - name: User
    description: User account and plan endpoints
  - name: Billing
    description: Billing and subscription endpoints
  - name: Pulse
    description: Pulse analytics endpoints (Plus only)
  - name: Operations
    description: Operational endpoints (Admin only)
  - name: Health
    description: Health check endpoints
  - name: Metrics
    description: Metrics endpoints
