            - errors5xx
            - avgResponseTimeMs
          properties:
            requests:
              type: integer
            errors4xx:
              type: integer
            errors5xx:
              type: integer
            avgResponseTimeMs:
              type: integer
              nullable: true
        byEndpoint:
          type: array
          items:
            type: object
            required:
              - endpoint
              - requests
              - avgResponseTimeMs
            properties:
              endpoint:
                type: string
              requests:
                type: integer
              avgResponseTimeMs:
                type: integer
                nullable: true
        byDay:
          type: array
          items:
            type: object
            required:
              - day
              - requests
              - errors4xx
              - errors5xx
            properties:
