                    deliveredAmount:
                      type: number
                    totalCost:
                      type: number
                    totalCostBps:
                      type: number
                    fee:
                      type: number
                    markupBps:
                      type: number
                    speed:
                      type: string
                    winRate:
                      type: number
                    reliability:
                      type: number
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/pulse/method-coverage:
    get:
      summary: Pulse method coverage
      description: Returns method coverage for a corridor (requires Pulse Pro (Enterprise))
      tags:
        - Pulse
      security:
        - bearerAuth: []
      parameters:
        - name: corridor
          in: query
          required: false
          schema:
            type: string
          description: Corridor slug (e.g., us-ph or usd-php)
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            example: 30d
        - name: range
          in: query
          required: false
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
        - name: payin
          in: query
          required: false
          schema:
            type: string
        - name: payout
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Method coverage rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    provider:
                      type: string
                    bank:
                      type: boolean
                    cash:
                      type: boolean
                    wallet:
                      type: boolean
                    card:
                      type: boolean
                    speed:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/{provider}/health:
    get:
      summary: Provider health check (Admin only)
      description: Returns health status for a specific provider
      tags:
        - Operations
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [remitly, wise, worldremit, westernunion, xe]
      responses:
        '200':
          description: Provider health data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/indices/health:
    get:
      summary: Indices readiness health (Admin only)
      description: Returns Tier-0 indices readiness summary and reasons if degraded.
      tags:
        - Operations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Indices readiness summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, error]
                  timestamp:
                    type: string
                    format: date-time
                  summary:
                    type: object
                    properties:
                      corridors_expected:
                        type: integer
                      corridors_observed:
                        type: integer
                      corridors_missing:
                        type: integer
                      available_ratio:
                        type: number
                        format: float
                      suppressed_ratio:
                        type: number
                        format: float
                      min_provider_count:
                        type: integer
                        nullable: true
                      weight_confidence_p10:
                        type: number
                        format: float
                        nullable: true
                      latest_date:
                        type: string
                        nullable: true
                      amount_bucket:
                        type: integer
                      method_profile:
                        type: string
                  reasons:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /healthz:
    get:
      summary: Health check
      description: Basic health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: Readiness check
      description: Checks if service is ready to accept traffic (database connectivity)
      tags:
        - Health
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready

  /metrics:
    get:
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics
      tags:
        - Metrics
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase Auth
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Route-scoped API key for supported retail user and institutional consumers. Unsupported routes fail with `403 api_key_route_not_allowed`.

  schemas:
    ProviderQuote:
      type: object
      required:
        - id
        - name
        - fee
        - marginPct
        - fxRate
        - recipientGets
        - delivery
        - reliability
        - methods
        - bestFor
      properties:
        id:
          type: string
          description: Provider slug
          example: remitly
        providerId:
          type: string
          description: Provider ID (canonical)
          example: westernunion
        name:
          type: string
          description: Provider display name
          example: Remitly
        logoUrl:
          type: string
          format: uri
          nullable: true
          example: /logos/remitly.svg
        fee:
          type: number
          description: Total fee in send currency
          example: 1.99
        marginPct:
          type: number
          description: FX markup percentage vs mid-market rate
          example: 0.4
        fxRate:
          type: number
          description: Exchange rate (send currency → receive currency)
          example: 56.5
        recipientGets:
          type: number
          description: Amount recipient receives in receive currency
          example: 56500
        delivery:
          type: string
          description: Human-readable delivery time
          example: Same day
        reliability:
          type: number
          description: Reliability score (0-1)
          minimum: 0
          maximum: 1
          example: 0.91
        methods:
          type: array
          items:
            type: string
            enum: [bank, cash, wallet]
          description: Available payment methods
          example: [bank]
        bestFor:
          type: string
          description: Use case description
          example: Bank deposit
        whyThisRanking:
          type: string
          nullable: true
          description: Explanation for ranking
          example: Bank deposit
        limits:
          type: string
          nullable: true
          description: Transfer limits
        corridorPros:
          type: array
          items:
            type: string
          nullable: true
          description: Corridor-specific pros
        corridorCons:
          type: array
          items:
            type: string
          nullable: true
          description: Corridor-specific cons

    ProvidersResponse:
      type: object
      required:
        - data
        - updatedAt
        - corridor
        - amount
        - method
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderQuote'
        updatedAt:
          type: string
          format: date-time
          description: ISO timestamp of when data was last updated
        corridor:
          type: string
          description: Corridor ID
          example: US-PH-USD-PHP
        amount:
          type: number
          description: Send amount
          example: 1000
        method:
          type: string
          enum: [bank, cash, wallet]
          description: Payment method used
          example: bank
        indices:
          $ref: '#/components/schemas/CorridorIndices'
        indicesReason:
          type: string
          nullable: true
          description: Reason indices are unavailable (if indices is null or suppressed)

    CorridorIndices:
      type: object
      properties:
        teer:
          type: number
          nullable: true
        rvi_bps:
          type: number
          nullable: true
        rci:
          type: number
          nullable: true
        providerCount:
          type: integer
        amount:
          type: number
        midMarketRate:
          type: number
          nullable: true
        weights:
          type: string
        source:
          type: string
          enum: [gold]
        updatedAt:
          type: string
          format: date-time
          nullable: true
        indicesBucket:
          type: integer
        methodProfile:
          type: string
          enum: [standard_bank, standard_card, cash_pickup]
        suppressionFlag:
          type: boolean
        suppressionReason:
          type: string
          nullable: true
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true

    IndicesSeriesPoint:
      type: object
      properties:
        date:
          type: string
          example: 2024-01-15
        teer:
          type: number
          nullable: true
        rci:
          type: number
          nullable: true
        rvi_bps:
          type: number
          nullable: true
        providerCountBinned:
          type: integer
          nullable: true
        providerCount:
          type: integer
          nullable: true
        suppressionFlag:
          type: boolean
        suppressionReason:
          type: string
          nullable: true
        midMarketRate:
          type: number
          nullable: true
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true

    IndicesSeriesResponse:
      type: object
      properties:
        corridorId:
          type: string
          example: US-PH-USD-PHP
        amountBucket:
          type: integer
          example: 500
        methodProfile:
          type: string
