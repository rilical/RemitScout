openapi: 3.0.3
info:
  title: Remit-Scout API
  version: 1.0.0
  description: |
    Remit-Scout API for comparing money transfer providers and accessing remittance data.
    
    ## Authentication
    - Public endpoints: Rate-limited by IP
    - Protected endpoints: Require JWT Bearer token
    
    ## Rate Limiting
    - Public: 100 requests per window (default 1 minute)
    - Authenticated: 500 requests per window
    
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.remit-scout.com
    description: Production

paths:
  /api/providers:
    get:
      summary: Get provider quotes for a corridor
      description: |
        Returns aggregated provider quotes with metadata (scores, logos, affiliate links) 
        for a given corridor and payment method. This is the main endpoint for the frontend 
        comparison page.
      tags:
        - Providers
      parameters:
        - name: from
          in: query
          description: Source country code (ISO 3166-1 alpha-2)
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: US
        - name: to
          in: query
          description: Destination country code (ISO 3166-1 alpha-2)
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: PH
        - name: amount
          in: query
          description: Send amount
          required: false
          schema:
            type: number
            minimum: 50
            example: 1000
        - name: method
          in: query
          description: Payment method preference
          required: false
          schema:
            type: string
            enum: [bank, cash, wallet]
            default: bank
        - name: corridor_id
          in: query
          description: Full corridor ID (e.g., "US-PH-USD-PHP")
          required: false
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Pre-computed amount bucket
          required: false
          schema:
            type: integer
        - name: payin
          in: query
          description: Canonical payin method (e.g., "bank_transfer")
          required: false
          schema:
            type: string
        - name: payout
          in: query
          description: Canonical payout method (e.g., "bank_deposit")
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provider quotes response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/indices/series:
    get:
      summary: Get index series for a corridor
      description: |
        Returns TEER, RCI, and RVI time series derived from B2B queue quotes.
      tags:
        - Indices
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: X-API-Key
          in: header
          description: Enterprise API key (optional when using bearer auth)
          required: false
          schema:
            type: string
        - name: corridor_id
          in: query
          description: Full corridor ID (e.g., "US-PH-USD-PHP")
          required: true
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Amount bucket
          required: false
          schema:
            type: integer
            example: 500
        - name: method_profile
          in: query
          description: Method profile
          required: false
          schema:
            type: string
            enum: [standard_bank, standard_card, cash_pickup]
        - name: days
          in: query
          description: Number of days to return
          required: false
          schema:
            type: integer
            example: 30
      responses:
        '200':
          description: Index series response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IndicesSeriesResponse'
                  - $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Corridor not tracked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/indices/latest:
    get:
      summary: Get latest index point for a corridor
      description: |
        Returns the most recent TEER, RCI, and RVI point for a corridor.
      tags:
        - Indices
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: X-API-Key
          in: header
          description: Enterprise API key (optional when using bearer auth)
          required: false
          schema:
            type: string
        - name: corridor_id
          in: query
          description: Full corridor ID (e.g., "US-PH-USD-PHP")
          required: true
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Amount bucket
          required: false
          schema:
            type: integer
            example: 500
        - name: method_profile
          in: query
          description: Method profile
          required: false
          schema:
            type: string
            enum: [standard_bank, standard_card, cash_pickup]
      responses:
        '200':
          description: Latest index point response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IndicesLatestResponse'
                  - $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Corridor not tracked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/quotes/current:
    get:
      summary: Get current quotes for a corridor
      description: |
        Returns raw normalized quotes from the database for a specific corridor, 
        amount bucket, and payment methods. More technical endpoint than /api/providers.
      tags:
        - Quotes
      parameters:
        - name: corridor_id
          in: query
          required: true
          schema:
            type: string
            example: US-PH-USD-PHP
        - name: amount_bucket
          in: query
          required: false
          schema:
            type: integer
            example: 1000
        - name: amount
          in: query
          required: false
          schema:
            type: number
            example: 1000
        - name: payin
          in: query
          required: true
          schema:
            type: string
            example: bank_transfer
        - name: payout
          in: query
          required: true
          schema:
            type: string
            example: bank_deposit
        - name: live
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Quotes response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/popular-corridors:
    get:
      summary: Get popular corridors
      description: Returns the most popular remittance corridors based on recent searches
      tags:
        - Corridors
      responses:
        '200':
          description: Popular corridors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopularCorridorsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/bank-vs-specialist:
    get:
      summary: Bank vs specialist comparison (US to Mexico)
      description: |
        Returns a fixed US-MX comparison between the best specialist provider and Wells Fargo.
        The corridor is fixed to US-MX-USD-MXN; any from/to params are ignored.
      tags:
        - Discovery
      parameters:
        - name: amount
          in: query
          description: Send amount (defaults to 500)
          required: false
          schema:
            type: number
            minimum: 1
            example: 500
        - name: from
          in: query
          description: Ignored (corridor is fixed to US-MX)
          required: false
          schema:
            type: string
        - name: to
          in: query
          description: Ignored (corridor is fixed to US-MX)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Bank vs specialist comparison response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      corridor:
                        type: object
                        properties:
                          from:
                            type: string
                          to:
                            type: string
                          sendCurrency:
                            type: string
                          recvCurrency:
                            type: string
                      midRate:
                        type: number
                      bank:
                        type: object
                        properties:
                          name:
                            type: string
                          logoUrl:
                            type: string
                            nullable: true
                          fee:
                            type: number
                          marginPct:
                            type: number
                          fxRate:
                            type: number
                          recipientGets:
                            type: number
                          delivery:
                            type: string
                          reliability:
                            type: number
                          methods:
                            type: array
                            items:
                              type: string
                              enum: [bank, cash, wallet]
                          bestFor:
                            type: string
                      top:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          logoUrl:
                            type: string
                            nullable: true
                          fee:
                            type: number
                          marginPct:
                            type: number
                          fxRate:
                            type: number
                          recipientGets:
                            type: number
                          delivery:
                            type: string
                          reliability:
                            type: number
                          methods:
                            type: array
                            items:
                              type: string
                              enum: [bank, cash, wallet]
                          bestFor:
                            type: string
                      updatedAt:
                        type: string
                      savings:
                        type: object
                        properties:
                          amount:
                            type: number
                          recipientGetsDifference:
                            type: number
                          percentage:
                            type: number
                  updatedAt:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Required bank or specialist quote unavailable
        '500':
          $ref: '#/components/responses/InternalError'

  /api/geo:
    get:
      summary: Geolocation lookup
      description: Returns country and currency based on forwarded headers (CloudFront/Cloudflare).
      tags:
        - Discovery
      responses:
        '200':
          description: Geolocation response
          content:
            application/json:
              schema:
                type: object
                properties:
                  countryCode:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  timezone:
                    type: string
                    nullable: true
                  source:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /api/me:
    get:
      summary: Get current user information
      description: Returns user plan, entitlements, and usage information
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/me/api-keys:
    get:
      summary: List enterprise API keys
      description: Returns API keys for the current user (enterprise only)
      tags:
        - API Keys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API keys list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create enterprise API key
      description: Creates a new API key for the current user (enterprise only)
      tags:
        - API Keys
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/me/api-keys/{keyId}/rotate:
    post:
      summary: Rotate an enterprise API key
      description: Rotates the API key token for the given key ID (enterprise only)
      tags:
        - API Keys
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/me/api-keys/{keyId}:
    delete:
      summary: Revoke an enterprise API key
      description: Revokes the API key for the given key ID (enterprise only)
      tags:
        - API Keys
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/billing/checkout-session:
    post:
      summary: Create Stripe checkout session
      description: Creates a Stripe checkout session for upgrading to Plus plan
      tags:
        - Billing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code:
                  type: string
                  enum: [plus]
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/billing/portal:
    get:
      summary: Get Stripe billing portal link
      description: Returns a link to the Stripe customer portal for managing subscriptions
      tags:
        - Billing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/billing/webhook:
    post:
      summary: Stripe webhook handler
      description: Handles Stripe webhook events (internal use only)
      tags:
        - Billing
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/pulse/status:
    get:
      summary: Pulse service status
      description: Check if Pulse service is available (requires Plus entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pulse/corridors:
    get:
      summary: Pulse corridor list
      description: Returns available Pulse corridors (requires Pulse entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Corridor options
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    label:
                      type: string
                    fromFlag:
                      type: string
                    toFlag:
                      type: string
                    fromCode:
                      type: string
                    toCode:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pulse/overview:
    get:
      summary: Pulse overview
      description: Returns Pulse overview tiles and charts (requires Pulse entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      parameters:
        - name: corridor
          in: query
          required: false
          schema:
            type: string
          description: Corridor slug (e.g., us-ph or usd-php)
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            example: 30d
        - name: range
          in: query
          required: false
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
        - name: fundingMethod
          in: query
          required: false
          schema:
            type: string
        - name: payoutMethod
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Pulse overview payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        value:
                          type: string
                        delta:
                          type: string
                        deltaType:
                          type: string
                        deltaLabel:
                          type: string
                        tooltip:
                          type: string
                        chartId:
                          type: string
                        icon:
                          type: string
                  charts:
                    type: array
                    items:
                      type: string
                  lastUpdated:
                    type: string
                    format: date-time
                  corridorName:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pulse/charts/{chartId}:
    get:
      summary: Pulse chart data
      description: Returns chart series for a chart id (requires Pulse entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      parameters:
        - name: chartId
          in: path
          required: true
          schema:
            type: string
        - name: corridor
          in: query
          required: false
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            example: 30d
        - name: range
          in: query
          required: false
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
        - name: fundingMethod
          in: query
          required: false
          schema:
            type: string
        - name: payoutMethod
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Chart payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        color:
                          type: string
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              t:
                                type: number
                              v:
                                type: number
                              label:
                                type: string
                  annotations:
                    type: array
                    items:
                      type: object
                  insight:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pulse/table:
    get:
      summary: Pulse table data
      description: Returns provider table rows (requires Pulse entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      parameters:
        - name: corridor
          in: query
          required: false
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            example: 30d
        - name: range
          in: query
          required: false
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
        - name: fundingMethod
          in: query
          required: false
          schema:
            type: string
        - name: payoutMethod
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Table payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: object
                  rows:
                    type: array
                    items:
                      type: object
                  totalRows:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pulse/hero:
    get:
      summary: Pulse hero chart
      description: Returns hero chart data (requires Pulse entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      parameters:
        - name: corridor
          in: query
          required: false
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
        - name: amount
          in: query
          required: false
          schema:
            type: number
      responses:
        '200':
          description: Hero chart payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: number
                        midMarketRate:
                          type: number
                        bestProviderRate:
                          type: number
                        bestProvider:
                          type: string
                        bankAverageRate:
                          type: number
                        spread:
                          type: number
                        spreadPercent:
                          type: number
                  currentSpread:
                    type: number
                  currentSpreadPercent:
                    type: number
                  bestProvider:
                    type: string
                  lossOn1000:
                    type: number
                  currency:
                    type: string
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/pulse/coverage-summary:
    get:
      summary: Pulse coverage summary
      description: Returns coverage summary (requires Pulse entitlement)
      tags:
        - Pulse
      security:
        - bearerAuth: []
      parameters:
        - name: corridor
          in: query
          required: false
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Coverage summary payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotesInRange:
                    type: integer
                  providersIncluded:
                    type: integer
                  methodsIncluded:
                    type: array
                    items:
                      type: string
                  lastUpdated:
                    type: string
                    format: date-time
        '401':
