        amountBucket:
          type: integer
          example: 500
        methodProfile:
          type: string
          enum: [standard_bank, standard_card, cash_pickup]
        weightingModel:
          type: string
          example: provider_volume
        methodologyVersion:
          type: string
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        dataTier:
          type: integer
