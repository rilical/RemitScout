openapi: 3.0.3
info:
  title: Remit-Scout API
  version: 1.0.0
  description: |
    Remit-Scout API for comparing money transfer providers and accessing remittance data.
    
    ## Authentication
    - Public endpoints: Rate-limited by IP
    - Protected endpoints: Require JWT Bearer token unless the route explicitly supports `X-API-Key`
    - `X-API-Key` is route-scoped and authoritative when present
      - Retail user API keys are created under `/api/v1/me/api-keys` and can access only explicit retail API-key routes, subject to scope checks
      - Institutional API keys are admin-managed, corridor-aware, and limited to explicit B2B routes
      - Presenting `X-API-Key` on an unsupported route returns `403 api_key_route_not_allowed`
      - Invalid keys return `401 invalid_api_key`; revoked retail keys return `401 revoked_api_key`
    
    ## Rate Limiting
    - Public: 100 requests per window (default 1 minute)
    - Authenticated: 500 requests per window
    
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.remit-scout.com
    description: Production

paths:
  /api/v1/providers:
    get:
      summary: Get provider quotes for a corridor
      description: |
        Returns aggregated provider quotes with metadata (scores, logos, affiliate links) 
        for a given corridor and payment method. This is the main endpoint for the frontend 
        comparison page.
      tags:
        - Providers
      parameters:
        - name: from
          in: query
          description: Source country code (ISO 3166-1 alpha-2)
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: US
        - name: to
          in: query
          description: Destination country code (ISO 3166-1 alpha-2)
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: PH
        - name: amount
          in: query
          description: Send amount
          required: false
          schema:
            type: number
            minimum: 50
            example: 1000
        - name: method
          in: query
          description: Payment method preference
          required: false
          schema:
            type: string
            enum: [bank, cash, wallet]
            default: bank
        - name: corridor_id
          in: query
          description: Full corridor ID (e.g., "US-PH-USD-PHP")
          required: false
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Pre-computed amount bucket
          required: false
          schema:
            type: integer
        - name: payin
          in: query
          description: Canonical payin method (e.g., "bank_transfer")
          required: false
          schema:
            type: string
        - name: payout
          in: query
          description: Canonical payout method (e.g., "bank_deposit")
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Provider quotes response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/indices/series:
    get:
      summary: Get index series for a corridor
      description: |
        Returns TEER, RCI, and RVI time series derived from B2B queue quotes.
        Supports bearer JWT, retail user API keys with `indices:read`, and institutional API keys with `indices:read`.
        Institutional API-key requests remain corridor-scoped and fail closed on unsupported routes or scopes.
      tags:
        - Indices
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: X-API-Key
          in: header
          description: Retail user or institutional API key with `indices:read` (optional when using bearer auth)
          required: false
          schema:
            type: string
        - name: corridor_id
          in: query
          description: Full corridor ID (e.g., "US-PH-USD-PHP")
          required: true
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Amount bucket
          required: false
          schema:
            type: integer
            example: 500
        - name: method_profile
          in: query
          description: Method profile
          required: false
          schema:
            type: string
            enum: [standard_bank, standard_card, cash_pickup]
        - name: days
          in: query
          description: Number of days to return
          required: false
          schema:
            type: integer
            example: 30
      responses:
        '200':
          description: Index series response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IndicesSeriesResponse'
                  - $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Corridor not tracked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/indices/latest:
    get:
      summary: Get latest index point for a corridor
      description: |
        Returns the most recent TEER, RCI, and RVI point for a corridor.
        Supports bearer JWT, retail user API keys with `indices:read`, and institutional API keys with `indices:read`.
        Institutional API-key requests remain corridor-scoped and fail closed on unsupported routes or scopes.
      tags:
        - Indices
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: X-API-Key
          in: header
          description: Retail user or institutional API key with `indices:read` (optional when using bearer auth)
          required: false
          schema:
            type: string
        - name: corridor_id
          in: query
          description: Full corridor ID (e.g., "US-PH-USD-PHP")
          required: true
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Amount bucket
          required: false
          schema:
            type: integer
            example: 500
        - name: method_profile
          in: query
          description: Method profile
          required: false
          schema:
            type: string
            enum: [standard_bank, standard_card, cash_pickup]
      responses:
        '200':
          description: Latest index point response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IndicesLatestResponse'
                  - $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Corridor not tracked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicesDataAvailabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/compliance/status:
    get:
      summary: Get institutional compliance and launch-readiness status
      description: |
        Returns public-facing compliance metadata and the institutional data-maturity gate.
        This surface is used by the institutional waitlist pages and does not require authentication.
      tags:
        - Institutions
      responses:
        '200':
          description: Compliance and launch-readiness status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceStatusResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/usage:
    get:
      summary: Get institutional API usage analytics
      description: |
        Returns per-client request totals, endpoint distribution, and daily request counts
        for an institutional API key.
        Supports institutional API keys with `indices:read`. Bearer-authenticated users without
        an institutional client context receive `403 institutional_only`.
      tags:
        - Institutions
      security:
        - apiKeyAuth: []
        - bearerAuth: []
      parameters:
        - name: X-API-Key
          in: header
          description: Institutional API key with `indices:read`
          required: false
          schema:
            type: string
        - name: days
          in: query
          description: Number of trailing days to include
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        '200':
          description: Institutional API usage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalUsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/corridors/{corridorId}/coverage:
    get:
      summary: Get corridor provider coverage for institutional monitoring
      description: |
        Returns the recent provider freshness view and publishability gate for a corridor.
        Supports bearer JWT and institutional API keys with `corridors:read`.
      tags:
        - Institutions
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: X-API-Key
          in: header
          description: Institutional API key with `corridors:read`
          required: false
          schema:
            type: string
        - name: corridorId
          in: path
          description: Full corridor ID (for example `US-MX-USD-MXN`)
          required: true
          schema:
            type: string
        - name: amount_bucket
          in: query
          description: Amount bucket to evaluate
          required: false
          schema:
            type: integer
            minimum: 1
            example: 500
      responses:
        '200':
          description: Corridor coverage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorridorCoverageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/quotes/current:
    get:
      summary: Get current quotes for a corridor
      description: |
        Returns raw normalized quotes from the database for a specific corridor, 
        amount bucket, and payment methods. More technical endpoint than /api/v1/providers.
      tags:
        - Quotes
      parameters:
        - name: corridor_id
          in: query
          required: true
          schema:
            type: string
            example: US-PH-USD-PHP
        - name: amount_bucket
          in: query
          required: false
          schema:
            type: integer
            example: 1000
        - name: amount
          in: query
          required: false
          schema:
            type: number
            example: 1000
        - name: payin
          in: query
          required: true
          schema:
            type: string
            example: bank_transfer
        - name: payout
          in: query
          required: true
          schema:
            type: string
            example: bank_deposit
        - name: live
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Quotes response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/popular-corridors:
    get:
      summary: Get popular corridors
      description: Returns the most popular remittance corridors based on recent searches
      tags:
        - Corridors
      responses:
        '200':
          description: Popular corridors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopularCorridorsResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/bank-vs-specialist:
    get:
      summary: Bank vs specialist comparison
      description: |
        Returns a dynamic bank-vs-specialist comparison for the requested corridor.
        If `from`/`to` are omitted, defaults to US-MX (USD-MXN).
      tags:
        - Discovery
      parameters:
        - name: amount
          in: query
          description: Send amount (defaults to 500)
          required: false
          schema:
            type: number
            minimum: 1
            example: 500
        - name: from
          in: query
          description: Source country ISO 3166-1 alpha-2 code (defaults to US)
          required: false
          schema:
            type: string
        - name: to
          in: query
          description: Destination country ISO 3166-1 alpha-2 code (defaults to MX)
          required: false
          schema:
            type: string
        - name: fromCurrency
          in: query
          description: Optional override for source currency (ISO 4217)
          required: false
          schema:
            type: string
            minLength: 3
            maxLength: 3
        - name: toCurrency
          in: query
          description: Optional override for destination currency (ISO 4217)
          required: false
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        '200':
          description: Bank vs specialist comparison response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      corridor:
                        type: object
                        properties:
                          from:
                            type: string
                          to:
                            type: string
                          sendCurrency:
                            type: string
                          recvCurrency:
                            type: string
                      midRate:
                        type: number
                      bank:
                        type: object
                        properties:
                          name:
                            type: string
                          logoUrl:
                            type: string
                            nullable: true
                          fee:
                            type: number
                          marginPct:
                            type: number
                          fxRate:
                            type: number
                          recipientGets:
                            type: number
                          delivery:
                            type: string
                          reliability:
                            type: number
                          methods:
                            type: array
                            items:
                              type: string
                              enum: [bank, cash, wallet]
                          bestFor:
                            type: string
                      top:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          logoUrl:
                            type: string
                            nullable: true
                          fee:
                            type: number
                          marginPct:
                            type: number
                          fxRate:
                            type: number
                          recipientGets:
                            type: number
                          delivery:
                            type: string
                          reliability:
                            type: number
                          methods:
                            type: array
                            items:
                              type: string
                              enum: [bank, cash, wallet]
                          bestFor:
                            type: string
                      updatedAt:
                        type: string
                      savings:
                        type: object
                        properties:
                          amount:
                            type: number
                          recipientGetsDifference:
                            type: number
                          percentage:
                            type: number
                  updatedAt:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Required bank or specialist quote unavailable
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/geo:
    get:
      summary: Geolocation lookup
      description: Returns country and currency based on forwarded headers (CloudFront/Cloudflare).
      tags:
        - Discovery
      responses:
        '200':
          description: Geolocation response
          content:
            application/json:
              schema:
                type: object
                properties:
                  countryCode:
                    type: string
                  country:
                    type: string
                  currency:
                    type: string
                  timezone:
                    type: string
                    nullable: true
                  source:
                    type: string
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      summary: Get current user information
      description: |
        Returns raw purchased plan state, effective capability state, billing summary,
        entitlements, and usage. `plan` is the stored purchased tier. `plan_effective`
        is the canonical capability plan after lifecycle fallback and admin overrides.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/api-keys:
    get:
      summary: List retail enterprise user API keys
      description: |
        Returns retail user API keys for the current authenticated enterprise user.
        Institutional API keys are provisioned through admin institutional client flows and are not listed here.
        Inactive paid plans fail with canonical `plan_inactive` detail fields.
      tags:
        - API Keys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API keys list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create retail enterprise user API key
      description: |
        Creates a retail user API key for the current authenticated enterprise user.
        Supported scopes are `indices:read`, `corridors:read`, and `exports:read`.
        Unknown scopes and legacy values such as `tier:1` are rejected.
        Inactive paid plans fail with canonical `plan_inactive` detail fields.
      tags:
        - API Keys
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  description: Optional retail API-key scopes. Defaults to `indices:read` and `corridors:read`.
                  type: array
                  items:
                    type: string
                    enum: [indices:read, corridors:read, exports:read]
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/api-keys/{keyId}/rotate:
    post:
      summary: Rotate a retail enterprise user API key
      description: Rotates the retail user API key token for the given key ID. Requires active Enterprise API access.
      tags:
        - API Keys
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/api-keys/{keyId}:
    delete:
      summary: Revoke a retail enterprise user API key
      description: Revokes the retail user API key for the given key ID. Requires active Enterprise API access.
      tags:
        - API Keys
      security:
        - bearerAuth: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/export-jobs:
    get:
      summary: List enterprise export jobs
      description: Returns bulk export jobs for the current user. Requires active Enterprise bulk export access.
      tags:
        - Exports
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Export jobs list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeExportJobsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create enterprise export job
      description: |
        Creates a bulk export job for the current user. TEER / RCI / RVI exports
        require `indices_exports_enabled` in addition to bulk export access.
      tags:
        - Exports
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobType:
                  type: string
                  enum: [history, watchlist, alerts, all, indices]
                format:
                  type: string
                  enum: [csv, pdf]
                dateFrom:
                  type: string
                dateTo:
                  type: string
                corridorIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeExportJobCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/export-jobs/{jobId}/download:
    get:
      summary: Download enterprise export artifact
      description: Returns a signed download URL for a completed export job.
      tags:
        - Exports
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Export download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Export is not ready yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Export artifact has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/billing/checkout-session:
    post:
      summary: Create Stripe checkout session
      description: Creates a Stripe checkout session for upgrading to Plus plan
      tags:
        - Billing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_code:
                  type: string
                  enum: [plus, enterprise]
                billing_interval:
                  type: string
                  enum: [month, year]
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  session_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already has an active or trialing Plus subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/billing/portal:
    get:
      summary: Get Stripe billing portal link
      description: |
        Returns a link to the Stripe customer portal for managing subscriptions.
        If no Stripe customer is attached to the account, the route returns `customer_not_found`.
      tags:
        - Billing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/billing/history:
    get:
      summary: Get billing history
      description: Returns up to 24 Stripe invoices for the current account.
      tags:
        - Billing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Billing history response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/billing/verify-session:
    post:
