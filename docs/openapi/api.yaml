        weightingModel:
          type: string
          example: provider_volume
        methodologyVersion:
          type: string
        weightConfidence:
          type: number
          nullable: true
        weightWindowDays:
          type: integer
          nullable: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true
        dataTier:
          type: integer
          enum: [1, 2]
        cadenceMinutes:
          type: integer
