          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true

    ApiKeyListResponse:
      type: object
      properties:
        success:
          type: boolean
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyRecord'

    ApiKeyCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        api_key:
          $ref: '#/components/schemas/ApiKeyRecord'
        token:
          type: string

    ProviderHealthResponse:
      type: object
      properties:
        provider_id:
          type: string
        summary:
          type: object
          properties:
            corridor_count:
              type: integer
            stale_count:
              type: integer
            ok_count:
              type: integer
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        details:
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              properties:
                plan_failure:
                  type: string
                required_plan:
                  $ref: '#/components/schemas/PlanCode'
                capability:
                  type: string
                lifecycle_state:
                  $ref: '#/components/schemas/PlanLifecycleState'
                recovery_action:
                  $ref: '#/components/schemas/PlanRecoveryAction'
                purchased_plan:
                  $ref: '#/components/schemas/PlanCode'
                effective_plan:
                  $ref: '#/components/schemas/PlanCode'
              additionalProperties: true

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - Missing or invalid authentication. API-key callers may receive `invalid_api_key` or `revoked_api_key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - Insufficient permissions. API-key callers may receive `api_key_route_not_allowed`, `insufficient_scope`, `corridor_not_allowed`, `institutional_inactive`, or `institutional_only`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Providers
    description: Provider quotes and comparison endpoints
  - name: Quotes
    description: Raw quote data endpoints
  - name: Corridors
    description: Corridor information endpoints
  - name: User
    description: User account and plan endpoints
  - name: Billing
    description: Billing and subscription endpoints
  - name: Exports
    description: User and enterprise export endpoints
  - name: Institutions
    description: Institutional launch, usage, and corridor coverage endpoints
  - name: Pulse
    description: Pulse analytics endpoints (Plus only)
  - name: Operations
    description: Operational endpoints (Admin only)
  - name: Health
    description: Health check endpoints
  - name: Metrics
    description: Metrics endpoints
