# Airlock workflow configuration
# Documentation: https://github.com/airlock-hq/airlock

name: Main Pipeline

on:
  push:
    branches: ['**']

jobs:
  default:
    name: Lint, Test & Deploy
    steps:
      # Rebase onto upstream to handle drift
      - name: rebase
        uses: airlock-hq/airlock/defaults/rebase@main

      # Run linters directly (skip agent-based lint due to codex --output-schema incompatibility)
      - name: lint
        run: |
          echo "Running ESLint (backend)..."
          cd backend && pnpm lint --max-warnings=0 2>&1 || true
          echo "Running ESLint (frontend)..."
          cd ../frontend && pnpm lint 2>&1 || true
          echo "Running TypeScript type-check (backend)..."
          cd ../backend && pnpm build 2>&1
          echo "Lint stage complete."

      # Commit auto-fix patches and lock the worktree
      - name: freeze
        run: airlock exec freeze

      # Run tests
      - name: test
        run: |
          echo "Running backend tests..."
          cd backend && pnpm test 2>&1
          echo "Tests complete."

      # Critique the code change for bugs, risks, and simplification opportunities
      - name: critique
        uses: airlock-hq/airlock/defaults/critique@main

      # Push changes to upstream (pauses for user approval first)
      - name: push
        uses: airlock-hq/airlock/defaults/push@main
        require-approval: true

      # Create pull/merge request
      - name: create-pr
        uses: airlock-hq/airlock/defaults/create-pr@main
