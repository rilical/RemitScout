coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 1%
      backend_shared:
        target: 85%
        threshold: 1%
        flags:
          - backend_shared
      backend_plane_a:
        target: 85%
        threshold: 1%
        flags:
          - backend_plane_a
      backend_plane_c:
        target: 85%
        threshold: 1%
        flags:
          - backend_plane_c
      backend_billing:
        target: 85%
        threshold: 1%
        flags:
          - backend_billing
    patch:
      default:
        target: 80%
        threshold: 2%
    changes: false
ignore:
  - "docs/**"
  - "**/*.md"
flags:
  backend_shared:
    paths:
      - backend/shared
  backend_plane_a:
    paths:
      - backend/plane-a
  backend_plane_c:
    paths:
      - backend/plane-c
  backend_billing:
    paths:
      - backend/plane-a/src/routes/billing
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
