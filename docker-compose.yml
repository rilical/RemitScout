version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remit-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-remit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - remit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remit} -d ${POSTGRES_DB:-remit}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-remit-local-dev}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - remit-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-remit-local-dev} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  remit-postgres:
  remit-redis:
