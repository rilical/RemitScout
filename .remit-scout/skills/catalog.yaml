    risk_tier: 1

  - skill_id: "provider.scaffold.local"
    purpose: "Scaffold a new provider (folder + registry + catalog + config defaults)."
    executor: "local_codex"
    command: "pnpm -C backend provider:scaffold"
    required_inputs:
      provider_id: "string"
      display_name: "string"
      supports_b2b: "0|1"
      supports_b2c: "0|1"
    outputs:
      stdout: "text"
    risk_tier: 1
