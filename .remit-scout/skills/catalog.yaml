version: 1
skills:
  - skill_id: "probe.provider.github_actions"
    purpose: "Run provider probe in GitHub Actions and upload probe-results.json."
    executor: "github_actions"
    workflow: ".github/workflows/probe-health-checks.yml"
    required_inputs:
      provider_id: "string"
    outputs:
      artifact: "probe-<provider_id>-results"
      file: "probe-results.json"
    risk_tier: 1

  - skill_id: "probe.provider.aws_scheduled"
    purpose: "Provider probe runs on AWS via scheduled Lambda/EventBridge (read-only evidence + metrics)."
    executor: "aws_scheduled"
    job: "infrastructure/cdk/lib/scheduled-jobs.ts#provider-probe-lambda"
    required_inputs:
      provider_id: "string"
    outputs:
      metrics_namespace: "RemitScout/Probes"
    risk_tier: 1

  - skill_id: "probe.cache_ttl.github_actions"
    purpose: "Run the cache TTL probe to validate volatility TTL mapping."
    executor: "github_actions"
    workflow: ".github/workflows/probe-health-checks.yml"
    required_inputs:
      corridors_csv: "string"
    outputs:
      stdout: "json"
    risk_tier: 1

  - skill_id: "evidence.provider_health.github_actions"
    purpose: "Generate bounded provider health evidence (DB-first) as evidence.json artifact."
    executor: "github_actions"
    workflow: ".github/workflows/evidence-provider-health.yml"
    required_inputs:
      env: "dev|staging|prod"
      case_id: "string"
      dispatch_id: "string"
      provider_id: "string"
      window_hours: "number"
    outputs:
      artifact: "evidence-<case_id>-<dispatch_id>-provider-health"
      file: "evidence.json"
    risk_tier: 1

  - skill_id: "evidence.queue_backlog.github_actions"
    purpose: "Generate bounded queue backlog evidence (SQS stats + oldest age + DLQ) as evidence.json artifact."
    executor: "github_actions"
    workflow: ".github/workflows/evidence-queue-backlog.yml"
    required_inputs:
      env: "dev|staging|prod"
      case_id: "string"
      dispatch_id: "string"
      queue_kind: "string"
    outputs:
      artifact: "evidence-<case_id>-<dispatch_id>-queue-backlog"
      file: "evidence.json"
    risk_tier: 1

  - skill_id: "evidence.http_latency.github_actions"
    purpose: "Generate bounded HTTP latency evidence (p50/p95/max + error/timeout rates) as evidence.json artifact."
    executor: "github_actions"
    workflow: ".github/workflows/evidence-http-latency.yml"
    required_inputs:
      env: "dev|staging|prod"
      case_id: "string"
      dispatch_id: "string"
      target_url: "string"
      requests: "number"
      timeout_ms: "number"
    outputs:
      artifact: "evidence-<case_id>-<dispatch_id>-http-latency"
      file: "evidence.json"
    risk_tier: 1

  - skill_id: "evidence.indices_readiness.github_actions"
