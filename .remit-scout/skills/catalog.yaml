  - skill_id: "forensics.corridor_provider.local"
    purpose: "Explain why a provider is missing for a corridor (rights/capability/quotes/refresh)."
    executor: "local_codex"
    command: "pnpm -C backend corridor:forensics"
    required_inputs:
      corridor_id: "string"
      amount: "number"
      method: "string"
    outputs:
      stdout: "json"
    risk_tier: 0

  - skill_id: "observe.dev.local"
    purpose: "Run dev observation checks (stack/alarms/queues/logs) for a time window."
    executor: "local_codex"
    command: "bash ops/observe-dev.sh"
    required_inputs:
      session_file: "string"
    outputs:
      stdout: "text"
    risk_tier: 0

  - skill_id: "manual.human_triage"
    purpose: "Human review/triage required (confirm severity, scope, and next action)."
    executor: "manual"
    outputs:
      decision: "comment/approval"
    risk_tier: 0

  - skill_id: "evidence.no_quotes_audit.github_actions"
    purpose: "Generate bounded no-quotes audit evidence (Plane A /providers exclusions) as evidence.json artifact."
    executor: "github_actions"
    workflow: ".github/workflows/evidence-no-quotes.yml"
    required_inputs:
      env: "dev|staging|prod"
      case_id: "string"
      dispatch_id: "string"
      plane_a_base_url: "string"
      send_currencies: "string"
      method: "string"
      amount: "number"
      refresh: "number"
      max_corridors: "number"
