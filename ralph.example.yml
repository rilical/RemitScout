# Ralph Orchestrator Configuration (template)
#
# This repository ignores `ralph.yml` (local-only). To use Ralph consistently
# across dev machines/CI, copy this file to `ralph.yml` and adjust as needed:
#
#   cp ralph.example.yml ralph.yml
#
# Docs: https://github.com/mikeyobrien/ralph-orchestrator

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 100

hats:
  refactorer:
    name: "Refactorer"
    description: "Executes a single atomic refactor step safely."
    triggers: ["refactor.task"]
    publishes: ["refactor.done", "refactor.blocked"]
    default_publishes: refactor.done
    instructions: |
      ## REFACTORER MODE

      Execute ONE refactoring step safely.

      Publish `refactor.done` when complete, otherwise `refactor.blocked`.

  verifier:
    name: "Verifier"
    description: "Verifies refactoring preserved behavior via tests and checks."
    triggers: ["refactor.done"]
    publishes: ["verify.passed", "verify.failed"]
    default_publishes: verify.passed
    instructions: |
      ## VERIFIER MODE (Node/TypeScript)

      Goal: Always emit a structured JSON payload that includes quality fields.

      Hard requirement: the payload MUST always include all `quality` keys
      (`tests`, `coverage`, `lint`, `audit`, `mutation`, `complexity`) even when
      failing early. If a signal is unavailable, set that field to `"n/a"`.

      ### Emitting `verify.*` events (REQUIRED)
      Do NOT call `ralph emit verify.passed` / `ralph emit verify.failed` directly.
      That is the #1 source of drift (missing `quality.*` keys).

      Always emit via the repo helper, which normalizes the payload and fills
      missing signals with `"n/a"`:

      ```bash
      node scripts/verifier/emit-verify.mjs verify.passed --json '{"quality":{"tests":{"status":"pass","command":"pnpm -C backend test"}}}'
      ```

      Notes:
      - You may pass a *partial* `quality` object; the helper will add missing keys.
      - Use `--dry-run` to print the normalized JSON payload.

      ### Suggested commands (repo default)
      
      This repo is a Node/TS monorepo, and backend lint currently has known debt.
      To avoid blocking *frontend* audit/proof iterations on unrelated backend
      ESLint errors, default to a **frontend-scoped** verification gate:

      - Lint: `pnpm -C frontend exec eslint . -f json`
      - Typecheck: `pnpm -C frontend type-check`
      - Tests: `pnpm -C frontend test`

      For convenience (and to standardize payloads), you can run all three and
      get a JSON payload with lint counts via:

      ```bash
      node scripts/verifier/run-frontend-quality.mjs
      ```

      Default behavior is **diff-scoped** (only lints/typechecks changed
      `frontend/` files in the last commit). To force a full frontend pass:

      ```bash
      node scripts/verifier/run-frontend-quality.mjs --full
      ```

      To include unit tests (slower), add:

      ```bash
      node scripts/verifier/run-frontend-quality.mjs --run-unit-tests
      ```

      To emit the `verify.*` event through the normalizer (recommended):

      ```bash
      node scripts/verifier/run-frontend-quality.mjs --full --run-unit-tests --emit verify.passed
      # or, if checks did not pass
      node scripts/verifier/run-frontend-quality.mjs --full --run-unit-tests --emit verify.failed
      ```
