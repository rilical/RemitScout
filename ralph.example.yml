# Ralph Orchestrator Configuration (template)
#
# This repository ignores `ralph.yml` (local-only). To use Ralph consistently
# across dev machines/CI, copy this file to `ralph.yml` and adjust as needed:
#
#   cp ralph.example.yml ralph.yml
#
# Docs: https://github.com/mikeyobrien/ralph-orchestrator

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 100

hats:
  refactorer:
    name: "Refactorer"
    description: "Executes a single atomic refactor step safely."
    triggers: ["refactor.task"]
    publishes: ["refactor.done", "refactor.blocked"]
    default_publishes: refactor.done
    instructions: |
      ## REFACTORER MODE

      Execute ONE refactoring step safely.

      Publish `refactor.done` when complete, otherwise `refactor.blocked`.

  verifier:
    name: "Verifier"
    description: "Verifies refactoring preserved behavior via tests and checks."
    triggers: ["refactor.done"]
    publishes: ["verify.passed", "verify.failed"]
    default_publishes: verify.passed
    instructions: |
      ## VERIFIER MODE (Node/TypeScript)

      Goal: Always emit a structured JSON payload that includes quality fields.

      Hard requirement: the payload MUST always include all `quality` keys
      (`tests`, `coverage`, `lint`, `audit`, `mutation`, `complexity`) even when
      failing early. If a signal is unavailable, set that field to `"n/a"`.

      ### Required `verify.*` JSON payload shape
      Emit either `verify.passed` or `verify.failed` via `ralph emit` with:

      ```json
      {
        "node": "<node version>",
        "quality": {
          "tests": { "status": "pass|fail|n/a", "command": "..." },
          "coverage": "n/a" | { "status": "reported", "tool": "..." },
          "lint": { "status": "pass|fail|n/a", "command": "...", "errors": 0, "warnings": 0 },
          "audit": "n/a" | { "status": "pass|fail|n/a", "command": "..." },
          "mutation": "n/a" | { "status": "pass|fail|n/a", "tool": "..." },
          "complexity": "n/a" | { "status": "reported", "tool": "..." }
        }
      }
      ```

      Use `"n/a"` when a check/tool isn't configured.

      ### Suggested commands (repo default)
      - Tests: `pnpm -C backend test` (include coverage if enabled in Vitest)
      - Build: `pnpm -C backend build`
      - Lint: `pnpm -C backend lint`

      ### Required helper (schema stability)
      Route *all* `verify.passed`/`verify.failed` emissions through the helper
      so the payload is normalized and never misses required `quality.*` keys:

      ```bash
      node scripts/verifier/emit-verify.mjs verify.passed --json '{"quality":{"tests":{"status":"pass","command":"pnpm -C backend test"}}}'
      ```

