apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        component: tracing
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.54
          ports:
            - containerPort: 16686
              name: ui
              protocol: TCP
            - containerPort: 14268
              name: collector-http
              protocol: TCP
            - containerPort: 14250
              name: collector-grpc
              protocol: TCP
            - containerPort: 6831
              name: agent-compact
              protocol: UDP
            - containerPort: 6832
              name: agent-binary
              protocol: UDP
            - containerPort: 5778
              name: config
              protocol: TCP
            - containerPort: 9411
              name: zipkin
              protocol: TCP
          env:
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            - name: SPAN_STORAGE_TYPE
              value: "memory"
            - name: MEMORY_MAX_TRACES
              value: "10000"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    component: tracing
spec:
  type: ClusterIP
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
      protocol: TCP
    - port: 14268
      targetPort: 14268
      name: collector-http
      protocol: TCP
    - port: 14250
      targetPort: 14250
      name: collector-grpc
      protocol: TCP
    - port: 6831
      targetPort: 6831
      name: agent-compact
      protocol: UDP
    - port: 6832
      targetPort: 6832
      name: agent-binary
      protocol: UDP
    - port: 5778
      targetPort: 5778
      name: config
      protocol: TCP
    - port: 9411
      targetPort: 9411
      name: zipkin
      protocol: TCP
  selector:
    app: jaeger
---
