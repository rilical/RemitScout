                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:RunTask
                  - ecs:ListServices
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:ListTasks
                  - ecs:UpdateService
                Resource: '*'
              - Sid: RdsClusterAccess
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:StartDBCluster
                Resource:
                  - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:remit-scout-prod*
              - Sid: PassRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/remit-scout-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*

Outputs:
  DeployDevRoleArn:
    Value: !GetAtt DeployDevRole.Arn
  DeployStagingRoleArn:
    Value: !GetAtt DeployStagingRole.Arn
  DeployProdRoleArn:
    Value: !GetAtt DeployProdRole.Arn
