                  - ecr:*
                Resource: '*'
              - Sid: FrontendS3
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: arn:aws:s3:::remit-scout-*
              - Sid: FrontendS3Objects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                Resource: arn:aws:s3:::remit-scout-*/*
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: '*'
              - Sid: CloudWatchLogsRead
                Effect: Allow
                Action:
