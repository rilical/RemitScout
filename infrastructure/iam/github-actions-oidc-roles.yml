                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:remit-scout-prod*OpsPauseControllerFuncti*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:remit-scout-prod*OpsPauseControllerFuncti*:*
