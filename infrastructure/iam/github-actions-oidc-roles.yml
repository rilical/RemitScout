AWSTemplateFormatVersion: '2010-09-09'
Description: Remit-Scout GitHub Actions OIDC deploy roles (dev/staging/prod)

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org/user that owns the repo (e.g. rilical)
  GitHubRepo:
    Type: String
    Description: GitHub repo name (e.g. remit-scout-v2)
  OidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider ARN for token.actions.githubusercontent.com

Resources:
  DeployDevRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: remit-scout-gha-deploy-dev
      Description: GitHub Actions deploy role for dev (environment:dev plus develop ref)
      MaxSessionDuration: 21600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Ref OidcProviderArn
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:dev
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/develop
      Policies:
        - PolicyName: remit-scout-gha-deploy-dev
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationRead
                Effect: Allow
                Action:
                  - cloudformation:Describe*
                  - cloudformation:Get*
                  - cloudformation:List*
                  - cloudformation:DetectStackDrift
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:CancelUpdateStack
                  - cloudformation:ContinueUpdateRollback
                Resource: '*'
              - Sid: SsmDeployState
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/remit-scout/dev/*
              - Sid: BootstrapAssume
                Effect: Allow
                Action: sts:AssumeRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*
              - Sid: EcrPushPull
                Effect: Allow
                Action:
                  - ecr:*
                Resource: '*'
              - Sid: FrontendS3
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: arn:aws:s3:::remit-scout-*
              - Sid: FrontendS3Objects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                Resource: arn:aws:s3:::remit-scout-*/*
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: '*'
              - Sid: CloudWatchLogsRead
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: '*'
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*dev*
              - Sid: EventBridgeRead
                Effect: Allow
                Action:
                  - events:ListRules
                Resource: '*'
              - Sid: EventBridgeManage
                Effect: Allow
                Action:
                  - events:EnableRule
                  - events:DisableRule
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/remit-scout-dev*
              - Sid: OpsPauseLambdaDiscover
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                Resource: '*'
              - Sid: OpsPauseLambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:remit-scout-dev*OpsPauseControllerFuncti*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:remit-scout-dev*OpsPauseControllerFuncti*:*
              - Sid: EcsMigrations
                Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:RunTask
                  - ecs:ListServices
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:ListTasks
                  - ecs:UpdateService
                Resource: '*'
              - Sid: RdsClusterAccess
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:StartDBCluster
                Resource:
                  - !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:remit-scout-dev*
              - Sid: PassRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/remit-scout-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*

  DeployStagingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: remit-scout-gha-deploy-staging
      Description: GitHub Actions deploy role for staging (environment:staging plus develop/main/staging refs)
